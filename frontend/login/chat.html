/* ── REQUESTS ── */
async function openRequests() {
  document.getElementById('requests-modal').classList.add('open');
  switchReqTab('incoming');
}
async function switchReqTab(tab) {
  activeReqTab = tab;
  document.getElementById('tab-incoming').classList.toggle('active', tab === 'incoming');
  document.getElementById('tab-outgoing').classList.toggle('active', tab === 'outgoing');
  const endpoint = tab === 'incoming' ? 'requests_list' : 'requests_list_outgoing';
  const res = await fetch(`${API}/${endpoint}`, { credentials: 'include' });
  const data = await res.json();
  renderRequests(data, tab);
}
function renderRequests(data, tab) {
  const list = document.getElementById('requests-list');
  if (!data || !data.length) { list.innerHTML = `<div class="empty-requests">No ${tab} requests</div>`; return; }
  list.innerHTML = data.map((r,i) => {
    const [bg, fg] = avatarColors[i % avatarColors.length];
    const displayName = r[1];
    const date = 'Sent on ' + new Date(r[2]).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    return `
    <div class="request-item" id="req-${r[0]}">
      <div class="request-avatar" style="background:${bg}20;color:${fg}">${displayName.slice(0,2).toUpperCase()}</div>
      <div class="request-info"><div class="request-name">${escapeHtml(displayName)}</div><div class="request-meta">${date}</div></div>
      <div class="request-btns">
        ${tab === 'incoming' ? `<button class="req-accept" onclick="acceptReq(${r[0]},'${displayName}')">Accept</button><button class="req-decline" onclick="declineReq(${r[0]},'${displayName}')">Decline</button>`
        : `<button class="req-decline" onclick="takebackReq(${r[0]},'${displayName}')">Cancel</button>`}
      </div>
    </div>`;
  }).join('');
}
function acceptReq(id, senderUsername) {
  ws.send(JSON.stringify({ type: 'request', id, username: senderUsername, status: 'accept' }));
  document.getElementById(`req-${id}`)?.remove();
  requestCount = Math.max(0, requestCount-1); updateRequestBadge(requestCount);
  if (!document.querySelectorAll('#requests-list .request-item').length) document.getElementById('requests-list').innerHTML = `<div class="empty-requests">No incoming requests</div>`;
}
function declineReq(id, username) {
  ws.send(JSON.stringify({ type: 'request', id, username, status: 'decline' }));
  document.getElementById(`req-${id}`)?.remove();
  requestCount = Math.max(0, requestCount-1); updateRequestBadge(requestCount);
  if (!document.querySelectorAll('#requests-list .request-item').length) document.getElementById('requests-list').innerHTML = `<div class="empty-requests">No ${activeReqTab} requests</div>`;
}
function takebackReq(id, username) {
  ws.send(JSON.stringify({ type: 'request_takeback', id, username }));
  document.getElementById(`req-${id}`)?.remove();
  if (!document.querySelectorAll('#requests-list .request-item').length) document.getElementById('requests-list').innerHTML = `<div class="empty-requests">No ${activeReqTab} requests</div>`;
}
function sendRequest() {
  const input = document.getElementById('send-req-input');
  const username = input.value.trim();
  if (!username || !ws) return;
  ws.send(JSON.stringify({ type: 'request_send', username }));
}
function showReqFeedback(msg, ok) {
  const fb = document.getElementById('send-req-feedback');
  const input = document.getElementById('send-req-input');
  fb.textContent = msg; fb.style.display = 'block'; fb.style.color = ok ? 'var(--success)' : 'var(--danger)';
  input.style.borderColor = ok ? 'rgba(76,175,138,0.5)' : 'rgba(224,92,92,0.5)';
  setTimeout(() => { fb.style.display = 'none'; input.style.borderColor = ''; if (ok) input.value = ''; }, 3000);
}

/* ── BADGE ── */
function updateRequestBadge(count) {
  const navBadge = document.getElementById('nav-badge');
  const bnavBadge = document.getElementById('bnav-badge');
  if (count > 0) {
    const txt = count > 99 ? '99+' : count;
    navBadge.textContent = txt;
    navBadge.style.cssText = `display:unset;width:auto;min-width:16px;height:16px;border-radius:8px;font-size:9px;font-weight:600;color:#fff;padding:0 4px;top:4px;right:4px;background:var(--danger);border:2px solid var(--surface);position:absolute;`;
    bnavBadge.textContent = txt;
    bnavBadge.style.display = '';
  } else {
    navBadge.style.cssText = `display:none;`;
    bnavBadge.style.display = 'none';
  }
}

/* ── SIDEBAR SEARCH ── */
let sidebarSearchTimer = null;
function onSidebarSearch(value) {
  clearTimeout(sidebarSearchTimer);
  const q = value.trim();
  if (!q) { document.querySelector('.sidebar-section-label').textContent = 'Recent'; renderSidebar(); return; }
  sidebarSearchTimer = setTimeout(async () => {
    const res = await fetch(`${API}/search_sidebar/${encodeURIComponent(q)}`, { credentials: 'include' });
    if (!res.ok) return;
    const results = await res.json();
    document.querySelector('.sidebar-section-label').textContent = 'Results';
    const list = document.getElementById('contact-list');
    if (!results || !results.length) { list.innerHTML = `<div style="padding:24px 12px;text-align:center;color:var(--text-dim);font-size:13px">No users found</div>`; return; }
    list.innerHTML = results.map(r => {
      const username = r[0]; const colorIdx = getColorIdx(username); const [bg, fg] = avatarColors[colorIdx];
      const existing = [...sidebarMap.values()].find(e => e.username === username);
      const chat_id = existing ? existing.chat_id : null;
      const isActive = activeChat && existing && activeChat.chat_id === existing.chat_id;
      return `<div class="contact-item search-result-item${isActive?' active':''}" onclick="${chat_id ? `openChat('${chat_id}')` : ''}">
        <div class="contact-avatar" style="background:${bg}20;color:${fg}">${initials(username)}</div>
        <div class="contact-info"><div class="contact-name">${escapeHtml(username)}</div></div>
      </div>`;
    }).join('');
  }, 300);
}

/* ── CHAT SEARCH ── */
let chatSearchResults = [], chatSearchIdx = 0, chatSearchTimer = null;
function toggleChatSearch() {
  if (!activeChat) return;
  const bar = document.getElementById('chat-search-bar');
  if (bar.classList.contains('visible')) { closeChatSearch(); }
  else { bar.classList.add('visible'); document.getElementById('chat-search-input').focus(); }
}
function closeChatSearch() {
  document.getElementById('chat-search-bar').classList.remove('visible');
  document.getElementById('chat-search-input').value = '';
  document.getElementById('chat-search-count').textContent = '';
  chatSearchResults = []; chatSearchIdx = 0;
  document.querySelectorAll('.msg-row.search-match').forEach(el => el.classList.remove('search-match'));
}
function onChatSearch(value) {
  clearTimeout(chatSearchTimer);
  const q = value.trim();
  if (!q) { document.getElementById('chat-search-count').textContent = ''; chatSearchResults = []; document.querySelectorAll('.msg-row.search-match').forEach(el=>el.classList.remove('search-match')); return; }
  chatSearchTimer = setTimeout(() => runChatSearch(q), 350);
}
async function runChatSearch(q) {
  if (!activeChat) return;
  chatSearchResults = []; chatSearchIdx = 0;
  const res = await fetch(`${API}/search_chat/${activeChat.chat_id}/${encodeURIComponent(q)}/999999999`, { credentials: 'include' });
  if (!res.ok) return;
  const rows = await res.json();
  if (!rows || !rows.length) { document.getElementById('chat-search-count').textContent = 'No results'; return; }
  chatSearchResults = rows.map(r => ({ id: r[0], sender: r[1], content: r[2], sent_at: r[3] }));
  chatSearchIdx = 0;
  updateChatSearchCount();
  scrollToSearchResult(chatSearchIdx);
}
function chatSearchStep(dir) { if (!chatSearchResults.length) return; chatSearchIdx = (chatSearchIdx+dir+chatSearchResults.length)%chatSearchResults.length; updateChatSearchCount(); scrollToSearchResult(chatSearchIdx); }
function chatSearchKey(e) { if (e.key==='Enter') { e.shiftKey ? chatSearchStep(-1) : chatSearchStep(1); } if (e.key==='Escape') closeChatSearch(); }
function updateChatSearchCount() { document.getElementById('chat-search-count').textContent = chatSearchResults.length ? `${chatSearchIdx+1} / ${chatSearchResults.length}` : 'No results'; }
function scrollToSearchResult(idx) {
  const match = chatSearchResults[idx]; if (!match) return;
  document.querySelectorAll('.msg-row.search-match').forEach(el => el.classList.remove('search-match'));
  const el = document.querySelector(`.msg-row[data-id="${match.id}"]`);
  if (el) { el.classList.add('search-match'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  jumpToMessage(match);
}
async function jumpToMessage(match) {
  if (!activeChat) return;
  const { chat_id } = activeChat;
  const [beforeRes, afterRes] = await Promise.all([
    fetch(`${API}/load_chat/${match.id+1}/${chat_id}`, { credentials: 'include' }),
    fetch(`${API}/load_chat_after/${match.id-1}/${chat_id}`, { credentials: 'include' })
  ]);
  const beforeRows = await beforeRes.json(); const afterRows = await afterRes.json();
  const before = (beforeRows||[]).map(r=>({id:r[0],chat_id:r[1],sender:r[2],content:r[3],sent_at:r[4],replied_to:r[5]??null,replied_content:null,attachment_url:r[6]??null,content_type:r[7]??null,original_name:r[8]??null,size_bytes:r[9]??null})).reverse();
  const after = (afterRows||[]).map(r=>({id:r[0],chat_id:r[1],sender:r[2],content:r[3],sent_at:r[4],replied_to:r[5]??null,replied_content:null,attachment_url:r[6]??null,content_type:r[7]??null,original_name:r[8]??null,size_bytes:r[9]??null}));
  const matchMsg = { id:match.id, chat_id, sender:match.sender, content:match.content, sent_at:match.sent_at, replied_to:null, replied_content:null, attachment_url:null, content_type:null, original_name:null, size_bytes:null };
  activeChat.messages = [...before, matchMsg, ...after];
  activeChat.oldestId = before.length ? before[0].id : match.id;
  activeChat.hasMore = before.length >= 50;
  activeChat.hasNewer = after.length >= 50;
  renderMessages();
  setTimeout(() => { const t = document.querySelector(`.msg-row[data-id="${match.id}"]`); if (t) { t.classList.add('search-match'); t.scrollIntoView({ behavior:'smooth', block:'center' }); } }, 50);
}

/* ── MOBILE BACK ── */
function closeChatMobile() {
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('main').classList.remove('visible');
  document.body.classList.remove('in-chat');
  activeChat = null; clearReply();
  document.getElementById('typing-pill').classList.remove('visible');
  history.pushState({}, '', window.location.pathname);
}

window.addEventListener('popstate', (e) => {
  const chat_id = e.state?.chat_id;
  if (chat_id && sidebarMap.has(chat_id)) {
    openChat(chat_id);
  } else {
    activeChat = null; clearReply();
    document.getElementById('typing-pill').classList.remove('visible');
    document.getElementById('chat-area').classList.remove('visible');
    document.getElementById('chat-area').style.display = 'none';
    document.getElementById('empty-state').style.display = '';
    if (window.innerWidth <= 768) {
      document.getElementById('sidebar').classList.remove('hidden');
      document.getElementById('main').classList.remove('visible');
      document.body.classList.remove('in-chat');
    }
    renderSidebar();
  }
});

/* ── BOTTOM NAV ── */
function bottomNav(tab, btn) {
  document.querySelectorAll('.bottom-nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

/* ── UTILS ── */
function setNav(btn) { document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(o => { o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); }); });
function showToast(msg, isDanger = false) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.toggle('danger', isDanger); t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
