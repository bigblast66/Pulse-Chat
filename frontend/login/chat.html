<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0b0c10;
  --surface: rgba(18,19,26,0.85);
  --surface2: rgba(28,30,42,0.8);
  --surface3: rgba(38,40,56,0.75);
  --surface-solid: #13141c;
  --border: rgba(91,106,240,0.1);
  --border2: rgba(91,106,240,0.2);
  --border3: rgba(255,255,255,0.06);
  --text: #eeeef2;
  --text-muted: #9698ab;
  --text-dim: #7e819a; /* Brightened from #4a4d64 to pass WCAG AA (5.7:1 contrast) */
  --accent: #5b6af0;
  --accent-hover: #6e7cf2;
  --accent-dim: rgba(91,106,240,0.12);
  --accent-glow: rgba(91,106,240,0.25);
  --danger: #e05c5c;
  --success: #4caf8a;
  --online: #4caf8a;
  --away: #e0c85c;
  --radius: 12px;
  --radius-sm: 8px;
  --sidebar-w: 300px;
  --nav-w: 62px;
  --bottom-nav-h: 58px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --glass-blur: blur(16px);
}

html, body { height: 100%; height: 100dvh; overflow: hidden; overflow-x: clip; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  position: relative;
}

/* Ambient background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 8% 15%, rgba(91,106,240,0.11) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 92% 85%, rgba(139,92,246,0.07) 0%, transparent 50%),
    radial-gradient(ellipse 80% 60% at 50% 50%, rgba(11,12,16,1) 0%, rgba(8,9,13,1) 100%);
  pointer-events: none;
  z-index: 0;
}

/* ═══════════════════════════════════════════════
   NAV RAIL
═══════════════════════════════════════════════ */
.nav-rail {
  width: var(--nav-w);
  height: 100dvh;
  background: rgba(13,14,20,0.9);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 4px;
  flex-shrink: 0;
  z-index: 10;
  position: relative;
}

.nav-logo {
  width: 38px; height: 38px;
  background: var(--accent);
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px; flex-shrink: 0;
  box-shadow: 0 0 20px var(--accent-glow);
}
.nav-logo svg { width: 18px; height: 18px; }

.nav-btn {
  width: 42px; height: 42px;
  border-radius: 10px;
  border: none; background: transparent;
  color: var(--text-dim); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
  position: relative;
}
.nav-btn svg { width: 18px; height: 18px; }
.nav-btn:hover { background: rgba(91,106,240,0.08); color: var(--text-muted); }
.nav-btn:active { transform: scale(0.95); }
.nav-btn.active { background: var(--accent-dim); color: var(--accent); }

.nav-badge {
  display: none;
  position: absolute; top: 6px; right: 6px;
  width: 7px; height: 7px;
  background: var(--danger);
  border-radius: 50%;
  border: 2px solid var(--surface-solid);
}
.nav-spacer { flex: 1; }

.nav-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--accent-dim);
  border: 2px solid var(--border2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; color: var(--accent);
  transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
  position: relative;
}
.nav-avatar:hover { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
.nav-avatar:active { transform: scale(0.95); }
.nav-avatar .status-dot {
  position: absolute; bottom: 0; right: 0;
  width: 9px; height: 9px;
  background: var(--online);
  border-radius: 50%; border: 2px solid var(--surface-solid);
}

/* ═══════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════ */
.sidebar {
  width: var(--sidebar-w);
  height: 100dvh;
  background: rgba(13,14,20,0.75);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  flex-shrink: 0;
  position: relative;
  z-index: 5;
}

.sidebar-header {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
}
.sidebar-title {
  font-size: 16px; font-weight: 700; color: var(--text);
  margin-bottom: 14px; letter-spacing: -0.3px;
}

.search-wrap { position: relative; }
.search-wrap svg {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; color: var(--text-dim); pointer-events: none;
}
.search-input {
  width: 100%;
  background: rgba(91,106,240,0.06);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px 8px 34px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text);
  outline: none; transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
}
.search-input::placeholder { color: var(--text-dim); }
.search-input:focus { border-color: var(--border2); background: rgba(91,106,240,0.09); }

.sidebar-section-label {
  padding: 14px 16px 6px;
  font-size: 10px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: var(--text-dim);
}

.contact-list {
  flex: 1; overflow-y: auto; padding: 4px 8px;
}
.contact-list::-webkit-scrollbar { width: 3px; }
.contact-list::-webkit-scrollbar-track { background: transparent; }
.contact-list::-webkit-scrollbar-thumb { background: rgba(91,106,240,0.15); border-radius: 2px; }

.contact-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 10px; border-radius: 10px;
  cursor: pointer; 
  transition: background 0.18s ease, transform 0.12s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  position: relative;
  border-left: 2px solid transparent;
}
.contact-item:hover { background: rgba(91,106,240,0.07); }
.contact-item:active { transform: scale(0.98); }
.contact-item.active {
  background: var(--accent-dim);
  border-left: 2px solid var(--accent);
  padding-left: 8px;
  transition: background 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease;
}
.contact-item.active .contact-name { color: var(--text); }

.contact-avatar {
  width: 44px; height: 44px;
  border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; position: relative;
  border: 1.5px solid rgba(255,255,255,0.06);
}
.contact-info { flex: 1; min-width: 0; }
.contact-name { font-size: 14px; font-weight: 500; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact-preview { font-size: 12.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.contact-preview.typing-preview { color: var(--accent); display: flex; align-items: center; gap: 4px; }

.typing-dots-sm { display: inline-flex; gap: 2px; align-items: center; }
.typing-dots-sm span { width: 3px; height: 3px; background: var(--accent); border-radius: 50%; animation: typingBounce 1.2s infinite; }
.typing-dots-sm span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots-sm span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-3px); opacity: 1; }
}

.contact-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.contact-time { font-size: 11px; color: var(--text-dim); }
.unread-badge {
  background: var(--accent); color: #fff;
  font-size: 10px; font-weight: 700; border-radius: 10px;
  padding: 1px 6px; min-width: 18px; text-align: center;
  box-shadow: 0 2px 8px var(--accent-glow);
}

/* ═══════════════════════════════════════════════
   MAIN / CHAT AREA
═══════════════════════════════════════════════ */
.main {
  flex: 1; display: flex; flex-direction: column;
  height: 100dvh; overflow: hidden;
  position: relative; z-index: 1;
}

.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; color: var(--text-dim);
}
.empty-icon {
  width: 58px; height: 58px;
  background: rgba(91,106,240,0.08);
  border: 1px solid var(--border);
  border-radius: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px;
}
.empty-icon svg { width: 26px; height: 26px; color: var(--accent); opacity: 0.6; }
.empty-title { font-size: 15px; font-weight: 600; color: var(--text-muted); }
.empty-sub { font-size: 13px; color: var(--text-dim); text-align: center; max-width: 220px; line-height: 1.5; }

.chat-area { display: none; flex-direction: column; height: 100%; }
.chat-area.visible { display: flex; }

.chat-header {
  padding: 0 14px 0 10px;
  height: 58px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  background: rgba(13,14,20,0.75);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
}
.chat-header-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.chat-header-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; flex-shrink: 0;
  border: 1.5px solid rgba(255,255,255,0.07);
}
.chat-header-info { flex: 1; min-width: 0; }
.chat-header-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-header-status { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.typing-status { color: var(--accent) !important; display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; }
.typing-dots { display: inline-flex; gap: 3px; align-items: center; }
.typing-dots span { width: 4px; height: 4px; background: var(--accent); border-radius: 50%; animation: typingBounce 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
.typing-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 auto; }

.chat-header-actions { display: flex; gap: 2px; flex-shrink: 0; }

.icon-btn {
  width: 36px; height: 36px; border-radius: 9px;
  border: none; background: transparent; color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease;
}
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn:hover { background: rgba(91,106,240,0.1); color: var(--text-muted); }
.icon-btn:active { transform: scale(0.92); }

.messages-area {
  flex: 1; overflow-y: auto;overflow-x: hidden;
  padding: 18px 16px 10px;
  display: flex; flex-direction: column; gap: 4px;
  position: relative;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.messages-area::-webkit-scrollbar { width: 3px; }
.messages-area::-webkit-scrollbar-track { background: transparent; }
.messages-area::-webkit-scrollbar-thumb { background: rgba(91,106,240,0.15); border-radius: 2px; }

/* Typing pill */
.typing-pill {
  display: none; position: sticky; bottom: 8px; align-self: flex-start;
  align-items: center; gap: 8px;
  background: rgba(28,30,42,0.85);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border2);
  border-radius: 20px; padding: 5px 14px;
  font-size: 12px; color: var(--text-muted);
  margin-top: 4px; z-index: 5; pointer-events: none;
  animation: fadeInPill 0.2s ease;
}
.typing-pill.visible { display: flex; }
@keyframes fadeInPill { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.load-more-btn {
  align-self: center;
  background: rgba(91,106,240,0.08);
  border: 1px solid var(--border);
  border-radius: 20px; color: var(--text-muted); font-size: 12px;
  font-family: 'DM Sans', sans-serif; padding: 5px 16px; cursor: pointer;
  margin-bottom: 8px; transition: background 0.18s ease, transform 0.12s ease;
}
.load-more-btn:hover { background: rgba(91,106,240,0.14); }
.load-more-btn:active { transform: scale(0.96); }

.msg-date-divider {
  text-align: center; font-size: 11px; color: var(--text-dim);
  margin: 12px 0 8px; position: relative;
}
.msg-date-divider::before, .msg-date-divider::after {
  content: ''; position: absolute; top: 50%;
  width: calc(50% - 54px); height: 1px; background: var(--border);
}
.msg-date-divider::before { left: 0; }
.msg-date-divider::after { right: 0; }

.msg-row { display: flex; gap: 6px; align-items: flex-end; max-width: 100%; }
.msg-row.mine { flex-direction: row-reverse; }

.msg-avatar-sm {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; margin-bottom: 2px;
}

.msg-wrap { max-width: 72vw; display: flex; flex-direction: column; gap: 2px; position: relative; }

/* Reply button */
.reply-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--border2); background: rgba(28,30,42,0.9); color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.12s ease;
  flex-shrink: 0; z-index: 2;
}
.reply-btn svg { width: 13px; height: 13px; }
.reply-btn:hover { background: var(--accent-dim); color: var(--accent); }
.reply-btn:active { transform: translateY(-50%) scale(0.9); }
.msg-row:not(.mine) .reply-btn { right: -36px; }
.msg-row.mine .reply-btn { left: -36px; }
.msg-row:hover .reply-btn { opacity: 1; pointer-events: auto; }

.msg-bubble {
  padding: 9px 14px; border-radius: 18px;
  font-size: 14px; line-height: 1.55;
  word-break: break-word; white-space: pre-wrap;
}
.msg-row:not(.mine) .msg-bubble {
  background: rgba(28,30,42,0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--text);
  border: 1px solid var(--border3);
  border-bottom-left-radius: 4px;
}
.msg-row.mine .msg-bubble {
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
  box-shadow: 0 4px 18px var(--accent-glow);
}

.reply-quote {
  border-radius: 10px 10px 0 0; padding: 6px 10px;
  font-size: 12px; line-height: 1.4;
  border-left: 3px solid rgba(255,255,255,0.3);
  margin-bottom: -6px; cursor: pointer; overflow: hidden;
  transition: background 0.15s ease;
}
.reply-quote:hover { background: rgba(91,106,240,0.1); }
.reply-quote-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; word-break: break-word; }
.msg-row:not(.mine) .reply-quote { background: rgba(38,40,56,0.8); border-left-color: var(--accent); color: var(--text-muted); border-radius: 10px 10px 0 0; }
.msg-row.mine .reply-quote { background: rgba(0,0,0,0.2); border-left-color: rgba(255,255,255,0.5); color: rgba(255,255,255,0.7); }
.reply-quote-sender { font-weight: 600; font-size: 11px; margin-bottom: 2px; }
.msg-row:not(.mine) .reply-quote-sender { color: var(--accent); }
.msg-row.mine .reply-quote-sender { color: rgba(255,255,255,0.85); }

.msg-time { font-size: 10.5px; color: var(--text-dim); margin-top: 3px; text-align: right; padding: 0 4px; }
.msg-row.mine .msg-time { text-align: left; }

/* Reply bar above input */
.reply-bar {
  display: none; padding: 8px 14px 0;
  gap: 10px; align-items: center;
  animation: slideUpSmall 0.15s ease;
}
.reply-bar.visible { display: flex; }
@keyframes slideUpSmall { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.reply-bar-inner {
  flex: 1; background: rgba(28,30,42,0.8);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent); border-radius: 8px;
  padding: 6px 10px; min-width: 0;
}
.reply-bar-label { font-size: 11px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
.reply-bar-preview { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reply-cancel {
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: rgba(38,40,56,0.8); color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease;
}
.reply-cancel:hover { background: rgba(224,92,92,0.15); color: var(--danger); }
.reply-cancel:active { transform: scale(0.9); }
.reply-cancel svg { width: 12px; height: 12px; }

/* Input area */
.chat-input-area {
  padding: 10px 14px;
  padding-bottom: calc(10px + var(--safe-bottom));
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  background: rgba(13,14,20,0.75);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
}
.input-row {
  display: flex; align-items: center; gap: 8px;
  background: rgba(28,30,42,0.8);
  border: 1px solid var(--border2);
  border-radius: 24px; padding: 6px 6px 6px 14px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  backdrop-filter: blur(8px);
}
.input-row:focus-within {
  border-color: rgba(91,106,240,0.35);
  box-shadow: 0 0 0 3px rgba(91,106,240,0.06);
}
.msg-input {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text);
  resize: none; max-height: 100px; line-height: 1.5;
  outline: none !important; 
}
.msg-input::placeholder { color: var(--text-dim); }
.send-btn {
  width: 36px; height: 36px; background: var(--accent); border: none;
  border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease; flex-shrink: 0;
  box-shadow: 0 3px 12px var(--accent-glow);
}
.send-btn:hover { background: var(--accent-hover); box-shadow: 0 4px 16px var(--accent-glow); }
.send-btn:active { transform: scale(0.88); }
.send-btn svg { width: 15px; height: 15px; color: #fff; }

/* Attach button */
.attach-btn {
  width: 34px; height: 34px; border-radius: 50%; border: none;
  background: transparent; color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease; flex-shrink: 0;
}
.attach-btn:hover { background: var(--accent-dim); color: var(--accent); }
.attach-btn:active { transform: scale(0.9); }
.attach-btn svg { width: 18px; height: 18px; }

/* Upload progress bar */
.upload-bar {
  display: none; align-items: center; gap: 10px;
  padding: 8px 14px; background: rgba(28,30,42,0.8);
  border: 1px solid var(--border); border-radius: 10px;
  margin: 0 14px 8px; flex-shrink: 0; animation: slideUpSmall 0.15s ease;
}
.upload-bar.visible { display: flex; }
.upload-bar-name { font-size: 12px; color: var(--text-muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.upload-track { flex: 1; height: 3px; background: rgba(91,106,240,0.12); border-radius: 2px; overflow: hidden; min-width: 40px; }
.upload-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.2s ease; }
.upload-pct { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
.upload-cancel { width: 20px; height: 20px; border-radius: 50%; border: none; background: transparent; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: color 0.15s ease; }
.upload-cancel:hover { color: var(--danger); }
.upload-cancel svg { width: 10px; height: 10px; }

/* Attachment bubbles */
.msg-attachment { max-width: 100%; border-radius: 12px; overflow: hidden; }
.msg-img { max-width: 240px; max-height: 300px; width: 100%; display: block; border-radius: 12px; cursor: pointer; object-fit: cover; transition: transform 0.2s ease; }
.msg-img:hover { transform: scale(1.02); }
@media (max-width: 768px) { .msg-img { max-width: 60vw; } }
.msg-file-card {
  display: flex; align-items: center; gap: 10px;
  background: rgba(0,0,0,0.18); border-radius: 10px;
  padding: 9px 12px; text-decoration: none; min-width: 180px;
  border: 1px solid rgba(255,255,255,0.06);
  transition: background 0.18s ease, transform 0.12s ease;
}
.msg-file-card:hover { background: rgba(0,0,0,0.28); }
.msg-file-card:active { transform: scale(0.98); }
.msg-file-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.msg-file-icon svg { width: 16px; height: 16px; color: #fff; }
.msg-file-info { min-width: 0; }
.msg-file-name { font-size: 12.5px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.msg-file-size { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 1px; }
.msg-row:not(.mine) .msg-file-card { background: rgba(91,106,240,0.07); border-color: var(--border); }
.msg-row:not(.mine) .msg-file-name { color: var(--text); }
.msg-row:not(.mine) .msg-file-size { color: var(--text-dim); }
.msg-row:not(.mine) .msg-file-icon { background: var(--accent-dim); }
.msg-row:not(.mine) .msg-file-icon svg { color: var(--accent); }

/* Caption text under attachment */
.msg-caption { font-size: 13px; line-height: 1.4; margin-top: 5px; word-break: break-word; white-space: pre-wrap; }

/* File preview tray */
.file-tray {
  display: none; align-items: center; gap: 10px;
  padding: 8px 14px; background: rgba(28,30,42,0.8);
  border-top: 1px solid var(--border); flex-shrink: 0;
  animation: slideUpSmall 0.15s ease;
}
.file-tray.visible { display: flex; }
.file-tray-inner {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
}
.file-tray-preview-img {
  width: 52px; height: 52px; border-radius: 10px;
  object-fit: cover; flex-shrink: 0; background: rgba(38,40,56,0.8);
}
.file-tray-preview-icon {
  width: 52px; height: 52px; border-radius: 10px;
  background: var(--accent-dim); display: flex; align-items: center;
  justify-content: center; flex-shrink: 0;
}
.file-tray-preview-icon svg { width: 22px; height: 22px; color: var(--accent); }
.file-tray-info { min-width: 0; }
.file-tray-name { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-tray-size { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
.file-tray-remove {
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: rgba(38,40,56,0.8); color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease;
}
.file-tray-remove:hover { background: rgba(224,92,92,0.2); color: var(--danger); }
.file-tray-remove:active { transform: scale(0.9); }
.file-tray-remove svg { width: 11px; height: 11px; }

.msg-input.has-file::placeholder { color: var(--text-dim); }

/* Chat search bar */
.chat-search-bar {
  display: none; padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  background: rgba(13,14,20,0.75);
  backdrop-filter: blur(12px);
  gap: 8px; align-items: center; flex-shrink: 0;
}
.chat-search-bar.visible { display: flex; }
.chat-search-bar input {
  flex: 1; background: rgba(91,106,240,0.06); border: 1px solid var(--border);
  border-radius: 9px; padding: 7px 10px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text);
  outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.chat-search-bar input:focus { border-color: var(--border2); box-shadow: 0 0 0 2px rgba(91,106,240,0.1); }
.chat-search-bar input::placeholder { color: var(--text-dim); }
.chat-search-nav { display: flex; align-items: center; gap: 2px; }
.chat-search-count { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
.search-highlight { background: rgba(91,106,240,0.35); border-radius: 2px; color: #fff; }
.msg-row.search-match .msg-bubble { outline: 1px solid var(--accent); outline-offset: 2px; border-radius: 16px; }

@keyframes msgFlash {
  0% { background: transparent; }
  20% { background: rgba(91,106,240,0.18); }
  100% { background: transparent; }
}
.msg-row.flash-highlight { border-radius: 10px; animation: msgFlash 1.1s ease forwards; }

/* ═══════════════════════════════════════════════
   MODALS / OVERLAYS
═══════════════════════════════════════════════ */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 200; display: none;
  align-items: flex-end; justify-content: center;
  animation: fadeIn 0.15s ease;
}
.overlay.open { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: rgba(18,19,26,0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border2);
  border-radius: 22px 22px 0 0; width: 100%; max-height: 90vh;
  animation: slideUpModal 0.25s ease; overflow-y: auto;
}

@media (min-width: 769px) {
  .overlay { align-items: center; }
  .modal { border-radius: 18px; max-width: 420px; max-height: 85vh; }
}

@keyframes slideUpModal { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 14px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  background: rgba(18,19,26,0.96);
  backdrop-filter: blur(20px);
  z-index: 1;
}
.modal-handle {
  width: 36px; height: 4px; background: rgba(91,106,240,0.2);
  border-radius: 2px; margin: 10px auto 4px; flex-shrink: 0;
}
@media (min-width: 769px) { .modal-handle { display: none; } }

.modal-title { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
.close-btn {
  width: 28px; height: 28px; border-radius: 8px;
  border: none; background: transparent; color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease;
}
.close-btn:hover { background: rgba(91,106,240,0.1); color: var(--text-muted); }
.close-btn:active { transform: scale(0.9); }
.close-btn svg { width: 15px; height: 15px; }

/* Profile modal */
.profile-hero {
  padding: 24px 24px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
}
.profile-avatar-lg {
  width: 74px; height: 74px; border-radius: 50%;
  background: var(--accent-dim); border: 2px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 600; color: var(--accent);
  position: relative; cursor: pointer;
  box-shadow: 0 0 28px var(--accent-glow);
  transition: transform 0.15s ease;
}
.profile-avatar-lg:active { transform: scale(0.96); }
.avatar-edit-hint {
  position: absolute; inset: 0; background: rgba(0,0,0,0.5);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.15s ease;
}
.profile-avatar-lg:hover .avatar-edit-hint { opacity: 1; }
.avatar-edit-hint svg { width: 18px; height: 18px; color: #fff; }
.profile-name-display { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
.profile-email-display { font-size: 12.5px; color: var(--text-muted); margin-top: -6px; }
.profile-status-chip {
  display: flex; align-items: center; gap: 6px;
  background: rgba(76,175,138,0.1); border: 1px solid rgba(76,175,138,0.2);
  border-radius: 20px; padding: 4px 12px; font-size: 12px; color: rgba(76,175,138,0.9);
}
.profile-status-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--online); }
.profile-fields { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.profile-field label { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); margin-bottom: 6px; }
.profile-field input, .profile-field textarea {
  width: 100%; background: rgba(91,106,240,0.05); border: 1px solid var(--border);
  border-radius: 9px; padding: 9px 12px;
  font-family: 'DM Sans', sans-serif; font-size: 13.5px; color: var(--text);
  outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease; resize: none;
}
.profile-field input:focus, .profile-field textarea:focus { border-color: var(--border2); box-shadow: 0 0 0 2px rgba(91,106,240,0.08); }
.profile-field input[readonly] { color: var(--text-muted); cursor: default; }
.profile-actions { padding: 0 20px 20px; padding-bottom: calc(20px + var(--safe-bottom)); display: flex; gap: 8px; }

.btn-primary {
  flex: 1; padding: 11px 0;
  background: var(--accent); border: none; border-radius: 9px;
  color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
  box-shadow: 0 4px 14px var(--accent-glow);
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { transform: scale(0.98); }
.btn-secondary {
  padding: 11px 16px; background: transparent;
  border: 1px solid var(--border2); border-radius: 9px;
  color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: background 0.18s ease, transform 0.12s ease;
}
.btn-secondary:hover { background: rgba(91,106,240,0.07); }
.btn-secondary:active { transform: scale(0.98); }

/* Requests modal */
.req-tabs { display: flex; border-bottom: 1px solid var(--border); }
.req-tab {
  flex: 1; padding: 12px 0;
  background: transparent; border: none; border-bottom: 2px solid transparent;
  font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 500;
  color: var(--text-dim); cursor: pointer; 
  transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
}
.req-tab:hover { background: rgba(91,106,240,0.05); }
.req-tab:active { transform: scale(0.98); }
.req-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.requests-list { padding: 8px 12px 16px; display: flex; flex-direction: column; gap: 4px; max-height: 340px; overflow-y: auto; }
.request-item { 
  display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 9px; 
  transition: background 0.18s ease, transform 0.12s ease; 
}
.request-item:hover { background: rgba(91,106,240,0.06); }
.request-item:active { transform: scale(0.98); }
.request-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
.request-info { flex: 1; min-width: 0; }
.request-name { font-size: 14px; font-weight: 500; color: var(--text); }
.request-meta { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
.request-btns { display: flex; gap: 6px; }
.req-accept { padding: 6px 14px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s ease, transform 0.12s ease; }
.req-accept:hover { background: var(--accent-hover); }
.req-accept:active { transform: scale(0.95); }
.req-decline { padding: 6px 12px; background: transparent; border: 1px solid var(--border2); border-radius: 8px; color: var(--text-muted); font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.18s ease, transform 0.12s ease; }
.req-decline:hover { background: rgba(91,106,240,0.07); }
.req-decline:active { transform: scale(0.95); }
.empty-requests { padding: 40px 20px; text-align: center; color: var(--text-dim); font-size: 13px; }

/* Create group — member picker */
.grp-chips-wrap {
  display: none; flex-wrap: wrap; gap: 6px;
  padding: 0 20px 14px;
}
.grp-chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--accent-dim); border: 1px solid var(--border2);
  border-radius: 20px; padding: 4px 6px 4px 4px;
  font-size: 12.5px; color: var(--text);
  animation: chipIn 0.15s ease;
}
@keyframes chipIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
.grp-chip-avatar {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700;
}
.grp-chip-remove {
  width: 16px; height: 16px; border-radius: 50%; border: none;
  background: rgba(255,255,255,0.08); color: var(--text-dim);
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease;
}
.grp-chip-remove:hover { background: rgba(224,92,92,0.2); color: var(--danger); }
.grp-chip-remove:active { transform: scale(0.88); }
.grp-chip-remove svg { width: 8px; height: 8px; }

.grp-member-list { padding: 4px 12px 16px; max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.grp-member-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 10px; cursor: pointer;
  transition: background 0.18s ease, transform 0.12s ease;
}
.grp-member-row:hover { background: rgba(91,106,240,0.06); }
.grp-member-row:active { transform: scale(0.98); }
.grp-member-avatar {
  width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  border: 1.5px solid rgba(255,255,255,0.06);
}
.grp-member-name { flex: 1; font-size: 13.5px; font-weight: 500; color: var(--text); }
.grp-check {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  border: 1.5px solid var(--border2); background: transparent;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.18s ease, border-color 0.18s ease;
}
.grp-check svg { width: 11px; height: 9px; opacity: 0; transform: scale(0.5); transition: opacity 0.15s ease, transform 0.15s ease; }
.grp-member-row.selected { background: rgba(91,106,240,0.05); }
.grp-member-row.selected .grp-check { background: var(--accent); border-color: var(--accent); box-shadow: 0 2px 8px var(--accent-glow); }
.grp-member-row.selected .grp-check svg { opacity: 1; transform: scale(1); }

/* Toast */
.toast {
  position: fixed; bottom: calc(var(--bottom-nav-h) + 12px + var(--safe-bottom)); left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: rgba(28,30,42,0.95);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border2);
  border-radius: 10px; padding: 10px 18px;
  font-size: 13px; font-weight: 500; color: var(--text);
  opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 300; display: flex; align-items: center; gap: 8px;
  white-space: nowrap;
  max-width: calc(100vw - 32px);
}
#toast-msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
.toast.danger .toast-dot { background: var(--danger); }

/* Lightbox */
.lightbox {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,0.94);
  backdrop-filter: blur(2px);
  display: none; align-items: center; justify-content: center;
  flex-direction: column;
  animation: fadeIn 0.15s ease;
}
.lightbox.open { display: flex; }
.lightbox-topbar {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 14px 16px;
  padding-top: calc(14px + var(--safe-top));
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; z-index: 2;
}
.lightbox-info { min-width: 0; }
.lightbox-name { font-size: 13.5px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.lightbox-size { font-size: 11.5px; color: rgba(255,255,255,0.55); margin-top: 1px; }
.lightbox-actions { display: flex; gap: 4px; flex-shrink: 0; }
.lightbox-btn {
  width: 38px; height: 38px; border-radius: 50%; border: none;
  background: rgba(255,255,255,0.1); color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.18s ease, transform 0.12s ease;
}
.lightbox-btn:hover { background: rgba(255,255,255,0.18); }
.lightbox-btn:active { transform: scale(0.9); }
.lightbox-btn svg { width: 18px; height: 18px; }
.lightbox-body {
  flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
  padding: 70px 16px; overflow: hidden;
}
.lightbox-body img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
.lightbox-body video { max-width: 100%; max-height: 100%; border-radius: 6px; }
.lightbox-body audio { width: min(400px, 90vw); }
.lightbox-caption {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 14px 16px;
  padding-bottom: calc(14px + var(--safe-bottom));
  font-size: 13.5px; color: rgba(255,255,255,0.85);
  text-align: center; background: linear-gradient(transparent, rgba(0,0,0,0.5));
}

/* ═══════════════════════════════════════════════
   BOTTOM NAV — mobile only
═══════════════════════════════════════════════ */
.bottom-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--bottom-nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(13,14,20,0.9);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-top: 1px solid var(--border);
  z-index: 50;
  flex-direction: row; align-items: stretch;
}
.bottom-nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px;
  border: none; background: transparent; color: var(--text-dim);
  cursor: pointer; transition: color 0.18s ease, transform 0.12s ease; position: relative;
  padding: 0;
}
.bottom-nav-btn svg { width: 22px; height: 22px; }
.bottom-nav-btn span { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 500; }
.bottom-nav-btn.active { color: var(--accent); }
.bottom-nav-btn:active { transform: scale(0.95); }
.bottom-nav-badge {
  position: absolute; top: 6px;
  right: calc(50% - 18px);
  background: var(--danger); color: #fff;
  font-size: 9px; font-weight: 700; border-radius: 8px;
  padding: 1px 5px; min-width: 16px; text-align: center;
  border: 2px solid var(--surface-solid);
}

/* ═══════════════════════════════════════════════
   DESKTOP / MOBILE LAYOUT
═══════════════════════════════════════════════ */
@media (min-width: 769px) {
  .nav-rail { display: flex; }
  .sidebar { display: flex; width: var(--sidebar-w); position: static; }
  .main { display: flex; position: static; }
  .bottom-nav { display: none !important; }
 
  .toast { bottom: 24px; }
}

@media (max-width: 768px) {
  .nav-rail { display: none; }
   .back-btn { display: flex !important; }
  .bottom-nav { display: flex; }
  .main.visible ~ .bottom-nav,
  body.in-chat .bottom-nav { display: none !important; }
  .sidebar {
    position: fixed; inset: 0;
    width: 100%; z-index: 40;
    transform: translateX(0);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    padding-bottom: calc(var(--bottom-nav-h) + var(--safe-bottom));
  }
  .sidebar.hidden { transform: translateX(-100%); pointer-events: none; }
  .sidebar-title { font-size: 20px; font-weight: 700; margin-bottom: 14px; padding-top: 8px; }
  .contact-avatar { width: 48px; height: 48px; font-size: 16px; }
  .contact-name { font-size: 15px; }
  .contact-preview { font-size: 13px; }
  .contact-item { padding: 10px 8px; }
  .main {
    position: fixed; inset: 0;
    width: 100%;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    z-index: 45;
  }
  .main.visible { transform: translateX(0); }
  .chat-header { height: 60px; padding: 0 8px 0 4px; }
  .msg-wrap { max-width: calc(100vw - 68px); }
  .msg-bubble { font-size: 14px; }
  .chat-input-area { padding: 10px 12px; padding-bottom: calc(10px + var(--safe-bottom)); }
  .main:not(.visible) .empty-state { display: none; }
  .search-input { padding: 9px 10px 9px 34px; font-size: 14px; border-radius: 10px; }
  .msg-time { font-size: 11px; }
}

.sidebar-section-label.search-label { color: var(--accent); }
.contact-item.search-result-item .contact-preview { color: var(--text-muted); }

/* ═══════════════════════════════════════════════
   SKELETON LOADING
═══════════════════════════════════════════════ */
@keyframes shimmer {
  0% { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}

.skeleton {
  background: rgba(38,40,56,0.5);
  background-image: linear-gradient(
    90deg, 
    rgba(255, 255, 255, 0) 0%, 
    rgba(255, 255, 255, 0.04) 20%, 
    rgba(255, 255, 255, 0) 40%
  );
  background-size: 800px 100%;
  animation: shimmer 1.5s infinite linear;
  border-radius: var(--radius-sm);
}

.skeleton-avatar { border-radius: 50%; }
.skeleton-line { height: 12px; margin-bottom: 6px; border-radius: 4px; }

/* ═══════════════════════════════════════════════
   DRAG & DROP OVERLAY
═══════════════════════════════════════════════ */
.drag-over {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(20, 21, 32, 0.55);
  backdrop-filter: blur(10px) saturate(1.2);
  -webkit-backdrop-filter: blur(10px) saturate(1.2);
  border: 2px dashed transparent;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease, border-color 0.2s ease;
  z-index: 9999;
}
.drag-over.is-visible {
  opacity: 1;
  border-color: var(--accent);
}
.drag-over-inner {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  color: var(--accent);
  font-size: 18px; font-weight: 500; letter-spacing: 0.3px;
  text-shadow: 0 2px 20px rgba(91,106,240,0.4);
}

<script>
const API = 'http://127.0.0.1:8000';

let activeReqTab = 'incoming';
let requestCount = 0;

const sidebarMap = new Map();
let sidebarOldestId = 999999999;
let sidebarLoadingMore = false;
let sidebarAllLoaded = false;

const typingUsers = new Map();
let lastTypingPing = 0;
const TYPING_THROTTLE = 2500;

let replyingTo = null;
let activeChat = null;

const avatarColors = [
  ['#3b4fd4','#c7cbf9'],['#2e7d5e','#a8d5c2'],['#8b3a3a','#f5c2c2'],
  ['#5a3e8a','#d0bbf5'],['#8a5a1a','#f5d8a0'],['#1a5a8a','#a0d4f5'],
];

function getColorIdx(username) {
  let h = 0;
  for (let i = 0; i < username.length; i++) h = (h * 31 + username.charCodeAt(i)) & 0xfffffff;
  return h % avatarColors.length;
}
function initials(name) { return (name || '??').slice(0, 2).toUpperCase(); }

function formatTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr.endsWith('Z') ? dateStr : dateStr + 'Z');
  const now = new Date();
  const diffMin = Math.floor((now - d) / 60000);
  if (diffMin < 1) return 'now';
  if (diffMin < 60) return `${diffMin}m`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return `${diffH}h`;
  const diffD = Math.floor(diffH / 24);
  if (diffD === 1) return 'yday';
  if (diffD < 7) return `${diffD}d`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function toTs(dateStr) {
  if (!dateStr) return 0;
  const d = new Date(dateStr.endsWith('Z') ? dateStr : dateStr + 'Z');
  return d.getTime();
}
function formatMsgTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr.endsWith('Z') ? dateStr : dateStr + 'Z');
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function formatMsgDate(dateStr) {
  if (!dateStr) return 'Today';
  const d = new Date(dateStr.endsWith('Z') ? dateStr : dateStr + 'Z');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const msgDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffD = Math.round((today - msgDay) / 86400000);
  if (diffD === 0) return 'Today';
  if (diffD === 1) return 'Yesterday';
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── TYPING ── */
function typingKey(username, chat_id) { return `${chat_id}::${username}`; }
function getTypingUserForChat(chat_id) {
  const prefix = `${chat_id}::`;
  for (const key of typingUsers.keys()) {
    if (key.startsWith(prefix)) return key.slice(prefix.length);
  }
  return null;
}
function isAnyoneTypingInChat(chat_id) { return getTypingUserForChat(chat_id) !== null; }
function setTyping(username, chat_id) {
  const key = typingKey(username, chat_id);
  if (typingUsers.has(key)) clearTimeout(typingUsers.get(key));
  const timer = setTimeout(() => clearTyping(username, chat_id), 3500);
  typingUsers.set(key, timer);
  updateTypingUI(username, chat_id, true);
}
function clearTyping(username, chat_id) {
  const key = typingKey(username, chat_id);
  if (typingUsers.has(key)) { clearTimeout(typingUsers.get(key)); typingUsers.delete(key); }
  updateTypingUI(username, chat_id, false);
}
function updateTypingUI(username, chat_id, isTyping) {
  const entry = sidebarMap.get(chat_id);
  if (entry) {
    const el = document.querySelector(`#sidebar-${chat_id} .contact-preview`);
    if (el) {
      const typers = getTypingUsersForChat(chat_id);
      if (typers.length) {
        el.className = 'contact-preview typing-preview';
        el.innerHTML = `<span class="typing-dots-sm"><span></span><span></span><span></span></span> ${formatTypers(typers)} typing…`;
      } else {
        el.className = 'contact-preview';
        let previewPrefix = '';
        if (entry.sender === currentUsername) previewPrefix = 'You: ';
        else if (entry.isGroup && entry.sender) previewPrefix = `${entry.sender}: `;
        el.textContent = previewPrefix + (entry.content ? entry.content : '—');
      }
    }
  }
  if (activeChat && activeChat.chat_id === chat_id) {
    const statusEl = document.getElementById('chat-status');
    const pill = document.getElementById('typing-pill');
   
    const typers = getTypingUsersForChat(chat_id);
    if (typers.length) {
      statusEl.className = 'chat-header-status typing-status';
      statusEl.innerHTML = `<span class="typing-dots"><span></span><span></span><span></span></span><span class="typing-text">${formatTypers(typers)} typing…</span>`;
    
      pill.classList.add('visible');
      // update pill text directly
      pill.innerHTML = `<span class="typing-dots"><span></span><span></span><span></span></span> ${formatTypers(typers)} typing`;
    } else {
      statusEl.className = 'chat-header-status';
      statusEl.textContent = activeChat.isGroup ? 'Group' : '';
      pill.classList.remove('visible');
    }
  }
}
function getTypingUsersForChat(chat_id) {
  const prefix = `${chat_id}::`;
  const users = [];
  for (const key of typingUsers.keys()) {
    if (key.startsWith(prefix)) users.push(key.slice(prefix.length));
  }
  return users;
}

function isAnyoneTypingInChat(chat_id) {
  return getTypingUsersForChat(chat_id).length > 0;
}

function formatTypers(typers) {
  if (typers.length === 1) return escapeHtml(typers[0]);
  if (typers.length === 2) return `${escapeHtml(typers[0])} and ${escapeHtml(typers[1])}`;
  return `${escapeHtml(typers[0])}, ${escapeHtml(typers[1])} and ${typers.length - 2} more`;
}

/* ── SCROLL TO QUOTED MSG ── */
async function scrollToMsg(msgId) {
  const el = document.querySelector(`.msg-row[data-id="${msgId}"]`);
  if (el) { flashMsg(el); return; }
  if (!activeChat) return;
  const { chat_id } = activeChat;
  const [beforeRes, afterRes] = await Promise.all([
    fetch(`${API}/load_chat/${msgId + 1}/${chat_id}`, { credentials: 'include' }),
    fetch(`${API}/load_chat_after/${msgId - 1}/${chat_id}`, { credentials: 'include' })
  ]);
  const beforeRows = await beforeRes.json();
  const afterRows = await afterRes.json();
  const before = (beforeRows||[]).map(r=>({id:r[0],chat_id:r[1],sender:r[2],content:r[3],sent_at:r[4],replied_to:r[5]??null,replied_content:null,attachment_url:r[6]??null,content_type:r[7]??null,original_name:r[8]??null,size_bytes:r[9]??null})).reverse();
  const after = (afterRows||[]).map(r=>({id:r[0],chat_id:r[1],sender:r[2],content:r[3],sent_at:r[4],replied_to:r[5]??null,replied_content:null,attachment_url:r[6]??null,content_type:r[7]??null,original_name:r[8]??null,size_bytes:r[9]??null}));
  const allFetched = [...before, ...after];
  const targetRaw = allFetched.find(x => x.id === msgId);
  const matchMsg = targetRaw || { id: msgId, chat_id, sender: '?', content: '…', sent_at: null, replied_to: null, replied_content: null, attachment_url: null, content_type: null, original_name: null, size_bytes: null };
  activeChat.messages = [...before, matchMsg, ...after];
  activeChat.oldestId = before.length ? before[0].id : msgId;
  activeChat.hasMore = before.length >= 50;
  activeChat.hasNewer = after.length >= 50;
  renderMessages();
  setTimeout(() => { const t = document.querySelector(`.msg-row[data-id="${msgId}"]`); if (t) flashMsg(t); }, 50);
}
function flashMsg(el) {
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.remove('flash-highlight');
  void el.offsetWidth;
  el.classList.add('flash-highlight');
  setTimeout(() => el.classList.remove('flash-highlight'), 1200);
}

/* ── LOAD MESSAGES ── */
async function loadMoreMessages(scrollToBottom = false) {
  if (!activeChat || !activeChat.hasMore) return;
  const { chat_id, oldestId } = activeChat;
  const res = await fetch(`${API}/load_chat/${oldestId}/${chat_id}`, { credentials: 'include' });
  if (!res.ok) return;
  const rows = await res.json();
  if (!rows || !rows.length) { activeChat.hasMore = false; renderMessages(scrollToBottom); return; }
  const newMsgs = rows.map(r=>({
    id:r[0], chat_id:r[1], sender:r[2], content:r[3], sent_at:r[4],
    replied_to:r[5]??null, replied_content:null,
    attachment_url:r[6]??null, content_type:r[7]??null,
    original_name:r[8]??null, size_bytes:r[9]??null
  })).reverse();
  activeChat.messages = [...newMsgs, ...activeChat.messages];
  activeChat.oldestId = rows[rows.length-1][0];
  if (rows.length < 50) activeChat.hasMore = false;
  renderMessages(scrollToBottom);
}
async function loadOlderMessages() {
  if (!activeChat || !activeChat.hasMore) return;
  const area = document.getElementById('messages-area');
  const prevHeight = area.scrollHeight;
  await loadMoreMessages();
  area.scrollTop = area.scrollHeight - prevHeight;
}

/* ── RENDER MESSAGES ── */
function renderMessages(scrollToBottom = false) {
  if (!activeChat) return;
  const area = document.getElementById('messages-area');
  const wasAtBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 60;
  let html = '';
  if (activeChat.hasMore) html += `<button class="load-more-btn" onclick="loadOlderMessages()">Load older messages</button>`;
  let lastDateLabel = '';
  const [bg, fg] = avatarColors[activeChat.colorIdx];
  for (const m of activeChat.messages) {
    const dateLabel = formatMsgDate(m.sent_at);
    if (dateLabel !== lastDateLabel) { html += `<div class="msg-date-divider">${dateLabel}</div>`; lastDateLabel = dateLabel; }
    const isMine = m.sender === currentUsername;
    const senderColorIdx = activeChat.isGroup ? getColorIdx(m.sender) : activeChat.colorIdx;
    const [sbg, sfg] = avatarColors[senderColorIdx];
    const theirAvatar = `<div class="msg-avatar-sm" style="background:${sbg}20;color:${sfg}">${initials(m.sender)}</div>`;
    let replyQuoteHtml = '';
    if (m.replied_to !== null && m.replied_to !== undefined) {
      const quotedMsg = activeChat.messages.find(x => x.id === m.replied_to);
      const isAttachment = quotedMsg ? !!quotedMsg.attachment_url : false;
      const quotedContent = quotedMsg
        ? (quotedMsg.attachment_url ? '📎 ' + (quotedMsg.original_name || 'Attachment') : quotedMsg.content)
        : (m.replied_content || '📎 Attachment');
      const quotedSender = quotedMsg ? quotedMsg.sender : (isMine ? activeChat.username : currentUsername);
      replyQuoteHtml = `<div class="reply-quote" onclick="scrollToMsg(${m.replied_to})" title="Jump to original"><div class="reply-quote-sender">${escapeHtml(quotedSender)}</div><div class="reply-quote-text">${escapeHtml(String(quotedContent))}</div></div>`;
    }
    const safeContent = (m.content||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
    const safeSender = m.sender.replace(/'/g,"\\'");

    let bubbleInner = '';
    if (m.attachment_url) {
      const ct = m.content_type || '';
      const url = m.attachment_url;
      const fname = m.original_name || 'File';
      const sizeStr = m.size_bytes ? formatBytes(m.size_bytes) : '';
      if (ct.startsWith('image/')) {
        bubbleInner = `<div class="msg-attachment"><img class="msg-img" src="${escapeHtml(url)}" loading="lazy" onclick="openLightbox('${escapeHtml(url)}','image','${escapeHtml(fname)}','${sizeStr}','${escapeHtml((m.content||'').replace(/'/g,"\\'"))}')" alt="image"></div>`;
      } else if (ct.startsWith('video/')) {
        bubbleInner = `<div class="msg-attachment" style="position:relative;cursor:pointer" onclick="openLightbox('${escapeHtml(url)}','video','${escapeHtml(fname)}','${sizeStr}','${escapeHtml((m.content||'').replace(/'/g,"\\'"))}')"><video style="max-width:240px;max-height:260px;width:100%;border-radius:10px;display:block;" src="${escapeHtml(url)}" muted preload="metadata"></video><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;"><div style="width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 20 20" width="18" height="18" fill="#fff"><path d="M6 4l11 6-11 6V4z"/></svg></div></div></div>`;
      } else if (ct.startsWith('audio/')) {
        bubbleInner = `<div class="msg-attachment"><audio controls style="width:100%;min-width:180px;" src="${escapeHtml(url)}"></audio></div>`;
      } else {
        bubbleInner = `<div class="msg-file-card" style="cursor:pointer" onclick="openLightbox('${escapeHtml(url)}','file','${escapeHtml(fname)}','${sizeStr}','${escapeHtml((m.content||'').replace(/'/g,"\\'"))}')"><div class="msg-file-icon"><svg viewBox="0 0 16 16" fill="none"><path d="M4 2h6l4 4v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.3"/><path d="M10 2v4h4" stroke="currentColor" stroke-width="1.3"/></svg></div><div class="msg-file-info"><div class="msg-file-name">${escapeHtml(fname)}</div><div class="msg-file-size">${sizeStr}</div></div></div>`;
      }
      if (m.content) bubbleInner += `<div class="msg-caption">${escapeHtml(m.content)}</div>`;
    } else {
      bubbleInner = escapeHtml(m.content || '');
    }

    // inside renderMessages(), right before the html += template:

async function loadNewerMessages() {
  if (!activeChat || !activeChat.hasNewer) return;
  const { chat_id, messages } = activeChat;
  const newestId = messages[messages.length-1].id;
  const res = await fetch(`${API}/load_chat_after/${newestId}/${chat_id}`, { credentials: 'include' });
  if (!res.ok) return;
  const rows = await res.json();
  if (!rows || !rows.length) { activeChat.hasNewer = false; renderMessages(); return; }
  const newMsgs = rows.map(r=>({
    id:r[0], chat_id:r[1], sender:r[2], content:r[3], sent_at:r[4],
    replied_to:r[5]??null, replied_content:null,
    attachment_url:r[6]??null, content_type:r[7]??null,
    original_name:r[8]??null, size_bytes:r[9]??null
  }));
  const area = document.getElementById('messages-area');
  const prevDistFromBottom = area.scrollHeight - area.scrollTop - area.clientHeight;
  activeChat.messages = [...activeChat.messages, ...newMsgs];
  if (newMsgs.length < 50) activeChat.hasNewer = false;
  renderMessages();
  area.scrollTop = area.scrollHeight - area.clientHeight - prevDistFromBottom;
}

document.getElementById('messages-area').addEventListener('scroll', function() {
  if (this.scrollTop < 40 && activeChat?.hasMore) loadOlderMessages();
  if (this.scrollHeight - this.scrollTop - this.clientHeight < 40 && activeChat?.hasNewer) loadNewerMessages();
});

/* ── SEND MESSAGE ── */
function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();

  if (stagedFile) {
    const caption = text;
    input.value = '';
    input.style.height = 'auto';
    sendStagedFile(caption);
    return;
  }

  if (!text || !activeChat || !ws || ws.readyState !== WebSocket.OPEN) return;
  const payload = activeChat.isGroup
    ? { type: 'send_message_grp', chat_id: activeChat.chat_id, content: text }
    : { type: 'send_message', chat_id: activeChat.chat_id, username: activeChat.username, content: text };
  if (replyingTo) payload.replied_to = replyingTo.id;
  ws.send(JSON.stringify(payload));
  input.value = '';
  input.style.height = 'auto';
  clearReply();
}
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const text = document.getElementById('msg-input').value.trim();
    if (text || stagedFile) sendMessage();
  }
}

function onMsgInput(e) {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 100) + 'px';
  if (!activeChat || !ws || ws.readyState !== WebSocket.OPEN) return;
  const now = Date.now();
  if (now - lastTypingPing < TYPING_THROTTLE) return;
  lastTypingPing = now;
  ws.send(JSON.stringify({ type: 'typing', chat_id: activeChat.chat_id }));
}

function sendReadReceipt(chat_id, msg_id) {
  if (!ws || ws.readyState !== WebSocket.OPEN || !msg_id) return;
  ws.send(JSON.stringify({ type: 'update_read_receipt', id: msg_id, chat_id }));
}

function connectWebSocket() {
  ws = new WebSocket(`ws://127.0.0.1:8000/pulse`);
  // ws = new WebSocket(`wss://pulsechat.qzz.io/pulse`);



  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === 'receive_message') {
      const newMsg = { id: msg.id||Date.now(), chat_id: msg.chat_id, sender: msg.sender, content: msg.content, sent_at: msg.sent_at, replied_to: msg.replied_to??null, replied_content: msg.replied_content??null };

      upsertSidebarEntry(msg.chat_id, msg.sender, msg.sender, msg.content, msg.sent_at, newMsg.id, true);
    }
    if (msg.type === 'sent_message_grp') {
      const newMsg = { id: msg.id||Date.now(), chat_id: msg.chat_id, sender: msg.sender, content: msg.content, sent_at: msg.sent_at, replied_to: msg.replied_to??null, replied_content: msg.replied_content??null };
      if (activeChat && activeChat.chat_id === msg.chat_id) { activeChat.messages.push(newMsg); renderMessages(true); sendReadReceipt(msg.chat_id, newMsg.id); }
      const entry = sidebarMap.get(msg.chat_id);
      upsertSidebarEntry(msg.chat_id, entry ? entry.username : msg.grp_name, msg.sender, msg.content, msg.sent_at, newMsg.id, false, true);
    }
    if (msg.type === 'receive_message_grp') {
      const newMsg = { id: msg.id||Date.now(), chat_id: msg.chat_id, sender: msg.sender, content: msg.content, sent_at: msg.sent_at, replied_to: msg.replied_to??null, replied_content: msg.replied_content??null };
      if (activeChat && activeChat.chat_id === msg.chat_id) { clearTyping(msg.sender, msg.chat_id); activeChat.messages.push(newMsg); renderMessages(true); sendReadReceipt(msg.chat_id, newMsg.id); }
      const entry = sidebarMap.get(msg.chat_id);
      upsertSidebarEntry(msg.chat_id, entry ? entry.username : msg.grp_name, msg.sender, msg.content, msg.sent_at, newMsg.id, true, true);
    }
    if (msg.type === 'updated_read_receipt') {
      if (sidebarMap.has(msg.chat_id)) { sidebarMap.get(msg.chat_id).unread_count = 0; renderSidebar(); }
    }
    if (msg.type === 'typing') setTyping(msg.username, msg.chat_id);
    if (msg.type === 'request_receive') {
      requestCount++;
      updateRequestBadge(requestCount);
      const modalOpen = document.getElementById('requests-modal').classList.contains('open');
      if (modalOpen && activeReqTab === 'incoming') switchReqTab('incoming');
    }
    if (msg.type === 'request_send') {
      if (msg.reason === 'success') { showReqFeedback('Request sent!', true); const mo = document.getElementById('requests-modal').classList.contains('open'); if (mo && activeReqTab==='outgoing') switchReqTab('outgoing'); }
      else if (msg.reason === 'request_exists') showReqFeedback('Request already sent', false);
      else if (msg.reason === 'already_friend')  showReqFeedback('Already friends', false);
      else if (msg.reason === 'user_no_exist')   showReqFeedback('User not found', false);
      else if (msg.reason === 'request_from_user_exists') showReqFeedback('This user already sent you a request', false);
    }
    if (msg.type === 'request') {
      const modalOpen = document.getElementById('requests-modal').classList.contains('open');
      if (msg.status === 'accepted') {
        showToast(`${msg.username} accepted your request!`);
        if (modalOpen && activeReqTab==='outgoing') switchReqTab('outgoing');
        if (!sidebarMap.has(msg.chat_id)) {
          sidebarMap.set(msg.chat_id, {
            username: msg.username,
            chat_id: msg.chat_id,
            sender: null, content: null, sent_at: null,
            last_id: Date.now(), activity: Date.now(),unread_count: 0,
            colorIdx: getColorIdx(msg.username),
            isGroup: false
          });
        }
        renderSidebar();
      } else if (msg.status === 'rejected') {
        showToast(`${msg.username} declined your request`, true);
        if (modalOpen && activeReqTab==='outgoing') switchReqTab('outgoing');
      }
    }
    if (msg.type === 'sent_attachment' || msg.type === 'receive_attachment') {
      const newMsg = {
        id: msg.id || Date.now(), chat_id: msg.chat_id, sender: msg.sender,
        content: msg.content || null, sent_at: msg.sent_at,
        replied_to: msg.replied_to ?? null, replied_content: msg.replied_content ?? null,
        attachment_url: msg.attachment_url, content_type: msg.content_type || '',
        original_name: msg.original_name || 'File', size_bytes: msg.size_bytes || 0
      };
      const isIncoming = msg.type === 'receive_attachment';
      const isGroup = !!msg.grp_name;
      if (activeChat && activeChat.chat_id === msg.chat_id) {
        if (isIncoming) clearTyping(msg.sender, msg.chat_id);
        activeChat.messages.push(newMsg);
        renderMessages(true);
        sendReadReceipt(msg.chat_id, newMsg.id);
      }
      const entry = sidebarMap.get(msg.chat_id);
      const displayName = isGroup ? msg.grp_name : (isIncoming ? msg.sender : (entry?.username ?? activeChat?.username));
      const previewText = isGroup ? `${msg.sender}: 📎 Attachment` : '📎 Attachment';
      upsertSidebarEntry(msg.chat_id, entry ? entry.username : displayName, msg.sender, previewText, msg.sent_at, newMsg.id, isIncoming, isGroup);
    }
    if (msg.type === 'request_takeback') {
      if (!msg.req_detail) return;

      if (username !== currentUsername) { requestCount = Math.max(0, requestCount-1); updateRequestBadge(requestCount); }

        document.getElementById('requests-list').innerHTML = `<div class="empty-requests">No ${activeReqTab} requests</div>`;
    }
    if (msg.type === 'grp_created' || msg.type === 'added_to_grp') {
      if (!sidebarMap.has(msg.chat_id)) {
        sidebarMap.set(msg.chat_id, {
          username: msg.grp_name,
          chat_id: msg.chat_id,
          sender: null, content: null, sent_at: null,
          last_id: Date.now(), activity: Date.now(),unread_count: 0,
          colorIdx: getColorIdx(msg.grp_name),
          isGroup: true
        });
        renderSidebar();
        if (msg.type === 'added_to_grp') showToast(`Added to "${msg.grp_name}"`);
      }
    }
    if (msg.type === 'grp_left') {
  sidebarMap.delete(msg.chat_id);
  if (activeChat && activeChat.chat_id === msg.chat_id) {
      activeChat = null;
      clearReply();
      document.getElementById('chat-area').classList.remove('visible');
      document.getElementById('chat-area').style.display = 'none';
      document.getElementById('empty-state').style.display = '';
      document.getElementById('leave-grp-btn').style.display = 'none';
      document.getElementById('add-members-btn').style.display = 'none';
      document.getElementById('view-members-btn').style.display = 'none';
      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.remove('hidden');
        document.getElementById('main').classList.remove('visible');
        document.body.classList.remove('in-chat');
      }
      history.pushState({}, '', window.location.pathname);
    }
    renderSidebar();
    showToast('Left group');
  }
  if (msg.type === 'promoted_role' || msg.type === 'demoted_role') {
    const becameAdmin = msg.type === 'promoted_role';
    if (msg.user === currentUsername) showToast(becameAdmin ? 'You are now an admin' : 'You were moved back to member');
    const modalOpen = document.getElementById('group-members-modal').classList.contains('open');
    if (modalOpen && activeChat && activeChat.chat_id === msg.chat_id) openGroupMembers();
  }
  if (msg.type === 'grp_invite') {
    const btn = document.getElementById('gen-invite-btn');
    if (btn) btn.textContent = 'Generate invite link';
    const link = `${location.origin}${location.pathname}?invite=${encodeURIComponent(msg.token)}`;

    const hint = document.getElementById('invite-link-hint');

  }
  if (msg.type === 'kicked_from_grp') {
    const entry = sidebarMap.get(msg.chat_id);
    const grpName = entry ? entry.username : 'the group';
    sidebarMap.delete(msg.chat_id);
    if (document.getElementById('group-members-modal').classList.contains('open')) closeModal('group-members-modal');
    if (activeChat && activeChat.chat_id === msg.chat_id) {
      activeChat = null;
      clearReply();
      document.getElementById('chat-area').classList.remove('visible');

      document.getElementById('leave-grp-btn').style.display = 'none';
      document.getElementById('add-members-btn').style.display = 'none';

  if (msg.type === 'removed_from_grp') {

    const modalOpen = document.getElementById('group-members-modal').classList.contains('open');
    if (modalOpen && activeChat && activeChat.chat_id === msg.chat_id) openGroupMembers();

  };
  ws.onclose = () => setTimeout(() => connectWebSocket(), 3000);

/* ── ATTACHMENTS ── */
let currentXhr = null;
let stagedFile = null;
let stagedUploadId = null;
let stagedUploadPromise = null;
let stagedCancelled = false;

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

function onFileSelected(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file || !activeChat) return;
  if (file.size > 10 * 1024 * 1024) { showToast('File too large (max 10 MB)', true); return; }
  stageFile(file);
}

function stageFile(file) {
  stagedFile = file;
  stagedUploadId = null;
  stagedCancelled = false;

  const inner = document.getElementById('file-tray-inner');
  let previewHtml = '';
  if (file.type.startsWith('image/')) {
    const url = URL.createObjectURL(file);
    previewHtml = `<img class="file-tray-preview-img" src="${url}" id="file-tray-obj-url">`;
  } else if (file.type.startsWith('video/')) {
    previewHtml = `<div class="file-tray-preview-icon"><svg viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M14 8l4-2v8l-4-2V8z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></div>`;
  } else if (file.type.startsWith('audio/')) {
    previewHtml = `<div class="file-tray-preview-icon"><svg viewBox="0 0 20 20" fill="none"><path d="M9 4v12M5 7v6M13 6v8M17 9v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>`;
  } else {
    previewHtml = `<div class="file-tray-preview-icon"><svg viewBox="0 0 20 20" fill="none"><path d="M5 3h8l4 4v10H5V3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M13 3v4h4" stroke="currentColor" stroke-width="1.5"/></svg></div>`;
  }
  inner.innerHTML = `
    ${previewHtml}
    <div class="file-tray-info">
      <div class="file-tray-name">${escapeHtml(file.name)}</div>
      <div class="file-tray-size"><span id="tray-upload-status">Uploading…</span> · ${formatBytes(file.size)}</div>
    </div>`;
  document.getElementById('file-tray').classList.add('visible');
  document.getElementById('msg-input').placeholder = 'Add a caption…';
  document.getElementById('msg-input').focus();

  stagedUploadPromise = backgroundUpload(file);
}

async function backgroundUpload(file) {
  const chat_id = activeChat?.chat_id;
  if (!chat_id) return null;
  try {
    const presignRes = await fetch(`${API}/upload_media/${chat_id}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
      body: JSON.stringify({ filename: file.name, content_type: file.type, size_bytes: file.size })
    });
    if (!presignRes.ok) throw new Error('presign failed');
    const presignData = await presignRes.json();
    stagedUploadId = presignData.upload_id;

    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      currentXhr = xhr;
      xhr.open('PUT', presignData.presigned_url);
      xhr.setRequestHeader('Content-Type', file.type);
      xhr.upload.onprogress = (ev) => {
        if (!ev.lengthComputable) return;
        const p = Math.round(ev.loaded / ev.total * 100);
        const el = document.getElementById('tray-upload-status');
        if (el) el.textContent = p < 100 ? `${p}%` : 'Ready';
      };
      xhr.onload = () => {
        currentXhr = null;
        if (xhr.status < 300) {
          const el = document.getElementById('tray-upload-status');
          if (el) el.textContent = 'Ready';
          resolve();
        } else reject(new Error('S3 ' + xhr.status));
      };
      xhr.onerror = reject;
      xhr.onabort = () => reject(new Error('cancelled'));
      xhr.send(file);
    });

    return stagedUploadId;
  } catch (err) {
    console.error('backgroundUpload error:', err);
    if (stagedCancelled) return null;
    const el = document.getElementById('tray-upload-status');
    if (el) el.textContent = 'Failed';
    showToast('Upload failed', true);
    return null;
  }
}

function clearStagedFile() {
  stagedCancelled = true;
  if (currentXhr) { currentXhr.abort(); currentXhr = null; }
  const img = document.getElementById('file-tray-obj-url');
  if (img) URL.revokeObjectURL(img.src);
  stagedFile = null;
  stagedUploadId = null;
  stagedUploadPromise = null;
  document.getElementById('file-tray').classList.remove('visible');
  document.getElementById('file-tray-inner').innerHTML = '';
  document.getElementById('msg-input').placeholder = 'Message…';
}

async function sendStagedFile(caption) {
  if (!activeChat) return;
  const file = stagedFile;
  const chat_id = activeChat.chat_id;

  const statusEl = document.getElementById('tray-upload-status');
  if (statusEl && statusEl.textContent !== 'Ready') {
    statusEl.textContent = 'Sending…';
  }

  let uploadId;
  try {
    uploadId = await stagedUploadPromise;
  } catch (_) {}

  if (!uploadId || stagedCancelled) { showToast('Upload not ready', true); return; }

  clearStagedFile();

  const bar = document.getElementById('upload-bar');
  document.getElementById('upload-bar-name').textContent = file.name;
  document.getElementById('upload-fill').style.width = '100%';
  document.getElementById('upload-pct').textContent = 'Sending…';
  bar.classList.add('visible');

  try {
    const confirmRes = await fetch(`${API}/confirm_media/${chat_id}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
      body: JSON.stringify({
        uploadid: uploadId,
        username: activeChat.username,
        message: caption || null,
        id: replyingTo?.id ?? null,
        replied_content: replyingTo?.content ?? null
      })
    });
    if (!confirmRes.ok) { showToast('Send failed', true); return; }
    clearReply();
  } catch (err) {
    showToast('Send failed', true);
  } finally {
    bar.classList.remove('visible');
  }
}

function cancelUpload() {
  clearStagedFile();
  document.getElementById('upload-bar').classList.remove('visible');
}

/* ── LIGHTBOX ── */
async function downloadAttachment(url, name) {
  try {
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error('bad response');
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = name || 'download';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
  } catch (err) {
    window.open(url, '_blank');
  }
}
function openLightbox(url, type, name, sizeStr, caption) {
  const body = document.getElementById('lightbox-body');
  const dl = document.getElementById('lightbox-download');
  document.getElementById('lightbox-name').textContent = name || 'File';
  document.getElementById('lightbox-size').textContent = sizeStr || '';
  dl.onclick = () => downloadAttachment(url, name || 'download');

  if (type === 'image') {
    body.innerHTML = `<img src="${url}" alt="${escapeHtml(name||'')}">`;
  } else if (type === 'video') {
    body.innerHTML = `<video src="${url}" controls autoplay></video>`;
  } else if (type === 'audio') {
    body.innerHTML = `<audio src="${url}" controls autoplay></audio>`;
  } else {
    body.innerHTML = `
      <div style="text-align:center;color:#fff;">
        <div style="width:64px;height:64px;border-radius:14px;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none"><path d="M6 3h9l6 6v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="#fff" stroke-width="1.4"/><path d="M15 3v6h6" stroke="#fff" stroke-width="1.4"/></svg>
        </div>
        <div style="font-size:14px;opacity:0.8;">Preview unavailable — tap download to open</div>
      </div>`;
  }

  const capEl = document.getElementById('lightbox-caption');
  if (caption) { capEl.textContent = caption; capEl.style.display = 'block'; }
  else { capEl.style.display = 'none'; }

  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-body').innerHTML = '';
}

/* ── PROFILE ── */
async function openProfile() {
  const res = await fetch(`${API}/me`, { credentials: 'include' });
  if (!res.ok) return;
  const data = await res.json();
  document.getElementById('profile-name-display').textContent = data.username;
  document.getElementById('profile-email-display').textContent = formatJoinDate(data.creation_date);
  document.getElementById('profile-username').value = data.username;
  document.getElementById('profile-email').value = data.email;
  document.getElementById('profile-about').value = data.about ?? '';
  document.getElementById('profile-avatar-lg').childNodes[0].textContent = data.username.slice(0,2).toUpperCase();
  originalAbout = data.about ?? '';
  document.getElementById('profile-modal').classList.add('open');
}
document.getElementById('profile-about').addEventListener('input', function() {
  const changed = this.value.trim() !== originalAbout.trim();
  const btn = document.getElementById('save-btn');
  btn.disabled = !changed; btn.style.opacity = changed ? '1' : '0.45'; btn.style.cursor = changed ? 'pointer' : 'not-allowed';
});
function formatJoinDate(dateStr) {
  return 'Joined ' + new Date(dateStr).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
async function saveProfile() {
  const about = document.getElementById('profile-about').value.trim();
  const res = await fetch(`${API}/update_about`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ about }), credentials: 'include' });
  if (!res.ok) return;
  originalAbout = about;
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.style.opacity = '0.45'; btn.style.cursor = 'not-allowed';
  closeModal('profile-modal');
  showToast('Profile saved');
}
