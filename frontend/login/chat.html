<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1014;
  --surface: #17181d;
  --surface2: #1e2028;
  --surface3: #24262f;
  --border: rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.1);
  --text: #f0f0f2;
  --text-muted: #8b8d97;
  --text-dim: #4a4c58;
  --accent: #5b6af0;
  --accent-hover: #6e7cf2;
  --accent-dim: rgba(91,106,240,0.12);
  --danger: #e05c5c;
  --success: #4caf8a;
  --online: #4caf8a;
  --away: #e0c85c;
  --radius: 10px;
  --radius-sm: 6px;
  --sidebar-w: 300px;
  --nav-w: 60px;
  --bottom-nav-h: 56px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
}

/* ═══════════════════════════════════════════════
   NAV RAIL — desktop only
═══════════════════════════════════════════════ */
.nav-rail {
  width: var(--nav-w);
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0;
  gap: 4px;
  flex-shrink: 0;
  z-index: 10;
}

.nav-logo {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px; flex-shrink: 0;
}
.nav-logo svg { width: 18px; height: 18px; }

.nav-btn {
  width: 40px; height: 40px;
  border-radius: var(--radius-sm);
  border: none; background: transparent;
  color: var(--text-dim); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
  position: relative;
}
.nav-btn svg { width: 18px; height: 18px; }
.nav-btn:hover { background: var(--surface2); color: var(--text-muted); }
.nav-btn.active { background: var(--accent-dim); color: var(--accent); }

.nav-badge {
  display: none;
  position: absolute; top: 6px; right: 6px;
  width: 7px; height: 7px;
  background: var(--danger);
  border-radius: 50%;
  border: 2px solid var(--surface);
}
.nav-spacer { flex: 1; }

.nav-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--accent-dim);
  border: 2px solid var(--border2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; color: var(--accent);
  transition: border-color 0.15s;
  position: relative;
}
.nav-avatar:hover { border-color: var(--accent); }
.nav-avatar .status-dot {
  position: absolute; bottom: 0; right: 0;
  width: 9px; height: 9px;
  background: var(--online);
  border-radius: 50%; border: 2px solid var(--surface);
}

/* ═══════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════ */
.sidebar {
  width: var(--sidebar-w);
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
}
.sidebar-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 12px; letter-spacing: -0.2px; }

.search-wrap { position: relative; }
.search-wrap svg {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; color: var(--text-dim); pointer-events: none;
}
.search-input {
  width: 100%; background: var(--bg);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 7px 10px 7px 32px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text);
  outline: none; transition: border-color 0.15s;
}
.search-input::placeholder { color: var(--text-dim); }
.search-input:focus { border-color: var(--border2); }

.sidebar-section-label {
  padding: 14px 16px 6px;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.8px;
  text-transform: uppercase; color: var(--text-dim);
}

.contact-list {
  flex: 1; overflow-y: auto; padding: 4px 8px;
}
.contact-list::-webkit-scrollbar { width: 4px; }
.contact-list::-webkit-scrollbar-track { background: transparent; }
.contact-list::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

.contact-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 10px; border-radius: var(--radius-sm);
  cursor: pointer; transition: background 0.12s; position: relative;
}
.contact-item:hover { background: var(--surface2); }
.contact-item.active { background: var(--accent-dim); }
.contact-item.active .contact-name { color: var(--text); }

.contact-avatar {
  width: 44px; height: 44px;
  border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; position: relative;
}
.contact-info { flex: 1; min-width: 0; }
.contact-name { font-size: 14px; font-weight: 500; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact-preview { font-size: 12.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.contact-preview.typing-preview { color: var(--accent); display: flex; align-items: center; gap: 4px; }

.typing-dots-sm { display: inline-flex; gap: 2px; align-items: center; }
.typing-dots-sm span { width: 3px; height: 3px; background: var(--accent); border-radius: 50%; animation: typingBounce 1.2s infinite; }
.typing-dots-sm span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots-sm span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-3px); opacity: 1; }
}

.contact-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.contact-time { font-size: 11px; color: var(--text-dim); }
.unread-badge {
  background: var(--accent); color: #fff;
  font-size: 10px; font-weight: 600; border-radius: 10px;
  padding: 1px 6px; min-width: 18px; text-align: center;
}

/* ═══════════════════════════════════════════════
   MAIN / CHAT AREA
═══════════════════════════════════════════════ */
.main {
  flex: 1; display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
}

.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; color: var(--text-dim);
}
.empty-icon {
  width: 56px; height: 56px; background: var(--surface2);
  border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px;
}
.empty-icon svg { width: 26px; height: 26px; color: var(--text-dim); }
.empty-title { font-size: 15px; font-weight: 600; color: var(--text-muted); }
.empty-sub { font-size: 13px; color: var(--text-dim); text-align: center; max-width: 220px; line-height: 1.5; }

.chat-area { display: none; flex-direction: column; height: 100%; }
.chat-area.visible { display: flex; }

.chat-header {
  padding: 0 12px 0 8px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  background: var(--surface);
}
.chat-header-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.chat-header-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; flex-shrink: 0;
}
.chat-header-info { flex: 1; min-width: 0; }
.chat-header-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-header-status { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }

.typing-status { color: var(--accent) !important; display: flex; align-items: center; gap: 5px; }
.typing-dots { display: inline-flex; gap: 3px; align-items: center; }
.typing-dots span { width: 4px; height: 4px; background: var(--accent); border-radius: 50%; animation: typingBounce 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

.chat-header-actions { display: flex; gap: 2px; flex-shrink: 0; }

.icon-btn {
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  border: none; background: transparent; color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:hover { background: var(--surface2); color: var(--text-muted); }

.messages-area {
  flex: 1; overflow-y: auto;
  padding: 16px 12px 8px;
  display: flex; flex-direction: column; gap: 4px;
  position: relative;
  -webkit-overflow-scrolling: touch;
}
.messages-area::-webkit-scrollbar { width: 3px; }
.messages-area::-webkit-scrollbar-track { background: transparent; }
.messages-area::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

/* Typing pill */
.typing-pill {
  display: none; position: sticky; bottom: 8px; align-self: flex-start;
  align-items: center; gap: 8px;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 20px; padding: 5px 14px;
  font-size: 12px; color: var(--text-muted);
  margin-top: 4px; z-index: 5; pointer-events: none;
  animation: fadeInPill 0.2s ease;
}
.typing-pill.visible { display: flex; }
@keyframes fadeInPill { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.load-more-btn {
  align-self: center;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; color: var(--text-muted); font-size: 12px;
  font-family: 'DM Sans', sans-serif; padding: 5px 14px; cursor: pointer;
  margin-bottom: 8px; transition: background 0.15s;
}
.load-more-btn:hover { background: var(--surface3); }

.msg-date-divider {
  text-align: center; font-size: 11px; color: var(--text-dim);
  margin: 12px 0 8px; position: relative;
}
.msg-date-divider::before, .msg-date-divider::after {
  content: ''; position: absolute; top: 50%;
  width: calc(50% - 50px); height: 1px; background: var(--border);
}
.msg-date-divider::before { left: 0; }
.msg-date-divider::after { right: 0; }

.msg-row { display: flex; gap: 6px; align-items: flex-end; max-width: 100%; }
.msg-row.mine { flex-direction: row-reverse; }

.msg-avatar-sm {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; margin-bottom: 2px;
}

.msg-wrap { max-width: 72vw; display: flex; flex-direction: column; gap: 2px; position: relative; }

/* Reply button */
.reply-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--border2); background: var(--surface2); color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.15s, background 0.15s, color 0.15s;
  flex-shrink: 0; z-index: 2;
}
.reply-btn svg { width: 13px; height: 13px; }
.reply-btn:hover { background: var(--surface3); color: var(--accent); }
.msg-row:not(.mine) .reply-btn { right: -36px; }
.msg-row.mine .reply-btn { left: -36px; }
.msg-row:hover .reply-btn { opacity: 1; pointer-events: auto; }

.msg-bubble {
  padding: 8px 12px; border-radius: 16px;
  font-size: 14px; line-height: 1.5;
  word-break: break-word; white-space: pre-wrap;
}
.msg-row:not(.mine) .msg-bubble { background: var(--surface2); color: var(--text); border-bottom-left-radius: 4px; }
.msg-row.mine .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }

.reply-quote {
  border-radius: 8px 8px 0 0; padding: 6px 10px;
  font-size: 12px; line-height: 1.4;
  border-left: 3px solid rgba(255,255,255,0.3);
  margin-bottom: -4px; cursor: pointer; overflow: hidden;
}
.reply-quote-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; word-break: break-word; }
.msg-row:not(.mine) .reply-quote { background: var(--surface3); border-left-color: var(--accent); color: var(--text-muted); border-radius: 8px 8px 0 0; }
.msg-row.mine .reply-quote { background: rgba(0,0,0,0.2); border-left-color: rgba(255,255,255,0.5); color: rgba(255,255,255,0.7); }
.reply-quote-sender { font-weight: 600; font-size: 11px; margin-bottom: 2px; }
.msg-row:not(.mine) .reply-quote-sender { color: var(--accent); }
.msg-row.mine .reply-quote-sender { color: rgba(255,255,255,0.85); }

.msg-time { font-size: 10.5px; color: var(--text-dim); margin-top: 3px; text-align: right; padding: 0 4px; }
.msg-row.mine .msg-time { text-align: left; }

/* Reply bar above input */
.reply-bar {
  display: none; padding: 8px 12px 0;
  gap: 10px; align-items: center;
  animation: slideUpSmall 0.15s ease;
}
.reply-bar.visible { display: flex; }
@keyframes slideUpSmall { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.reply-bar-inner {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  border-left: 3px solid var(--accent); border-radius: var(--radius-sm);
  padding: 6px 10px; min-width: 0;
}
.reply-bar-label { font-size: 11px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
.reply-bar-preview { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reply-cancel {
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: var(--surface3); color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.15s, color 0.15s;
}
.reply-cancel:hover { background: var(--surface2); color: var(--text-muted); }
.reply-cancel svg { width: 12px; height: 12px; }

/* Input area */
.chat-input-area {
  padding: 10px 12px;
  padding-bottom: calc(10px + var(--safe-bottom));
  border-top: 1px solid var(--border);
  flex-shrink: 0; background: var(--surface);
}
.input-row {
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 22px; padding: 6px 6px 6px 14px;
  transition: border-color 0.15s;
}
.input-row:focus-within { border-color: var(--border2); }
.msg-input {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text);
  resize: none; max-height: 100px; line-height: 1.5;
}
.msg-input::placeholder { color: var(--text-dim); }
.send-btn {
  width: 34px; height: 34px; background: var(--accent); border: none;
  border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.1s; flex-shrink: 0;
}
.send-btn:hover { background: var(--accent-hover); }
.send-btn:active { transform: scale(0.9); }
.send-btn svg { width: 15px; height: 15px; color: #fff; }

/* Attach button */
.attach-btn {
  width: 34px; height: 34px; border-radius: 50%; border: none;
  background: transparent; color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s; flex-shrink: 0;
}
.attach-btn:hover { background: var(--surface3); color: var(--text-muted); }
.attach-btn svg { width: 18px; height: 18px; }

/* Upload progress bar */
.upload-bar {
  display: none; align-items: center; gap: 10px;
  padding: 8px 14px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  margin: 0 12px 8px; flex-shrink: 0; animation: slideUpSmall 0.15s ease;
}
.upload-bar.visible { display: flex; }
.upload-bar-name { font-size: 12px; color: var(--text-muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.upload-track { flex: 1; height: 3px; background: var(--surface3); border-radius: 2px; overflow: hidden; min-width: 40px; }
.upload-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.2s; }
.upload-pct { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
.upload-cancel { width: 20px; height: 20px; border-radius: 50%; border: none; background: transparent; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.upload-cancel svg { width: 10px; height: 10px; }

/* Attachment bubbles */
.msg-attachment { max-width: 100%; border-radius: 10px; overflow: hidden; }
.msg-img { max-width: 240px; max-height: 300px; width: 100%; display: block; border-radius: 10px; cursor: pointer; object-fit: cover; }
@media (max-width: 768px) { .msg-img { max-width: 60vw; } }
.msg-file-card {
  display: flex; align-items: center; gap: 10px;
  background: rgba(0,0,0,0.15); border-radius: 8px;
  padding: 8px 10px; text-decoration: none; min-width: 180px;
}
.msg-file-icon { width: 32px; height: 32px; border-radius: 6px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.msg-file-icon svg { width: 16px; height: 16px; color: #fff; }
.msg-file-info { min-width: 0; }
.msg-file-name { font-size: 12.5px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.msg-file-size { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 1px; }
.msg-row:not(.mine) .msg-file-card { background: rgba(255,255,255,0.06); }
.msg-row:not(.mine) .msg-file-name { color: var(--text); }
.msg-row:not(.mine) .msg-file-size { color: var(--text-dim); }
.msg-row:not(.mine) .msg-file-icon { background: var(--accent-dim); }
.msg-row:not(.mine) .msg-file-icon svg { color: var(--accent); }

/* Caption text under attachment */
.msg-caption { font-size: 13px; line-height: 1.4; margin-top: 5px; word-break: break-word; white-space: pre-wrap; }

/* File preview tray — shown after picking, before sending */
.file-tray {
  display: none; align-items: center; gap: 10px;
  padding: 8px 12px; background: var(--surface2);
  border-top: 1px solid var(--border); flex-shrink: 0;
  animation: slideUpSmall 0.15s ease;
}
.file-tray.visible { display: flex; }
.file-tray-inner {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
}
.file-tray-preview-img {
  width: 52px; height: 52px; border-radius: 8px;
  object-fit: cover; flex-shrink: 0; background: var(--surface3);
}
.file-tray-preview-icon {
  width: 52px; height: 52px; border-radius: 8px;
  background: var(--accent-dim); display: flex; align-items: center;
  justify-content: center; flex-shrink: 0;
}
.file-tray-preview-icon svg { width: 22px; height: 22px; color: var(--accent); }
.file-tray-info { min-width: 0; }
.file-tray-name { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-tray-size { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
.file-tray-remove {
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: var(--surface3); color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.15s;
}
.file-tray-remove:hover { background: var(--danger); color: #fff; }
.file-tray-remove svg { width: 11px; height: 11px; }

/* Caption placeholder changes when file staged */
.msg-input.has-file::placeholder { color: var(--text-dim); }

/* Chat search bar */
.chat-search-bar {
  display: none; padding: 8px 12px;
  border-bottom: 1px solid var(--border); background: var(--surface);
  gap: 8px; align-items: center; flex-shrink: 0;
}
.chat-search-bar.visible { display: flex; }
.chat-search-bar input {
  flex: 1; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 7px 10px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text);
  outline: none; transition: border-color 0.15s;
}
.chat-search-bar input:focus { border-color: var(--border2); }
.chat-search-bar input::placeholder { color: var(--text-dim); }
.chat-search-nav { display: flex; align-items: center; gap: 2px; }
.chat-search-count { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
.search-highlight { background: rgba(91,106,240,0.35); border-radius: 2px; color: #fff; }
.msg-row.search-match .msg-bubble { outline: 1px solid var(--accent); outline-offset: 2px; border-radius: 16px; }

@keyframes msgFlash {
  0% { background: transparent; }
  20% { background: rgba(91,106,240,0.18); }
  100% { background: transparent; }
}
.msg-row.flash-highlight { border-radius: var(--radius-sm); animation: msgFlash 1.1s ease forwards; }

/* ═══════════════════════════════════════════════
   MODALS / OVERLAYS
═══════════════════════════════════════════════ */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  z-index: 200; display: none;
  align-items: flex-end; justify-content: center;
  animation: fadeIn 0.15s ease;
}
.overlay.open { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 20px 20px 0 0; width: 100%; max-height: 90vh;
  animation: slideUpModal 0.25s ease; overflow-y: auto;
}

/* on desktop still center modals */
@media (min-width: 769px) {
  .overlay { align-items: center; }
  .modal { border-radius: 16px; max-width: 420px; max-height: 85vh; }
}

@keyframes slideUpModal { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 14px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface); z-index: 1;
}
/* drag handle for mobile sheet */
.modal-handle {
  width: 36px; height: 4px; background: var(--surface3);
  border-radius: 2px; margin: 10px auto 4px; flex-shrink: 0;
}
@media (min-width: 769px) { .modal-handle { display: none; } }

.modal-title { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
.close-btn {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  border: none; background: transparent; color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
.close-btn:hover { background: var(--surface2); color: var(--text-muted); }
.close-btn svg { width: 15px; height: 15px; }

/* Profile modal */
.profile-hero {
  padding: 24px 24px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
}
.profile-avatar-lg {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--accent-dim); border: 3px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 600; color: var(--accent);
  position: relative; cursor: pointer;
}
.avatar-edit-hint {
  position: absolute; inset: 0; background: rgba(0,0,0,0.5);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.15s;
}
.profile-avatar-lg:hover .avatar-edit-hint { opacity: 1; }
.avatar-edit-hint svg { width: 18px; height: 18px; color: #fff; }
.profile-name-display { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
.profile-email-display { font-size: 12.5px; color: var(--text-muted); margin-top: -6px; }
.profile-status-chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--text-muted);
}
.profile-status-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--online); }
.profile-fields { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.profile-field label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); margin-bottom: 6px; }
.profile-field input, .profile-field textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 12px;
  font-family: 'DM Sans', sans-serif; font-size: 13.5px; color: var(--text);
  outline: none; transition: border-color 0.15s; resize: none;
}
.profile-field input:focus, .profile-field textarea:focus { border-color: var(--border2); }
.profile-field input[readonly] { color: var(--text-muted); cursor: default; }
.profile-actions { padding: 0 20px 20px; padding-bottom: calc(20px + var(--safe-bottom)); display: flex; gap: 8px; }

.btn-primary {
  flex: 1; padding: 11px 0;
  background: var(--accent); border: none; border-radius: var(--radius-sm);
  color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: background 0.15s;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary {
  padding: 11px 16px; background: transparent;
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: background 0.15s;
}
.btn-secondary:hover { background: var(--surface2); }

/* Requests modal */
.req-tabs { display: flex; border-bottom: 1px solid var(--border); }
.req-tab {
  flex: 1; padding: 12px 0;
  background: transparent; border: none; border-bottom: 2px solid transparent;
  font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 500;
  color: var(--text-dim); cursor: pointer; transition: color 0.15s, border-color 0.15s;
}
.req-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.requests-list { padding: 8px 12px 16px; display: flex; flex-direction: column; gap: 4px; max-height: 340px; overflow-y: auto; }
.request-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius-sm); transition: background 0.12s; }
.request-item:hover { background: var(--surface2); }
.request-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
.request-info { flex: 1; min-width: 0; }
.request-name { font-size: 14px; font-weight: 500; color: var(--text); }
.request-meta { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
.request-btns { display: flex; gap: 6px; }
.req-accept { padding: 6px 14px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
.req-accept:hover { background: var(--accent-hover); }
.req-decline { padding: 6px 12px; background: transparent; border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text-muted); font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
.req-decline:hover { background: var(--surface2); }
.empty-requests { padding: 40px 20px; text-align: center; color: var(--text-dim); font-size: 13px; }

/* Toast */
.toast {
  position: fixed; bottom: calc(var(--bottom-nav-h) + 12px + var(--safe-bottom)); left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--radius-sm); padding: 10px 16px;
  font-size: 13px; font-weight: 500; color: var(--text);
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
  z-index: 300; display: flex; align-items: center; gap: 8px;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
.toast.danger .toast-dot { background: var(--danger); }

/* Lightbox / media preview */
.lightbox {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,0.92);
  display: none; align-items: center; justify-content: center;
  flex-direction: column;
  animation: fadeIn 0.15s ease;
}
.lightbox.open { display: flex; }
.lightbox-topbar {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 14px 16px;
  padding-top: calc(14px + var(--safe-top));
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; z-index: 2;
}
.lightbox-info { min-width: 0; }
.lightbox-name { font-size: 13.5px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.lightbox-size { font-size: 11.5px; color: rgba(255,255,255,0.6); margin-top: 1px; }
.lightbox-actions { display: flex; gap: 4px; flex-shrink: 0; }
.lightbox-btn {
  width: 38px; height: 38px; border-radius: 50%; border: none;
  background: rgba(255,255,255,0.12); color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.lightbox-btn:hover { background: rgba(255,255,255,0.2); }
.lightbox-btn svg { width: 18px; height: 18px; }
.lightbox-body {
  flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
  padding: 70px 16px;
  overflow: hidden;
}
.lightbox-body img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
.lightbox-body video { max-width: 100%; max-height: 100%; border-radius: 4px; }
.lightbox-body audio { width: min(400px, 90vw); }
.lightbox-caption {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 14px 16px;
  padding-bottom: calc(14px + var(--safe-bottom));
  font-size: 13.5px; color: rgba(255,255,255,0.85);
  text-align: center; background: linear-gradient(transparent, rgba(0,0,0,0.5));
}

/* ═══════════════════════════════════════════════
   BOTTOM NAV — mobile only
═══════════════════════════════════════════════ */
.bottom-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--bottom-nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--surface); border-top: 1px solid var(--border);
  z-index: 50;
  flex-direction: row; align-items: stretch;
}
.bottom-nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px;
  border: none; background: transparent; color: var(--text-dim);
  cursor: pointer; transition: color 0.15s; position: relative;
  padding: 0;
}
.bottom-nav-btn svg { width: 22px; height: 22px; }
.bottom-nav-btn span { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 500; }
.bottom-nav-btn.active { color: var(--accent); }
.bottom-nav-badge {
  position: absolute; top: 6px;
  right: calc(50% - 18px);
  background: var(--danger); color: #fff;
  font-size: 9px; font-weight: 700; border-radius: 8px;
  padding: 1px 5px; min-width: 16px; text-align: center;
  border: 2px solid var(--surface);
}

/* ═══════════════════════════════════════════════
   DESKTOP LAYOUT
═══════════════════════════════════════════════ */
@media (min-width: 769px) {
  .nav-rail { display: flex; }
  .sidebar { display: flex; width: var(--sidebar-w); position: static; }
  .main { display: flex; position: static; }
  .bottom-nav { display: none !important; }
  .back-btn { display: flex !important; }
  .toast { bottom: 24px; }
}

/* ═══════════════════════════════════════════════
   MOBILE LAYOUT
═══════════════════════════════════════════════ */
@media (max-width: 768px) {
  .nav-rail { display: none; }
  .bottom-nav { display: flex; }

  /* Hide bottom nav when chat is open */
  .main.visible ~ .bottom-nav,
  body.in-chat .bottom-nav { display: none !important; }

  /* Sidebar fills full screen on mobile */
  .sidebar {
    position: fixed; inset: 0;
    width: 100%; z-index: 40;
    transform: translateX(0);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    /* Leave room for bottom nav */
    padding-bottom: calc(var(--bottom-nav-h) + var(--safe-bottom));
  }
  .sidebar.hidden {
    transform: translateX(-100%);
    pointer-events: none;
  }
  .sidebar-title { font-size: 20px; font-weight: 700; margin-bottom: 14px; padding-top: 8px; }
  .contact-avatar { width: 48px; height: 48px; font-size: 16px; }
  .contact-name { font-size: 15px; }
  .contact-preview { font-size: 13px; }
  .contact-item { padding: 10px 8px; }

  /* Main/chat fills full screen, starts off-screen */
  .main {
    position: fixed; inset: 0;
    width: 100%;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    z-index: 45;
  }
  .main.visible { transform: translateX(0); }

  /* Chat header on mobile */
  .chat-header { height: 60px; padding: 0 8px 0 4px; background: var(--surface); border-bottom: 1px solid var(--border); }

  .msg-wrap { max-width: calc(100vw - 68px); }
  .msg-bubble { font-size: 14px; }

  /* Chat input floats above bottom nav */
  .chat-input-area {
    padding: 10px 12px;
    padding-bottom: calc(10px + var(--safe-bottom));
    background: var(--surface);
  }

  /* Empty state: hide on mobile when sidebar is showing */
  .main:not(.visible) .empty-state { display: none; }

  /* Sidebar search larger tap targets */
  .search-input { padding: 9px 10px 9px 34px; font-size: 14px; border-radius: 10px; }

  /* Message font sizes */
  .msg-time { font-size: 11px; }
}

.sidebar-section-label.search-label { color: var(--accent); }
.contact-item.search-result-item .contact-preview { color: var(--text-muted); }
</style>
</head>
<body>

<!-- NAV RAIL (desktop only) -->
<nav class="nav-rail">
  <div class="nav-logo">
    <svg viewBox="0 0 18 18" fill="none"><path d="M3 13.5C3 13.5 4.5 10.5 9 10.5C13.5 10.5 15 13.5 15 13.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="6.5" r="3" stroke="white" stroke-width="1.8"/></svg>
  </div>
  <button class="nav-btn active" title="Chats" onclick="setNav(this)">
    <svg viewBox="0 0 20 20" fill="none"><path d="M2 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6l-4 3V5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </button>
  <button class="nav-btn" title="Friend Requests" onclick="openRequests()">
    <svg viewBox="0 0 20 20" fill="none"><circle cx="8" cy="7" r="3.5" stroke="currentColor" stroke-width="1.5"/><path d="M2 17c0-3.314 2.686-6 6-6M14 11v6M11 14h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span class="nav-badge" id="nav-badge"></span>
  </button>
  <button class="nav-btn" title="Settings" onclick="setNav(this)">
    <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <div class="nav-spacer"></div>
  <div class="nav-avatar" onclick="openProfile()" title="Your profile">
    ??
    <span class="status-dot"></span>
  </div>
  <button class="nav-btn" title="Logout" onclick="logout()">
    <svg viewBox="0 0 20 20" fill="none"><path d="M7 3H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h3M13 14l4-4-4-4M17 10H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</nav>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">Messages</div>
    <div class="search-wrap">
      <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input class="search-input" type="text" id="sidebar-search-input" placeholder="Search conversations…" oninput="onSidebarSearch(this.value)">
    </div>
  </div>
  <div class="sidebar-section-label">Recent</div>
  <div class="contact-list" id="contact-list"></div>
</aside>

<!-- MAIN -->
<main class="main" id="main">
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H7l-4 3V6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </div>
    <div class="empty-title">No conversation open</div>
    <div class="empty-sub">Pick someone from the sidebar to start chatting</div>
  </div>

  <div class="chat-area" id="chat-area">
    <!-- CHAT HEADER -->
    <div class="chat-header">
      <div class="chat-header-left">
        <button class="back-btn icon-btn" onclick="closeChatMobile()" title="Back" style="display:none;flex-shrink:0;width:38px;height:38px">
          <svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="chat-header-avatar" id="chat-avatar"></div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chat-name"></div>
          <div class="chat-header-status" id="chat-status">Online</div>
        </div>
      </div>
      <div class="chat-header-actions">
        <button class="icon-btn" title="Search in chat" onclick="toggleChatSearch()">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" title="More options">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="4" r="1" fill="currentColor"/><circle cx="8" cy="8" r="1" fill="currentColor"/><circle cx="8" cy="12" r="1" fill="currentColor"/></svg>
        </button>
      </div>
    </div>

    <!-- CHAT SEARCH BAR -->
    <div class="chat-search-bar" id="chat-search-bar">
      <input type="text" id="chat-search-input" placeholder="Search messages…" oninput="onChatSearch(this.value)" onkeydown="chatSearchKey(event)">
      <div class="chat-search-nav">
        <span class="chat-search-count" id="chat-search-count"></span>
        <button class="icon-btn" onclick="chatSearchStep(-1)" title="Previous">
          <svg viewBox="0 0 16 16" fill="none"><path d="M4 10l4-4 4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" onclick="chatSearchStep(1)" title="Next">
          <svg viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" onclick="closeChatSearch()" title="Close">
          <svg viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <div class="messages-area" id="messages-area">
      <div class="typing-pill" id="typing-pill">
        <span class="typing-dots"><span></span><span></span><span></span></span>
        <span id="typing-pill-name"></span> is typing
      </div>
    </div>

    <!-- REPLY BAR -->
    <div class="reply-bar" id="reply-bar">
      <div class="reply-bar-inner">
        <div class="reply-bar-label" id="reply-bar-label">Replying to</div>
        <div class="reply-bar-preview" id="reply-bar-preview"></div>
      </div>
      <button class="reply-cancel" onclick="clearReply()" title="Cancel reply">
        <svg viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- UPLOAD PROGRESS BAR (shown during actual upload) -->
    <div class="upload-bar" id="upload-bar">
      <span class="upload-bar-name" id="upload-bar-name"></span>
      <div class="upload-track"><div class="upload-fill" id="upload-fill"></div></div>
      <span class="upload-pct" id="upload-pct">0%</span>
      <button class="upload-cancel" onclick="cancelUpload()" title="Cancel">
        <svg viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- FILE PREVIEW TRAY (shown after picking, before sending) -->
    <div class="file-tray" id="file-tray">
      <div class="file-tray-inner" id="file-tray-inner"></div>
      <button class="file-tray-remove" onclick="clearStagedFile()" title="Remove">
        <svg viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <input type="file" id="file-input" style="display:none" onchange="onFileSelected(event)">

    <div class="chat-input-area">
      <div class="input-row">
        <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach file">
          <svg viewBox="0 0 20 20" fill="none"><path d="M16.5 10.5l-7 7a5 5 0 0 1-7-7l7.5-7.5a3 3 0 0 1 4.24 4.24l-7.5 7.5a1 1 0 0 1-1.42-1.42l7-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <textarea class="msg-input" id="msg-input" rows="1" placeholder="Message…" onkeydown="handleKey(event)" oninput="onMsgInput(event)"></textarea>
        <button class="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 16 16" fill="none"><path d="M14 2L2 7l5 2 2 5 5-12z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>
</main>

<!-- BOTTOM NAV (mobile only) -->
<nav class="bottom-nav" id="bottom-nav">

<script>
const API = 'http://127.0.0.1:8000';
let ws;
let currentUsername;
let originalAbout = '';
let activeReqTab = 'incoming';
let requestCount = 0;

const sidebarMap = new Map();
let sidebarOldestId = 999999999;
let sidebarLoadingMore = false;
let sidebarAllLoaded = false;

const typingUsers = new Map();
let lastTypingPing = 0;
const TYPING_THROTTLE = 2500;

let replyingTo = null;
let activeChat = null;

const avatarColors = [
  ['#3b4fd4','#c7cbf9'],['#2e7d5e','#a8d5c2'],['#8b3a3a','#f5c2c2'],
  ['#5a3e8a','#d0bbf5'],['#8a5a1a','#f5d8a0'],['#1a5a8a','#a0d4f5'],
];

function getColorIdx(username) {
  let h = 0;
  for (let i = 0; i < username.length; i++) h = (h * 31 + username.charCodeAt(i)) & 0xfffffff;
  return h % avatarColors.length;
}
function initials(name) { return (name || '??').slice(0, 2).toUpperCase(); }

function formatTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr.endsWith('Z') ? dateStr : dateStr + 'Z');
  const now = new Date();
  const diffMin = Math.floor((now - d) / 60000);
  if (diffMin < 1) return 'now';
  if (diffMin < 60) return `${diffMin}m`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return `${diffH}h`;
  const diffD = Math.floor(diffH / 24);
  if (diffD === 1) return 'yday';
  if (diffD < 7) return `${diffD}d`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function formatMsgTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr.endsWith('Z') ? dateStr : dateStr + 'Z');
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function formatMsgDate(dateStr) {
  if (!dateStr) return 'Today';
  const d = new Date(dateStr.endsWith('Z') ? dateStr : dateStr + 'Z');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const msgDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffD = Math.round((today - msgDay) / 86400000);
  if (diffD === 0) return 'Today';
  if (diffD === 1) return 'Yesterday';
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── TYPING ── */
function setTyping(username, chat_id) {
  if (typingUsers.has(username)) clearTimeout(typingUsers.get(username));
  const timer = setTimeout(() => clearTyping(username, chat_id), 3500);
  typingUsers.set(username, timer);
  updateTypingUI(username, chat_id, true);
}
function clearTyping(username, chat_id) {
  if (typingUsers.has(username)) { clearTimeout(typingUsers.get(username)); typingUsers.delete(username); }
  updateTypingUI(username, chat_id, false);
}
function updateTypingUI(username, chat_id, isTyping) {
  const entry = sidebarMap.get(chat_id);
  if (entry) {
    const el = document.querySelector(`#sidebar-${chat_id} .contact-preview`);
    if (el) {
      if (isTyping) {
        el.className = 'contact-preview typing-preview';
        el.innerHTML = `<span class="typing-dots-sm"><span></span><span></span><span></span></span> typing…`;
      } else {
        el.className = 'contact-preview';
        const previewPrefix = entry.sender === currentUsername ? 'You: ' : '';
        el.textContent = previewPrefix + (entry.content ? entry.content : '—');
      }
    }
  }
  if (activeChat && activeChat.chat_id === chat_id) {
    const statusEl = document.getElementById('chat-status');
    if (isTyping) {
      statusEl.className = 'chat-header-status typing-status';
      statusEl.innerHTML = `<span class="typing-dots"><span></span><span></span><span></span></span> typing…`;
    } else {
      statusEl.className = 'chat-header-status';
      statusEl.textContent = 'Online';
    }
    const pill = document.getElementById('typing-pill');
    const nameEl = document.getElementById('typing-pill-name');
    if (isTyping) { nameEl.textContent = username; pill.classList.add('visible'); }
    else { pill.classList.remove('visible'); }
  }
}

/* ── REPLY ── */
function setReply(msg) {
  replyingTo = msg;
  document.getElementById('reply-bar-label').textContent =
    msg.sender === currentUsername ? 'Replying to yourself' : `Replying to ${msg.sender}`;
  document.getElementById('reply-bar-preview').textContent =
    msg.content || (msg.attachment_url ? '📎 ' + (msg.original_name || 'Attachment') : '…');
  document.getElementById('reply-bar').classList.add('visible');
  document.getElementById('msg-input').focus();
}
function clearReply() {
  replyingTo = null;
  document.getElementById('reply-bar').classList.remove('visible');
}

/* ── SCROLL TO QUOTED MSG ── */
async function scrollToMsg(msgId) {
  const el = document.querySelector(`.msg-row[data-id="${msgId}"]`);
  if (el) { flashMsg(el); return; }
  if (!activeChat) return;
  const { chat_id } = activeChat;
  const [beforeRes, afterRes] = await Promise.all([
    fetch(`${API}/load_chat/${msgId + 1}/${chat_id}`, { credentials: 'include' }),
    fetch(`${API}/load_chat_after/${msgId - 1}/${chat_id}`, { credentials: 'include' })
  ]);
  const beforeRows = await beforeRes.json();
  const afterRows = await afterRes.json();
  const before = (beforeRows||[]).map(r=>({id:r[0],chat_id:r[1],sender:r[2],content:r[3],sent_at:r[4],replied_to:r[5]??null,replied_content:null,attachment_url:r[6]??null,content_type:r[7]??null,original_name:r[8]??null,size_bytes:r[9]??null})).reverse();
  const after = (afterRows||[]).map(r=>({id:r[0],chat_id:r[1],sender:r[2],content:r[3],sent_at:r[4],replied_to:r[5]??null,replied_content:null,attachment_url:r[6]??null,content_type:r[7]??null,original_name:r[8]??null,size_bytes:r[9]??null}));
  const allFetched = [...before, ...after];
  const targetRaw = allFetched.find(x => x.id === msgId);
  const matchMsg = targetRaw || { id: msgId, chat_id, sender: '?', content: '…', sent_at: null, replied_to: null, replied_content: null, attachment_url: null, content_type: null, original_name: null, size_bytes: null };
  activeChat.messages = [...before, matchMsg, ...after];
  activeChat.oldestId = before.length ? before[0].id : msgId;
  activeChat.hasMore = before.length >= 50;
  activeChat.hasNewer = after.length >= 50;
  renderMessages();
  setTimeout(() => { const t = document.querySelector(`.msg-row[data-id="${msgId}"]`); if (t) flashMsg(t); }, 50);
}
function flashMsg(el) {
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.remove('flash-highlight');
  void el.offsetWidth;
  el.classList.add('flash-highlight');
  setTimeout(() => el.classList.remove('flash-highlight'), 1200);
}

/* ── INIT ── */
document.addEventListener('DOMContentLoaded', async () => {
  const sessionRes = await fetch(`${API}/session`, { credentials: 'include' });
  if (!sessionRes.ok) { location.href = './index.html'; return; }
  const meRes = await fetch(`${API}/me`, { credentials: 'include' });
  const me = await meRes.json();
  if (!me) return;
  currentUsername = me.username;
  const initStr = me.username.slice(0, 2).toUpperCase();
  document.querySelector('.nav-avatar').childNodes[0].textContent = initStr;
  const countRes = await fetch(`${API}/request_notification`, { credentials: 'include' });
  const countData = await countRes.json();
  requestCount = countData.requests_count;
  updateRequestBadge(requestCount);
  await loadSidebar();
  connectWebSocket();
  document.getElementById('contact-list').addEventListener('scroll', onSidebarScroll);
  const params = new URLSearchParams(window.location.search);
  const chatIdFromUrl = params.get('c');
  if (chatIdFromUrl) {
    const tryOpen = () => { if (sidebarMap.has(chatIdFromUrl)) openChat(chatIdFromUrl); };
    tryOpen(); setTimeout(tryOpen, 400);
  }
});

/* ── SIDEBAR ── */
async function loadSidebar() {
  if (sidebarLoadingMore || sidebarAllLoaded) return;
  sidebarLoadingMore = true;
  try {
    const res = await fetch(`${API}/load_sidebar/${sidebarOldestId}`, { credentials: 'include' });
    if (!res.ok) return;
    const rows = await res.json();
    if (!rows || !rows.length) { sidebarAllLoaded = true; return; }
    for (const row of rows) {
      const [username, chat_id, sender, content, sent_at, last_id, unread_count] = row;
      if (!sidebarMap.has(chat_id)) {
        sidebarMap.set(chat_id, { username, chat_id, sender, content, sent_at, last_id: last_id ?? 0, unread_count: unread_count ?? 0, colorIdx: getColorIdx(username) });
      }
    }
    const validIds = rows.map(r => r[5]).filter(id => id !== null);
    if (validIds.length) sidebarOldestId = Math.min(...validIds);
    if (rows.length < 50) sidebarAllLoaded = true;
    renderSidebar();
  } finally { sidebarLoadingMore = false; }
}
function onSidebarScroll() {
  const el = document.getElementById('contact-list');
  if (el.scrollTop + el.clientHeight >= el.scrollHeight - 40) loadSidebar();
}
function renderSidebar() {
  const list = document.getElementById('contact-list');
  const sorted = [...sidebarMap.values()].sort((a,b)=>(b.last_id||0)-(a.last_id||0));
  if (!sorted.length) {
    list.innerHTML = `<div style="padding:24px 12px;text-align:center;color:var(--text-dim);font-size:13px">No conversations yet</div>`;
    return;
  }
  list.innerHTML = sorted.map(c => {
    const [bg, fg] = avatarColors[c.colorIdx];
    const isActive = activeChat && activeChat.chat_id === c.chat_id;
    const isTypingNow = typingUsers.has(c.username);
    const previewPrefix = c.sender === currentUsername ? 'You: ' : '';
    const preview = c.content ? escapeHtml(c.content) : '—';
    let previewHtml;
    if (isTypingNow) {
      previewHtml = `<div class="contact-preview typing-preview"><span class="typing-dots-sm"><span></span><span></span><span></span></span> typing…</div>`;
    } else {
      previewHtml = `<div class="contact-preview">${previewPrefix}${preview}</div>`;
    }
    return `
    <div class="contact-item${isActive ? ' active' : ''}" id="sidebar-${c.chat_id}" onclick="openChat('${c.chat_id}')">
      <div class="contact-avatar" style="background:${bg}20;color:${fg}">${initials(c.username)}</div>
      <div class="contact-info">
        <div class="contact-name">${escapeHtml(c.username)}</div>
        ${previewHtml}
      </div>
      <div class="contact-meta">
        <span class="contact-time">${formatTime(c.sent_at)}</span>
        ${c.unread_count > 0 ? `<span class="unread-badge">${c.unread_count}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}
function upsertSidebarEntry(chat_id, username, sender, content, sent_at, msg_id, isIncoming) {
  if (sidebarMap.has(chat_id)) {
    const e = sidebarMap.get(chat_id);
    e.sender = sender; e.content = content; e.sent_at = sent_at; e.last_id = msg_id;
    if (isIncoming && !(activeChat && activeChat.chat_id === chat_id)) e.unread_count = (e.unread_count||0)+1;
  } else {
    sidebarMap.set(chat_id, { username, chat_id, sender, content, sent_at, last_id: msg_id, unread_count: isIncoming ? 1 : 0, colorIdx: getColorIdx(username) });
  }
  renderSidebar();
}

/* ── OPEN CHAT ── */
async function openChat(chat_id) {
  const entry = sidebarMap.get(chat_id);
  if (!entry) return;
  if (activeChat && activeChat.chat_id === chat_id) {
    if (window.innerWidth <= 768) showChatMobile();
    return;
  }
  history.pushState({ chat_id }, '', `?c=${chat_id}`);
  activeChat = { username: entry.username, chat_id, colorIdx: entry.colorIdx, messages: [], oldestId: 999999999, hasMore: true, hasNewer: false };
  clearReply();
  entry.unread_count = 0;
  renderSidebar();

  document.getElementById('empty-state').style.display = 'none';
  const ca = document.getElementById('chat-area');
  ca.style.display = 'flex';
  ca.classList.add('visible');

  showChatMobile();

  const [bg, fg] = avatarColors[entry.colorIdx];
  const avatar = document.getElementById('chat-avatar');
  avatar.textContent = initials(entry.username);
  avatar.style.cssText = `background:${bg}20;color:${fg};width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;`;
  document.getElementById('chat-name').textContent = entry.username;
  const statusEl = document.getElementById('chat-status');
  statusEl.className = 'chat-header-status';
  statusEl.textContent = 'Online';

  const pill = document.getElementById('typing-pill');
  const nameEl = document.getElementById('typing-pill-name');
  pill.classList.remove('visible');
  if (typingUsers.has(entry.username)) { nameEl.textContent = entry.username; pill.classList.add('visible'); }

  const area = document.getElementById('messages-area');
  Array.from(area.children).forEach(child => { if (child !== pill) child.remove(); });
  await loadMoreMessages();
  area.scrollTop = area.scrollHeight;
  if (activeChat.messages.length) sendReadReceipt(chat_id, activeChat.messages[activeChat.messages.length-1].id);
  document.getElementById('msg-input').focus();
}

function showChatMobile() {
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('main').classList.add('visible');
    document.body.classList.add('in-chat');
  }
}

/* ── LOAD MESSAGES ── */
async function loadMoreMessages() {
  if (!activeChat || !activeChat.hasMore) return;
  const { chat_id, oldestId } = activeChat;
  const res = await fetch(`${API}/load_chat/${oldestId}/${chat_id}`, { credentials: 'include' });
  if (!res.ok) return;
  const rows = await res.json();
  if (!rows || !rows.length) { activeChat.hasMore = false; renderMessages(); return; }
  const newMsgs = rows.map(r=>({
    id:r[0], chat_id:r[1], sender:r[2], content:r[3], sent_at:r[4],
    replied_to:r[5]??null, replied_content:null,
    attachment_url:r[6]??null, content_type:r[7]??null,
    original_name:r[8]??null, size_bytes:r[9]??null
  })).reverse();
  activeChat.messages = [...newMsgs, ...activeChat.messages];
  activeChat.oldestId = rows[rows.length-1][0];
  if (rows.length < 50) activeChat.hasMore = false;
  renderMessages();
}
async function loadOlderMessages() {
  if (!activeChat || !activeChat.hasMore) return;
  const area = document.getElementById('messages-area');
  const prevHeight = area.scrollHeight;
  await loadMoreMessages();
  area.scrollTop = area.scrollHeight - prevHeight;
}

/* ── RENDER MESSAGES ── */
function renderMessages(scrollToBottom = false) {
  if (!activeChat) return;
  const area = document.getElementById('messages-area');
  const wasAtBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 60;
  let html = '';
  if (activeChat.hasMore) html += `<button class="load-more-btn" onclick="loadOlderMessages()">Load older messages</button>`;
  let lastDateLabel = '';
  const [bg, fg] = avatarColors[activeChat.colorIdx];
  for (const m of activeChat.messages) {
    const dateLabel = formatMsgDate(m.sent_at);
    if (dateLabel !== lastDateLabel) { html += `<div class="msg-date-divider">${dateLabel}</div>`; lastDateLabel = dateLabel; }
    const isMine = m.sender === currentUsername;
    const theirAvatar = `<div class="msg-avatar-sm" style="background:${bg}20;color:${fg}">${initials(activeChat.username)}</div>`;
    let replyQuoteHtml = '';
    if (m.replied_to !== null && m.replied_to !== undefined) {
      const quotedMsg = activeChat.messages.find(x => x.id === m.replied_to);
      const isAttachment = quotedMsg ? !!quotedMsg.attachment_url : false;
      const quotedContent = quotedMsg
        ? (quotedMsg.attachment_url ? '📎 ' + (quotedMsg.original_name || 'Attachment') : quotedMsg.content)
        : (m.replied_content || '📎 Attachment');
      const quotedSender = quotedMsg ? quotedMsg.sender : (isMine ? activeChat.username : currentUsername);
      replyQuoteHtml = `<div class="reply-quote" onclick="scrollToMsg(${m.replied_to})" title="Jump to original"><div class="reply-quote-sender">${escapeHtml(quotedSender)}</div><div class="reply-quote-text">${escapeHtml(String(quotedContent))}</div></div>`;
    }
    const safeContent = (m.content||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
    const safeSender = m.sender.replace(/'/g,"\\'");

    // Build bubble content — attachment or plain text
    let bubbleInner = '';
    if (m.attachment_url) {
      const ct = m.content_type || '';
      const url = m.attachment_url;
      const fname = m.original_name || 'File';
      const sizeStr = m.size_bytes ? formatBytes(m.size_bytes) : '';
      if (ct.startsWith('image/')) {
        bubbleInner = `<div class="msg-attachment"><img class="msg-img" src="${escapeHtml(url)}" loading="lazy" onclick="openLightbox('${escapeHtml(url)}','image','${escapeHtml(fname)}','${sizeStr}','${escapeHtml((m.content||'').replace(/'/g,"\\'"))}')" alt="image"></div>`;
      } else if (ct.startsWith('video/')) {
        bubbleInner = `<div class="msg-attachment" style="position:relative;cursor:pointer" onclick="openLightbox('${escapeHtml(url)}','video','${escapeHtml(fname)}','${sizeStr}','${escapeHtml((m.content||'').replace(/'/g,"\\'"))}')"><video style="max-width:240px;max-height:260px;width:100%;border-radius:10px;display:block;" src="${escapeHtml(url)}" muted preload="metadata"></video><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;"><div style="width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 20 20" width="18" height="18" fill="#fff"><path d="M6 4l11 6-11 6V4z"/></svg></div></div></div>`;
      } else if (ct.startsWith('audio/')) {
        bubbleInner = `<div class="msg-attachment"><audio controls style="width:100%;min-width:180px;" src="${escapeHtml(url)}"></audio></div>`;
      } else {
        bubbleInner = `<div class="msg-file-card" style="cursor:pointer" onclick="openLightbox('${escapeHtml(url)}','file','${escapeHtml(fname)}','${sizeStr}','${escapeHtml((m.content||'').replace(/'/g,"\\'"))}')"><div class="msg-file-icon"><svg viewBox="0 0 16 16" fill="none"><path d="M4 2h6l4 4v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.3"/><path d="M10 2v4h4" stroke="currentColor" stroke-width="1.3"/></svg></div><div class="msg-file-info"><div class="msg-file-name">${escapeHtml(fname)}</div><div class="msg-file-size">${sizeStr}</div></div></div>`;
      }
      if (m.content) bubbleInner += `<div class="msg-caption">${escapeHtml(m.content)}</div>`;
    } else {
      bubbleInner = escapeHtml(m.content || '');
    }

    html += `
    <div class="msg-row ${isMine?'mine':''}" data-id="${m.id}">
      ${!isMine ? theirAvatar : ''}
      <div class="msg-wrap">
        <button class="reply-btn" onclick="setReply({id:${m.id},sender:'${safeSender}',content:'${safeContent}',attachment_url:${m.attachment_url ? `'${escapeHtml(m.attachment_url)}'` : 'null'},original_name:${m.original_name ? `'${escapeHtml(m.original_name)}'` : 'null'}})" title="Reply">
          <svg viewBox="0 0 14 14" fill="none"><path d="M1 5h8a4 4 0 0 1 0 8H6M1 5l3-3M1 5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        ${replyQuoteHtml}
        <div class="msg-bubble">${bubbleInner}</div>
        <div class="msg-time">${formatMsgTime(m.sent_at)}</div>
      </div>
    </div>`;
  }
  if (!activeChat.messages.length && !activeChat.hasMore) html = `<div style="text-align:center;color:var(--text-dim);font-size:13px;margin-top:40px">No messages yet. Say hi!</div>`;
  if (activeChat.hasNewer) html += `<button class="load-more-btn" onclick="loadNewerMessages()">Load newer messages</button>`;
  const pill = document.getElementById('typing-pill');
  Array.from(area.children).forEach(child => { if (child !== pill) child.remove(); });
  pill.insertAdjacentHTML('beforebegin', html);
  if (scrollToBottom || wasAtBottom) area.scrollTop = area.scrollHeight;
}

async function loadNewerMessages() {
  if (!activeChat || !activeChat.hasNewer) return;
  const { chat_id, messages } = activeChat;
  const newestId = messages[messages.length-1].id;
  const res = await fetch(`${API}/load_chat_after/${newestId}/${chat_id}`, { credentials: 'include' });
  if (!res.ok) return;
  const rows = await res.json();
  if (!rows || !rows.length) { activeChat.hasNewer = false; renderMessages(); return; }
  const newMsgs = rows.map(r=>({
    id:r[0], chat_id:r[1], sender:r[2], content:r[3], sent_at:r[4],
    replied_to:r[5]??null, replied_content:null,
    attachment_url:r[6]??null, content_type:r[7]??null,
    original_name:r[8]??null, size_bytes:r[9]??null
  }));
  const area = document.getElementById('messages-area');
  const prevDistFromBottom = area.scrollHeight - area.scrollTop - area.clientHeight;
  activeChat.messages = [...activeChat.messages, ...newMsgs];
  if (newMsgs.length < 50) activeChat.hasNewer = false;
  renderMessages();
  area.scrollTop = area.scrollHeight - area.clientHeight - prevDistFromBottom;
}

document.getElementById('messages-area').addEventListener('scroll', function() {
  if (this.scrollTop < 40 && activeChat?.hasMore) loadOlderMessages();
  if (this.scrollHeight - this.scrollTop - this.clientHeight < 40 && activeChat?.hasNewer) loadNewerMessages();
});

/* ── SEND MESSAGE ── */
function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();

  // If a file is staged, confirm/send it (with optional caption) instead of sending text
  if (stagedFile) {
    const caption = text;
    input.value = '';
    input.style.height = 'auto';
    sendStagedFile(caption);
    return;
  }

  if (!text || !activeChat || !ws || ws.readyState !== WebSocket.OPEN) return;
  const payload = { type: 'send_message', chat_id: activeChat.chat_id, username: activeChat.username, content: text };
  if (replyingTo) payload.replied_to = replyingTo.id;
  ws.send(JSON.stringify(payload));
  input.value = '';
  input.style.height = 'auto';
  clearReply();
}
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const text = document.getElementById('msg-input').value.trim();
    if (text || stagedFile) sendMessage();
  }
}

function onMsgInput(e) {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 100) + 'px';
  if (!activeChat || !ws || ws.readyState !== WebSocket.OPEN) return;
  const now = Date.now();
  if (now - lastTypingPing < TYPING_THROTTLE) return;
  lastTypingPing = now;
  ws.send(JSON.stringify({ type: 'typing', username: activeChat.username, chat_id: activeChat.chat_id }));
}

function sendReadReceipt(chat_id, msg_id) {
  if (!ws || ws.readyState !== WebSocket.OPEN || !msg_id) return;
  ws.send(JSON.stringify({ type: 'update_read_receipt', id: msg_id, chat_id }));
}

/* ── WEBSOCKET ── */
function connectWebSocket() {
  ws = new WebSocket(`ws://127.0.0.1:8000/pulse`);
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'sent_message') {
      const newMsg = { id: msg.id||Date.now(), chat_id: msg.chat_id, sender: msg.sender, content: msg.content, sent_at: msg.sent_at, replied_to: msg.replied_to??null, replied_content: msg.replied_content??null };
      if (activeChat && activeChat.chat_id === msg.chat_id) { activeChat.messages.push(newMsg); renderMessages(true); sendReadReceipt(msg.chat_id, newMsg.id); }
      const entry = sidebarMap.get(msg.chat_id);
      upsertSidebarEntry(msg.chat_id, entry ? entry.username : activeChat?.username, msg.sender, msg.content, msg.sent_at, newMsg.id, false);
    }
    if (msg.type === 'receive_message') {
      const newMsg = { id: msg.id||Date.now(), chat_id: msg.chat_id, sender: msg.sender, content: msg.content, sent_at: msg.sent_at, replied_to: msg.replied_to??null, replied_content: msg.replied_content??null };
      if (activeChat && activeChat.chat_id === msg.chat_id) { clearTyping(msg.sender, msg.chat_id); activeChat.messages.push(newMsg); renderMessages(true); sendReadReceipt(msg.chat_id, newMsg.id); }
      upsertSidebarEntry(msg.chat_id, msg.sender, msg.sender, msg.content, msg.sent_at, newMsg.id, true);
    }
    if (msg.type === 'updated_read_receipt') {
      if (sidebarMap.has(msg.chat_id)) { sidebarMap.get(msg.chat_id).unread_count = 0; renderSidebar(); }
    }
    if (msg.type === 'typing') setTyping(msg.username, msg.chat_id);
    if (msg.type === 'request_receive') {
      requestCount++;
      updateRequestBadge(requestCount);
      const modalOpen = document.getElementById('requests-modal').classList.contains('open');
      if (modalOpen && activeReqTab === 'incoming') switchReqTab('incoming');
    }
    if (msg.type === 'request_send') {
      if (msg.reason === 'success') { showReqFeedback('Request sent!', true); const mo = document.getElementById('requests-modal').classList.contains('open'); if (mo && activeReqTab==='outgoing') switchReqTab('outgoing'); }
      else if (msg.reason === 'request_exists') showReqFeedback('Request already sent', false);
      else if (msg.reason === 'already_friend')  showReqFeedback('Already friends', false);
      else if (msg.reason === 'user_no_exist')   showReqFeedback('User not found', false);
      else if (msg.reason === 'request_from_user_exists') showReqFeedback('This user already sent you a request', false);
    }
    if (msg.type === 'request') {
      const modalOpen = document.getElementById('requests-modal').classList.contains('open');
      if (msg.status === 'accepted') {
        showToast(`${msg.username} accepted your request!`);
        if (modalOpen && activeReqTab==='outgoing') switchReqTab('outgoing');
        sidebarAllLoaded = false; sidebarOldestId = 999999999; sidebarMap.clear(); loadSidebar();
      } else if (msg.status === 'rejected') {
        showToast(`${msg.username} declined your request`, true);
        if (modalOpen && activeReqTab==='outgoing') switchReqTab('outgoing');
      }
    }
    if (msg.type === 'sent_attachment' || msg.type === 'receive_attachment') {
      const newMsg = {
        id: msg.id || Date.now(), chat_id: msg.chat_id, sender: msg.sender,
        content: msg.content || null, sent_at: msg.sent_at,
        replied_to: msg.replied_to ?? null, replied_content: msg.replied_content ?? null,
        attachment_url: msg.attachment_url, content_type: msg.content_type || '',
        original_name: msg.original_name || 'File', size_bytes: msg.size_bytes || 0
      };
      const isIncoming = msg.type === 'receive_attachment';
      if (activeChat && activeChat.chat_id === msg.chat_id) {
        if (isIncoming) clearTyping(msg.sender, msg.chat_id);
        activeChat.messages.push(newMsg);
        renderMessages(true);
        sendReadReceipt(msg.chat_id, newMsg.id);
      }
      const entry = sidebarMap.get(msg.chat_id);
      upsertSidebarEntry(msg.chat_id, isIncoming ? msg.sender : (entry?.username ?? activeChat?.username), msg.sender, '📎 Attachment', msg.sent_at, newMsg.id, isIncoming);
    }
    if (msg.type === 'request_takeback') {
      if (!msg.req_detail) return;
      const [id, username] = msg.req_detail;
      document.getElementById(`req-${id}`)?.remove();
      if (username !== currentUsername) { requestCount = Math.max(0, requestCount-1); updateRequestBadge(requestCount); }
      if (!document.querySelectorAll('#requests-list .request-item').length)
        document.getElementById('requests-list').innerHTML = `<div class="empty-requests">No ${activeReqTab} requests</div>`;
    }
  };
  ws.onclose = () => setTimeout(() => connectWebSocket(), 3000);
}

/* ── ATTACHMENTS ── */
let currentXhr = null;
let stagedFile = null;
let stagedUploadId = null;      // upload_id from presign, resolved after R2 PUT
let stagedUploadPromise = null; // resolves to upload_id when R2 PUT finishes
let stagedCancelled = false;

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

function onFileSelected(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file || !activeChat) return;
  if (file.size > 10 * 1024 * 1024) { showToast('File too large (max 10 MB)', true); return; }
  stageFile(file);
}

function stageFile(file) {
  stagedFile = file;
  stagedUploadId = null;
  stagedCancelled = false;

  // Show tray immediately
  const inner = document.getElementById('file-tray-inner');
  let previewHtml = '';
  if (file.type.startsWith('image/')) {
    const url = URL.createObjectURL(file);
    previewHtml = `<img class="file-tray-preview-img" src="${url}" id="file-tray-obj-url">`;
  } else if (file.type.startsWith('video/')) {
    previewHtml = `<div class="file-tray-preview-icon"><svg viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M14 8l4-2v8l-4-2V8z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></div>`;
  } else if (file.type.startsWith('audio/')) {
    previewHtml = `<div class="file-tray-preview-icon"><svg viewBox="0 0 20 20" fill="none"><path d="M9 4v12M5 7v6M13 6v8M17 9v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>`;
  } else {
    previewHtml = `<div class="file-tray-preview-icon"><svg viewBox="0 0 20 20" fill="none"><path d="M5 3h8l4 4v10H5V3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M13 3v4h4" stroke="currentColor" stroke-width="1.5"/></svg></div>`;
  }
  inner.innerHTML = `
    ${previewHtml}
    <div class="file-tray-info">
      <div class="file-tray-name">${escapeHtml(file.name)}</div>
      <div class="file-tray-size"><span id="tray-upload-status">Uploading…</span> · ${formatBytes(file.size)}</div>
    </div>`;
  document.getElementById('file-tray').classList.add('visible');
  document.getElementById('msg-input').placeholder = 'Add a caption…';
  document.getElementById('msg-input').focus();

  // Start background upload immediately
  stagedUploadPromise = backgroundUpload(file);
}

async function backgroundUpload(file) {
  const chat_id = activeChat?.chat_id;
  if (!chat_id) return null;
  try {
    // 1. Presign
    const presignRes = await fetch(`${API}/upload_media/${chat_id}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
      body: JSON.stringify({ filename: file.name, content_type: file.type, size_bytes: file.size })
    });
    if (!presignRes.ok) throw new Error('presign failed');
    const presignData = await presignRes.json();
    stagedUploadId = presignData.upload_id;

    // 2. PUT to R2
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      currentXhr = xhr;
      xhr.open('PUT', presignData.presigned_url);
      xhr.setRequestHeader('Content-Type', file.type);
      xhr.upload.onprogress = (ev) => {
        if (!ev.lengthComputable) return;
        const p = Math.round(ev.loaded / ev.total * 100);
        const el = document.getElementById('tray-upload-status');
        if (el) el.textContent = p < 100 ? `${p}%` : 'Ready';
      };
      xhr.onload = () => {
        currentXhr = null;
        if (xhr.status < 300) {
          const el = document.getElementById('tray-upload-status');
          if (el) el.textContent = 'Ready';
          resolve();
        } else reject(new Error('S3 ' + xhr.status));
      };
      xhr.onerror = reject;
      xhr.onabort = () => reject(new Error('cancelled'));
      xhr.send(file);
    });

    return stagedUploadId;
  } catch (err) {
    console.error('backgroundUpload error:', err);
    if (stagedCancelled) return null;
    const el = document.getElementById('tray-upload-status');
    if (el) el.textContent = 'Failed';
    showToast('Upload failed', true);
    return null;
  }
}

function clearStagedFile() {
  stagedCancelled = true;
  if (currentXhr) { currentXhr.abort(); currentXhr = null; }
  const img = document.getElementById('file-tray-obj-url');
  if (img) URL.revokeObjectURL(img.src);
  stagedFile = null;
  stagedUploadId = null;
  stagedUploadPromise = null;
  document.getElementById('file-tray').classList.remove('visible');
  document.getElementById('file-tray-inner').innerHTML = '';
  document.getElementById('msg-input').placeholder = 'Message…';
}

async function sendStagedFile(caption) {
  if (!activeChat) return;
  const file = stagedFile;
  const chat_id = activeChat.chat_id;

  // Wait for background upload to finish if still running
  const statusEl = document.getElementById('tray-upload-status');
  if (statusEl && statusEl.textContent !== 'Ready') {
    statusEl.textContent = 'Sending…';
  }

  let uploadId;
  try {
    uploadId = await stagedUploadPromise;
  } catch (_) {}

  if (!uploadId || stagedCancelled) { showToast('Upload not ready', true); return; }

  // Clear tray immediately so UI feels snappy
  clearStagedFile();

  // Show slim progress bar during confirm call
  const bar = document.getElementById('upload-bar');
  document.getElementById('upload-bar-name').textContent = file.name;
  document.getElementById('upload-fill').style.width = '100%';
  document.getElementById('upload-pct').textContent = 'Sending…';
  bar.classList.add('visible');

  try {
    const confirmRes = await fetch(`${API}/confirm_media/${chat_id}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
      body: JSON.stringify({
        uploadid: uploadId,
        username: activeChat.username,
        message: caption || null,
        id: replyingTo?.id ?? null,
        replied_content: replyingTo?.content ?? null
      })
    });
    if (!confirmRes.ok) { showToast('Send failed', true); return; }
    clearReply();
  } catch (err) {
    showToast('Send failed', true);
  } finally {
    bar.classList.remove('visible');
  }
}

function cancelUpload() {
  clearStagedFile();
  document.getElementById('upload-bar').classList.remove('visible');
}

/* ── LIGHTBOX ── */
function openLightbox(url, type, name, sizeStr, caption) {
  const body = document.getElementById('lightbox-body');
  const dl = document.getElementById('lightbox-download');
  document.getElementById('lightbox-name').textContent = name || 'File';
  document.getElementById('lightbox-size').textContent = sizeStr || '';
  dl.href = url;
  dl.setAttribute('download', name || 'download');

  if (type === 'image') {
    body.innerHTML = `<img src="${url}" alt="${escapeHtml(name||'')}">`;
  } else if (type === 'video') {
    body.innerHTML = `<video src="${url}" controls autoplay></video>`;
  } else if (type === 'audio') {
    body.innerHTML = `<audio src="${url}" controls autoplay></audio>`;
  } else {
    body.innerHTML = `
      <div style="text-align:center;color:#fff;">
        <div style="width:64px;height:64px;border-radius:14px;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none"><path d="M6 3h9l6 6v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="#fff" stroke-width="1.4"/><path d="M15 3v6h6" stroke="#fff" stroke-width="1.4"/></svg>
        </div>
        <div style="font-size:14px;opacity:0.8;">Preview unavailable — tap download to open</div>
      </div>`;
  }

  const capEl = document.getElementById('lightbox-caption');
  if (caption) { capEl.textContent = caption; capEl.style.display = 'block'; }
  else { capEl.style.display = 'none'; }

  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-body').innerHTML = '';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) closeLightbox();
});
