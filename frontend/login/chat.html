/* ── REQUESTS ── */
async function openRequests() {
  document.getElementById('requests-modal').classList.add('open');
  switchReqTab('incoming');
}
async function switchReqTab(tab) {
  activeReqTab = tab;
  document.getElementById('tab-incoming').classList.toggle('active', tab === 'incoming');
  document.getElementById('tab-outgoing').classList.toggle('active', tab === 'outgoing');
  const endpoint = tab === 'incoming' ? 'requests_list' : 'requests_list_outgoing';
  const res = await fetch(`${API}/${endpoint}`, { credentials: 'include' });
  const data = await res.json();
  renderRequests(data, tab);
}
function renderRequests(data, tab) {
  const list = document.getElementById('requests-list');
  if (!data || !data.length) { list.innerHTML = `<div class="empty-requests">No ${tab} requests</div>`; return; }
  list.innerHTML = data.map((r,i) => {
    const [bg, fg] = avatarColors[i % avatarColors.length];
    const displayName = r[1];
    const date = 'Sent on ' + new Date(r[2]).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    return `
    <div class="request-item" id="req-${r[0]}" tabindex="0" role="button">
      <div class="request-avatar" style="background:${bg}20;color:${fg}">${displayName.slice(0,2).toUpperCase()}</div>
      <div class="request-info"><div class="request-name">${escapeHtml(displayName)}</div><div class="request-meta">${date}</div></div>
      <div class="request-btns">
        ${tab === 'incoming' ? `<button class="req-accept" onclick="acceptReq(${r[0]},'${displayName}')">Accept</button><button class="req-decline" onclick="declineReq(${r[0]},'${displayName}')">Decline</button>`
        : `<button class="req-decline" onclick="takebackReq(${r[0]},'${displayName}')">Cancel</button>`}
      </div>
    </div>`;
  }).join('');
}
function acceptReq(id, senderUsername) {
  ws.send(JSON.stringify({ type: 'request', id, username: senderUsername, status: 'accept' }));
  document.getElementById(`req-${id}`)?.remove();
  requestCount = Math.max(0, requestCount-1); updateRequestBadge(requestCount);
  if (!document.querySelectorAll('#requests-list .request-item').length) document.getElementById('requests-list').innerHTML = `<div class="empty-requests">No incoming requests</div>`;
}
function declineReq(id, username) {
  ws.send(JSON.stringify({ type: 'request', id, username, status: 'decline' }));
  document.getElementById(`req-${id}`)?.remove();
  requestCount = Math.max(0, requestCount-1); updateRequestBadge(requestCount);
  if (!document.querySelectorAll('#requests-list .request-item').length) document.getElementById('requests-list').innerHTML = `<div class="empty-requests">No ${activeReqTab} requests</div>`;
}
function takebackReq(id, username) {
  ws.send(JSON.stringify({ type: 'request_takeback', id, username }));
  document.getElementById(`req-${id}`)?.remove();
  if (!document.querySelectorAll('#requests-list .request-item').length) document.getElementById('requests-list').innerHTML = `<div class="empty-requests">No ${activeReqTab} requests</div>`;
}
function sendRequest() {
  const input = document.getElementById('send-req-input');
  const username = input.value.trim();
  if (!username || !ws) return;
  ws.send(JSON.stringify({ type: 'request_send', username }));
}
function showReqFeedback(msg, ok) {
  const fb = document.getElementById('send-req-feedback');
  const input = document.getElementById('send-req-input');
  fb.textContent = msg; fb.style.display = 'block'; fb.style.color = ok ? 'var(--success)' : 'var(--danger)';
  input.style.borderColor = ok ? 'rgba(76,175,138,0.5)' : 'rgba(224,92,92,0.5)';
  setTimeout(() => { fb.style.display = 'none'; input.style.borderColor = ''; if (ok) input.value = ''; }, 3000);
}

let selectedGroupMembers = new Set();
let availableGroupFriends = [];

let groupModalMode = 'create';
let groupModalChatId = null;

function openCreateGroup() {
  groupModalMode = 'create';

async function openAddMembers() {
  if (!activeChat || !activeChat.isGroup) return;
  groupModalMode = 'add';
  groupModalChatId = activeChat.chat_id;
  selectedGroupMembers.clear();
  document.getElementById('group-modal-title').textContent = `Add members to ${activeChat.username}`;
  document.getElementById('grp-name-field').style.display = 'none';
  document.getElementById('grp-create-btn').textContent = 'Add';

  let existing = [];
  try {
    const res = await fetch(`${API}/grp_members/${activeChat.chat_id}`, { credentials: 'include' });
    if (res.ok) existing = await res.json();
  } catch (e) {}
  const existingSet = new Set(existing);

  availableGroupFriends = [...sidebarMap.values()]
    .filter(e => !e.isGroup && e.username !== currentUsername && !existingSet.has(e.username))
    .map(e => e.username)
    .sort();

async function submitCreateGroup() {
  if (groupModalMode === 'add') {
    if (!selectedGroupMembers.size) { showToast('Select at least one friend', true); return; }
    const res = await fetch(`${API}/add_to_group/${groupModalChatId}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
      body: JSON.stringify({ group_name: activeChat?.username || '', memebers: [...selectedGroupMembers] })
    });
    if (!res.ok) { showToast('Failed to add members', true); return; }
    closeModal('create-group-modal');
    showToast('Members added!');
    return;
  }
  const group_name = document.getElementById('grp-name-input').value.trim();
  if (!group_name) { showToast('Group name required', true); return; }
  const res = await fetch(`${API}/create_group`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
    body: JSON.stringify({ group_name, memebers: [...selectedGroupMembers] })
  });
  if (!res.ok) { showToast('Failed to create group', true); return; }
  closeModal('create-group-modal');
  showToast('Group created!');
}

function renderGroupMemberList() {
  const list = document.getElementById('grp-member-list');
  if (!availableGroupFriends.length) {
    list.innerHTML = `<div class="empty-requests">No one available to add</div>`;
    return;
  }

function renderGroupChips() {
  const wrap = document.getElementById('grp-chips-wrap');
  if (!selectedGroupMembers.size) { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }
  wrap.style.display = 'flex';
  wrap.innerHTML = [...selectedGroupMembers].map(u => {

function toggleGroupMember(username) {

/* ── GROUP MEMBERS / ROLES / INVITE LINK ── */
let currentGroupRole = null;

async function openGroupMembers() {
  if (!activeChat || !activeChat.isGroup) return;
  document.getElementById('grp-members-title').textContent = `${activeChat.username} · Members`;
  document.getElementById('invite-link-row').style.display = 'none';
  document.getElementById('invite-link-hint').style.display = 'none';
  document.getElementById('invite-link-input').value = '';
  document.getElementById('gen-invite-btn').textContent = 'Generate invite link';
  const list = document.getElementById('grp-members-roles-list');
  list.innerHTML = `<div class="empty-requests">Loading…</div>`;
  document.getElementById('group-members-modal').classList.add('open');
  try {
    const res = await fetch(`${API}/grp_members_roles/${activeChat.chat_id}`, { credentials: 'include' });
    if (!res.ok) { list.innerHTML = `<div class="empty-requests">Failed to load members</div>`; return; }
    const members = await res.json();
    const mine = members.find(m => m[0] === currentUsername);
    currentGroupRole = mine ? mine[1] : 'member';
    renderGroupMembersRoles(members);
  } catch (e) {
    list.innerHTML = `<div class="empty-requests">Failed to load members</div>`;
  }
}

function renderGroupMembersRoles(members) {
  const list = document.getElementById('grp-members-roles-list');
  const canManage = currentGroupRole === 'owner' || currentGroupRole === 'admin';
  if (!members || !members.length) { list.innerHTML = `<div class="empty-requests">No members</div>`; return; }
  const order = { owner: 0, admin: 1, member: 2 };
  const sorted = [...members].sort((a, b) => (order[a[1]] ?? 3) - (order[b[1]] ?? 3) || a[0].localeCompare(b[0]));
  list.innerHTML = sorted.map(([username, role]) => {
    const [bg, fg] = avatarColors[getColorIdx(username)];
    const isSelf = username === currentUsername;
    const roleLabel = role.charAt(0).toUpperCase() + role.slice(1);
    let actionHtml = '';
    if (canManage && !isSelf && role !== 'owner') {
      if (role === 'member') actionHtml += `<button class="req-accept" onclick="promoteMember('${username}')">Promote</button>`;
      else if (role === 'admin') actionHtml += `<button class="req-decline" onclick="demoteMember('${username}')">Demote</button>`;
      actionHtml += `<button class="req-decline" onclick="removeMember('${username}')" title="Remove from group" style="color:var(--danger);border-color:rgba(224,92,92,0.35);">Remove</button>`;
    }
    return `
    <div class="grp-member-row" style="cursor:default;">
      <div class="grp-member-avatar" style="background:${bg}20;color:${fg}">${initials(username)}</div>
      <div class="grp-member-name">${escapeHtml(username)}${isSelf ? ' (you)' : ''}</div>
      <span style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.4px;margin-right:6px;flex-shrink:0;">${roleLabel}</span>
      <div style="display:flex;gap:6px;flex-shrink:0;">${actionHtml}</div>
    </div>`;
  }).join('');
}

function promoteMember(username) {
  if (!activeChat || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'promote_role', username, chat_id: activeChat.chat_id }));
}
function demoteMember(username) {
  if (!activeChat || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'demote_role', username, chat_id: activeChat.chat_id }));
}
function removeMember(username) {
  if (!activeChat || !ws || ws.readyState !== WebSocket.OPEN) return;
  if (!confirm(`Remove ${username} from "${activeChat.username}"?`)) return;
  ws.send(JSON.stringify({ type: 'kick_from_grp', username, chat_id: activeChat.chat_id }));
}

function generateInviteLink() {
  if (!activeChat || !activeChat.isGroup || !ws || ws.readyState !== WebSocket.OPEN) return;
  document.getElementById('gen-invite-btn').textContent = 'Generating…';
  ws.send(JSON.stringify({ type: 'generate_invite_grp', chat_id: activeChat.chat_id }));
}

function copyInviteLink() {
  const input = document.getElementById('invite-link-input');
  if (!input.value) return;
  input.select();
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(input.value).then(() => showToast('Invite link copied')).catch(() => {
      document.execCommand('copy'); showToast('Invite link copied');
    });
  } else {
    document.execCommand('copy'); showToast('Invite link copied');
  }
}

/* ── CHAT SEARCH ── */
let chatSearchResults = [], chatSearchIdx = 0, chatSearchTimer = null;
function toggleChatSearch() {
  if (!activeChat) return;
  const bar = document.getElementById('chat-search-bar');
  if (bar.classList.contains('visible')) { closeChatSearch(); }
  else { bar.classList.add('visible'); document.getElementById('chat-search-input').focus(); }
}
function closeChatSearch() {
  document.getElementById('chat-search-bar').classList.remove('visible');
  document.getElementById('chat-search-input').value = '';
  document.getElementById('chat-search-count').textContent = '';
  chatSearchResults = []; chatSearchIdx = 0;
  document.querySelectorAll('.msg-row.search-match').forEach(el => el.classList.remove('search-match'));
}
function onChatSearch(value) {
  clearTimeout(chatSearchTimer);
  const q = value.trim();
  if (!q) { document.getElementById('chat-search-count').textContent = ''; chatSearchResults = []; document.querySelectorAll('.msg-row.search-match').forEach(el=>el.classList.remove('search-match')); return; }
  chatSearchTimer = setTimeout(() => runChatSearch(q), 350);
}
async function runChatSearch(q) {
  if (!activeChat) return;
  chatSearchResults = []; chatSearchIdx = 0;
  const res = await fetch(`${API}/search_chat/${activeChat.chat_id}/${encodeURIComponent(q)}/999999999`, { credentials: 'include' });
  if (!res.ok) return;
  const rows = await res.json();
  if (!rows || !rows.length) { document.getElementById('chat-search-count').textContent = 'No results'; return; }
  chatSearchResults = rows.map(r => ({ id: r[0], sender: r[1], content: r[2], sent_at: r[3] }));
  chatSearchIdx = 0;
  updateChatSearchCount();
  scrollToSearchResult(chatSearchIdx);
}
function chatSearchStep(dir) { if (!chatSearchResults.length) return; chatSearchIdx = (chatSearchIdx+dir+chatSearchResults.length)%chatSearchResults.length; updateChatSearchCount(); scrollToSearchResult(chatSearchIdx); }
function chatSearchKey(e) { if (e.key==='Enter') { e.shiftKey ? chatSearchStep(-1) : chatSearchStep(1); } if (e.key==='Escape') closeChatSearch(); }
function updateChatSearchCount() { document.getElementById('chat-search-count').textContent = chatSearchResults.length ? `${chatSearchIdx+1} / ${chatSearchResults.length}` : 'No results'; }
function scrollToSearchResult(idx) {
  const match = chatSearchResults[idx]; if (!match) return;
  document.querySelectorAll('.msg-row.search-match').forEach(el => el.classList.remove('search-match'));
  const el = document.querySelector(`.msg-row[data-id="${match.id}"]`);
  if (el) { el.classList.add('search-match'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  jumpToMessage(match);
}
async function jumpToMessage(match) {
  if (!activeChat) return;
  const { chat_id } = activeChat;
  const [beforeRes, afterRes] = await Promise.all([
    fetch(`${API}/load_chat/${match.id+1}/${chat_id}`, { credentials: 'include' }),
    fetch(`${API}/load_chat_after/${match.id-1}/${chat_id}`, { credentials: 'include' })
  ]);
  const beforeRows = await beforeRes.json(); const afterRows = await afterRes.json();
  const before = (beforeRows||[]).map(r=>({id:r[0],chat_id:r[1],sender:r[2],content:r[3],sent_at:r[4],replied_to:r[5]??null,replied_content:null,attachment_url:r[6]??null,content_type:r[7]??null,original_name:r[8]??null,size_bytes:r[9]??null})).reverse();
  const after = (afterRows||[]).map(r=>({id:r[0],chat_id:r[1],sender:r[2],content:r[3],sent_at:r[4],replied_to:r[5]??null,replied_content:null,attachment_url:r[6]??null,content_type:r[7]??null,original_name:r[8]??null,size_bytes:r[9]??null}));
  const matchMsg = { id:match.id, chat_id, sender:match.sender, content:match.content, sent_at:match.sent_at, replied_to:null, replied_content:null, attachment_url:null, content_type:null, original_name:null, size_bytes:null };
  activeChat.messages = [...before, matchMsg, ...after];
  activeChat.oldestId = before.length ? before[0].id : match.id;
  activeChat.hasMore = before.length >= 50;
  activeChat.hasNewer = after.length >= 50;
  renderMessages();
  setTimeout(() => { const t = document.querySelector(`.msg-row[data-id="${match.id}"]`); if (t) { t.classList.add('search-match'); t.scrollIntoView({ behavior:'smooth', block:'center' }); } }, 50);
}

/* ═══════════════════════════════════════════════
   ACCESSIBILITY: KEYBOARD NAVIGATION LAYER
═══════════════════════════════════════════════ */
(function enhanceA11Y() {
  const SELECTORS = ['.contact-item', '.request-item', '.search-result-item'];

  function enhance(el) {
    if (el.dataset.a11yEnhanced) return;
    el.dataset.a11yEnhanced = '1';

    if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
    if (!el.getAttribute('role')) el.setAttribute('role', 'button');

    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
      }
    });
  }

  document.querySelectorAll(SELECTORS.join(',')).forEach(enhance);

  const mo = new MutationObserver((muts) => {
    for (const m of muts) {
      m.addedNodes.forEach((n) => {
        if (!(n instanceof Element)) return;
        if (n.matches && n.matches(SELECTORS.join(','))) enhance(n);
        n.querySelectorAll?.(SELECTORS.join(',')).forEach(enhance);
      });
    }
  });
  mo.observe(document.body, { childList: true, subtree: true });
})();

/* ═══════════════════════════════════════════════
   DRAG & DROP FILE ATTACHMENT LAYER
═══════════════════════════════════════════════ */
(function installDragDrop() {
  let overlay = null;
  let dragDepth = 0;

  function ensureOverlay() {
    if (overlay) return overlay;
    overlay = document.createElement('div');
    overlay.className = 'drag-over';
    overlay.innerHTML = `
      <div class="drag-over-inner">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>Drop files to attach</span>
      </div>`;
    document.body.appendChild(overlay);
    return overlay;
  }

  function show() { overlay = ensureOverlay(); overlay.classList.add('is-visible'); }
  function hide() { overlay?.classList.remove('is-visible'); dragDepth = 0; }

  function handleDrop(files) {
    if (!files || !files.length) return;
    if (!activeChat) {
      showToast('Open a chat first', true);
      return;
    }
    for (const file of files) {
      if (file.size > 10 * 1024 * 1024) {
        showToast(`${file.name} is too large (max 10 MB)`, true);
        continue;
      }
      stageFile(file);
      break;
    }
  }

  window.addEventListener('dragenter', (e) => {
    if (!e.dataTransfer?.types?.includes('Files')) return;
    e.preventDefault();
    dragDepth++;
    show();
  });
  window.addEventListener('dragover', (e) => {
    if (!e.dataTransfer?.types?.includes('Files')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });
  window.addEventListener('dragleave', (e) => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) hide();
  });
  window.addEventListener('drop', (e) => {
    if (!e.dataTransfer?.files?.length) return;
    e.preventDefault();
    handleDrop(e.dataTransfer.files);
    hide();
  });
})();
</script>
