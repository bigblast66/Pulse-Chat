<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1014;
  --surface: #17181d;
  --surface2: #1e2028;
  --surface3: #24262f;
  --border: rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.1);
  --text: #f0f0f2;
  --text-muted: #8b8d97;
  --text-dim: #4a4c58;
  --accent: #5b6af0;
  --accent-hover: #6e7cf2;
  --accent-dim: rgba(91,106,240,0.12);
  --danger: #e05c5c;
  --success: #4caf8a;
  --online: #4caf8a;
  --away: #e0c85c;
  --radius: 10px;
  --radius-sm: 6px;
  --sidebar-w: 280px;
  --nav-w: 60px;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
}

/* NAV RAIL */
.nav-rail {
  width: var(--nav-w);
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0;
  gap: 4px;
  flex-shrink: 0;
  z-index: 10;
}

.nav-logo {
  width: 36px;
  height: 36px;
  background: var(--accent);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  flex-shrink: 0;
}

.nav-logo svg { width: 18px; height: 18px; }

.nav-btn {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s;
  position: relative;
}

.nav-btn svg { width: 18px; height: 18px; }
.nav-btn:hover { background: var(--surface2); color: var(--text-muted); }
.nav-btn.active { background: var(--accent-dim); color: var(--accent); }

.nav-badge {
  display: none;
  position: absolute;
  top: 6px;
  right: 6px;
  width: 7px;
  height: 7px;
  background: var(--danger);
  border-radius: 50%;
  border: 2px solid var(--surface);
}

.nav-spacer { flex: 1; }

.nav-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--accent-dim);
  border: 2px solid var(--border2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  transition: border-color 0.15s;
  position: relative;
}

.nav-avatar:hover { border-color: var(--accent); }

.nav-avatar .status-dot {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 9px;
  height: 9px;
  background: var(--online);
  border-radius: 50%;
  border: 2px solid var(--surface);
}

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
}

.sidebar-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 12px;
  letter-spacing: -0.2px;
}

.search-wrap { position: relative; }

.search-wrap svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  color: var(--text-dim);
  pointer-events: none;
}

.search-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 7px 10px 7px 32px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}

.search-input::placeholder { color: var(--text-dim); }
.search-input:focus { border-color: var(--border2); }

.sidebar-section-label {
  padding: 14px 16px 6px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text-dim);
}

.contact-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px;
}

.contact-list::-webkit-scrollbar { width: 4px; }
.contact-list::-webkit-scrollbar-track { background: transparent; }
.contact-list::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

.contact-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.12s;
  position: relative;
}

.contact-item:hover { background: var(--surface2); }
.contact-item.active { background: var(--accent-dim); }
.contact-item.active .contact-name { color: var(--text); }

.contact-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  position: relative;
}

.contact-info { flex: 1; min-width: 0; }

.contact-name {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.contact-preview {
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
}

/* Typing indicator in sidebar */
.contact-preview.typing-preview {
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 4px;
}

.typing-dots-sm {
  display: inline-flex;
  gap: 2px;
  align-items: center;
}

.typing-dots-sm span {
  width: 3px;
  height: 3px;
  background: var(--accent);
  border-radius: 50%;
  animation: typingBounce 1.2s infinite;
}

.typing-dots-sm span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots-sm span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-3px); opacity: 1; }
}

@keyframes fadeInPill {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.contact-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}

.contact-time { font-size: 11px; color: var(--text-dim); }

.unread-badge {
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  border-radius: 10px;
  padding: 1px 6px;
  min-width: 18px;
  text-align: center;
}

/* MAIN */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--text-dim);
}

.empty-icon {
  width: 56px;
  height: 56px;
  background: var(--surface2);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}

.empty-icon svg { width: 26px; height: 26px; color: var(--text-dim); }
.empty-title { font-size: 15px; font-weight: 600; color: var(--text-muted); }
.empty-sub { font-size: 13px; color: var(--text-dim); text-align: center; max-width: 220px; line-height: 1.5; }

.chat-area { display: none; flex-direction: column; height: 100%; }
.chat-area.visible { display: flex; }

.chat-header {
  padding: 0 20px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.chat-header-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
}

.chat-header-info { flex: 1; }
.chat-header-name { font-size: 14px; font-weight: 600; color: var(--text); }

.typing-dots {
  display: inline-flex;
  gap: 3px;
  align-items: center;
}

.typing-dots span {
  width: 4px;
  height: 4px;
  background: var(--accent);
  border-radius: 50%;
  animation: typingBounce 1.2s infinite;
}

.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

.chat-header-actions { display: flex; gap: 4px; }

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s;
}

.icon-btn svg { width: 16px; height: 16px; }
.icon-btn:hover { background: var(--surface2); color: var(--text-muted); }

.messages-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  padding-bottom: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
}

/* Typing pill floats at the bottom-center of the messages area */
.typing-pill {
  display: none;
  position: sticky;
  bottom: 8px;
  align-self: center;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
  z-index: 5;
  pointer-events: none;
  animation: fadeInPill 0.2s ease;
}

.typing-pill.visible { display: flex; }

.messages-area::-webkit-scrollbar { width: 4px; }
.messages-area::-webkit-scrollbar-track { background: transparent; }
.messages-area::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

.load-more-btn {
  align-self: center;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-muted);
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  padding: 5px 14px;
  cursor: pointer;
  margin-bottom: 8px;
  transition: background 0.15s;
}
.load-more-btn:hover { background: var(--surface3); }

.msg-date-divider {
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  margin: 12px 0 8px;
  position: relative;
}

.msg-date-divider::before, .msg-date-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: calc(50% - 50px);
  height: 1px;
  background: var(--border);
}

.msg-date-divider::before { left: 0; }
.msg-date-divider::after { right: 0; }

.msg-row { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
.msg-row.mine { flex-direction: row-reverse; }

.msg-avatar-sm {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  margin-bottom: 2px;
}

/* Message wrapper (holds reply quote + bubble) */
.msg-wrap {
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  position: relative;
}

/* Reply button shown on hover */
.reply-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s, background 0.15s, color 0.15s;
  flex-shrink: 0;
  z-index: 2;
}

.reply-btn svg { width: 13px; height: 13px; }
.reply-btn:hover { background: var(--surface3); color: var(--accent); }

/* Position: outside the bubble, on the side away from the wall */
.msg-row:not(.mine) .reply-btn { right: -36px; }
.msg-row.mine .reply-btn { left: -36px; }

.msg-row:hover .reply-btn {
  opacity: 1;
  pointer-events: auto;
}

.msg-bubble {
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 13.5px;
  line-height: 1.5;
  word-break: break-word;
  white-space: pre-wrap;
}

.msg-row:not(.mine) .msg-bubble { background: var(--surface2); color: var(--text); border-bottom-left-radius: 3px; }
.msg-row.mine .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }

/* Reply quote block inside a bubble */
.reply-quote {
  border-radius: 8px 8px 0 0;
  padding: 6px 10px;
  font-size: 12px;
  line-height: 1.4;
  border-left: 3px solid rgba(255,255,255,0.3);
  margin-bottom: -4px;
  cursor: pointer;
  overflow: hidden;
}

.reply-quote-text {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  word-break: break-word;
}

.msg-row:not(.mine) .reply-quote {
  background: var(--surface3);
  border-left-color: var(--accent);
  color: var(--text-muted);
  border-radius: 8px 8px 0 0;
}

.msg-row.mine .reply-quote {
  background: rgba(0,0,0,0.2);
  border-left-color: rgba(255,255,255,0.5);
  color: rgba(255,255,255,0.7);
}

.reply-quote-sender {
  font-weight: 600;
  font-size: 11px;
  margin-bottom: 2px;
}

.msg-row:not(.mine) .reply-quote-sender { color: var(--accent); }
.msg-row.mine .reply-quote-sender { color: rgba(255,255,255,0.85); }

.msg-time { font-size: 10.5px; color: var(--text-dim); margin-top: 3px; text-align: right; padding: 0 4px; }
.msg-row.mine .msg-time { text-align: left; }

/* REPLY BAR above input */
.reply-bar {
  display: none;
  padding: 8px 16px 0;
  gap: 10px;
  align-items: center;
  animation: slideUpSmall 0.15s ease;
}

.reply-bar.visible { display: flex; }

@keyframes slideUpSmall {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.reply-bar-inner {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  min-width: 0;
}

.reply-bar-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 2px;
}

.reply-bar-preview {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.reply-cancel {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: none;
  background: var(--surface3);
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
}

.reply-cancel:hover { background: var(--surface2); color: var(--text-muted); }
.reply-cancel svg { width: 12px; height: 12px; }

.chat-input-area {
  padding: 12px 16px 14px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 8px 6px 14px;
  transition: border-color 0.15s;
}

.input-row:focus-within { border-color: var(--border2); }

.msg-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  color: var(--text);
  resize: none;
  max-height: 100px;
  line-height: 1.5;
}

.msg-input::placeholder { color: var(--text-dim); }

.send-btn {
  width: 32px;
  height: 32px;
  background: var(--accent);
  border: none;
  border-radius: 7px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, transform 0.1s;
  flex-shrink: 0;
}

.send-btn:hover { background: var(--accent-hover); }
.send-btn:active { transform: scale(0.93); }
.send-btn svg { width: 15px; height: 15px; color: #fff; }

/* OVERLAYS */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.15s ease;
}

.overlay.open { display: flex; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 16px;
  width: 100%;
  animation: slideUp 0.2s ease;
}

@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
}

.modal-title { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }

.close-btn {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s;
}

.close-btn:hover { background: var(--surface2); color: var(--text-muted); }
.close-btn svg { width: 15px; height: 15px; }

/* PROFILE MODAL */
#profile-modal .modal { max-width: 400px; }

.profile-hero {
  padding: 28px 24px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
}

.profile-avatar-lg {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--accent-dim);
  border: 3px solid var(--border2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 600;
  color: var(--accent);
  position: relative;
  cursor: pointer;
}

.avatar-edit-hint {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.15s;
}

.profile-avatar-lg:hover .avatar-edit-hint { opacity: 1; }
.avatar-edit-hint svg { width: 18px; height: 18px; color: #fff; }

.profile-name-display { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
.profile-email-display { font-size: 12.5px; color: var(--text-muted); margin-top: -6px; }

.profile-status-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--text-muted);
}

.profile-status-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--online); }

.profile-fields { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; }

.profile-field label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.profile-field input,
.profile-field textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
  resize: none;
}

.profile-field input:focus,
.profile-field textarea:focus { border-color: var(--border2); }
.profile-field input[readonly] { color: var(--text-muted); cursor: default; }

.profile-actions { padding: 0 20px 20px; display: flex; gap: 8px; }

.btn-primary {
  flex: 1;
  padding: 9px 0;
  background: var(--accent);
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}

.btn-primary:hover { background: var(--accent-hover); }

.btn-secondary {
  padding: 9px 16px;
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}

.btn-secondary:hover { background: var(--surface2); }

/* REQUESTS MODAL */
#requests-modal .modal { max-width: 420px; }

.req-tabs { display: flex; border-bottom: 1px solid var(--border); }

.req-tab {
  flex: 1;
  padding: 10px 0;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-dim);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}

.req-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.requests-list {
  padding: 8px 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 340px;
  overflow-y: auto;
}

.request-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  border-radius: var(--radius-sm);
  transition: background 0.12s;
}

.request-item:hover { background: var(--surface2); }

.request-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
}

.request-info { flex: 1; min-width: 0; }
.request-name { font-size: 13.5px; font-weight: 500; color: var(--text); }
.request-meta { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
.request-btns { display: flex; gap: 6px; }

.req-accept {
  padding: 5px 12px;
  background: var(--accent);
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: background 0.15s;
}

.req-accept:hover { background: var(--accent-hover); }

.req-decline {
  padding: 5px 10px;
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: 12.5px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: background 0.15s;
}

.req-decline:hover { background: var(--surface2); }

.empty-requests { padding: 40px 20px; text-align: center; color: var(--text-dim); font-size: 13px; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 999;
  display: flex;
  align-items: center;
  gap: 8px;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
.toast.danger .toast-dot { background: var(--danger); }

/* RESPONSIVE */
@media (max-width: 768px) {
  .nav-rail { display: none; }

  .sidebar {
    position: fixed;
    inset: 0;
    width: 100%;
    z-index: 20;
    transform: translateX(0);
    transition: transform 0.25s ease;
  }

  .sidebar.hidden {
    transform: translateX(-100%);
    pointer-events: none;
  }

  .main {
    position: fixed;
    inset: 0;
    width: 100%;
    transform: translateX(100%);
    transition: transform 0.25s ease;
  }

  .main.visible {
    transform: translateX(0);
  }

  .chat-header {
    padding: 0 12px;
  }

  .back-btn {
    display: flex;
  }

  .msg-wrap { max-width: calc(100vw - 80px); }
}

@media (min-width: 769px) {
  .back-btn { display: none !important; }
}
.chat-search-bar {
  display: none;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
}
.chat-search-bar.visible { display: flex; }
.chat-search-bar input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
.chat-search-bar input:focus { border-color: var(--border2); }
.chat-search-bar input::placeholder { color: var(--text-dim); }
.chat-search-nav { display: flex; align-items: center; gap: 4px; }
.chat-search-count { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
.search-highlight {
  background: rgba(91,106,240,0.35);
  border-radius: 2px;
  color: #fff;
}
.msg-row.search-match .msg-bubble { outline: 1px solid var(--accent); outline-offset: 2px; border-radius: 12px; }

/* Flash animation when jumping to a quoted message */
@keyframes msgFlash {
  0%   { background: transparent; }
  20%  { background: rgba(91,106,240,0.18); }
  100% { background: transparent; }
}

.msg-row.flash-highlight {
  border-radius: var(--radius-sm);
  animation: msgFlash 1.1s ease forwards;
}

.sidebar-section-label.search-label { color: var(--accent); }
.contact-item.search-result-item .contact-preview { color: var(--text-muted); }
</style>
</head>

<script>
const API = 'http://127.0.0.1:8000';
let ws;
let currentUsername;
let originalAbout = '';
let activeReqTab = 'incoming';
let requestCount = 0;

// ── SIDEBAR STATE ──
const sidebarMap = new Map();
let sidebarOldestId = 999999999;
let sidebarLoadingMore = false;
let sidebarAllLoaded = false;

// ── TYPING STATE ──
// Map of username -> timeout handle (auto-clear after 3.5s of no pings)
const typingUsers = new Map();

// For outgoing typing pings — track last ping time per chat_id
let lastTypingPing = 0;
const TYPING_THROTTLE = 2500; // send a ping at most every 2.5s (backend TTL is 3s)

// ── REPLY STATE ──
let replyingTo = null; // { id, sender, content }

// ── ACTIVE CHAT STATE ──
let activeChat = null;

const avatarColors = [
  ['#3b4fd4','#c7cbf9'],['#2e7d5e','#a8d5c2'],['#8b3a3a','#f5c2c2'],
  ['#5a3e8a','#d0bbf5'],['#8a5a1a','#f5d8a0'],['#1a5a8a','#a0d4f5'],
];

function getColorIdx(username) {
  let h = 0;
  for (let i = 0; i < username.length; i++) h = (h * 31 + username.charCodeAt(i)) & 0xfffffff;
  return h % avatarColors.length;
}

function initials(name) { return (name || '??').slice(0, 2).toUpperCase(); }

function formatTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr.endsWith('Z') ? dateStr : dateStr + 'Z');
  const now = new Date();
  const diffMin = Math.floor((now - d) / 60000);
  if (diffMin < 1) return 'now';
  if (diffMin < 60) return `${diffMin}m`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return `${diffH}h`;
  const diffD = Math.floor(diffH / 24);
  if (diffD === 1) return 'yday';
  if (diffD < 7) return `${diffD}d`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatMsgTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr.endsWith('Z') ? dateStr : dateStr + 'Z');
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatMsgDate(dateStr) {
  if (!dateStr) return 'Today';
  const d = new Date(dateStr.endsWith('Z') ? dateStr : dateStr + 'Z');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const msgDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffD = Math.round((today - msgDay) / 86400000);
  if (diffD === 0) return 'Today';
  if (diffD === 1) return 'Yesterday';
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── TYPING HELPERS ──

function setTyping(username, chat_id) {
  // Clear existing timeout for this user
  if (typingUsers.has(username)) {
    clearTimeout(typingUsers.get(username));
  }
  // Auto-clear after 3.5s (slightly past the 3s Redis TTL)
  const timer = setTimeout(() => clearTyping(username, chat_id), 3500);
  typingUsers.set(username, timer);

  // Update UI
  updateTypingUI(username, chat_id, true);
}

function clearTyping(username, chat_id) {
  if (typingUsers.has(username)) {
    clearTimeout(typingUsers.get(username));
    typingUsers.delete(username);
  }
  updateTypingUI(username, chat_id, false);
}

function updateTypingUI(username, chat_id, isTyping) {
  // 1. Update sidebar preview for that contact
  const entry = sidebarMap.get(chat_id);
  if (entry) {
    const el = document.querySelector(`#sidebar-${chat_id} .contact-preview`);
    if (el) {
      if (isTyping) {
        el.className = 'contact-preview typing-preview';
        el.innerHTML = `<span class="typing-dots-sm"><span></span><span></span><span></span></span> typing…`;
      } else {
        el.className = 'contact-preview';
        const previewPrefix = entry.sender === currentUsername ? 'You: ' : '';
        el.textContent = previewPrefix + (entry.content ? entry.content : '—');
      }
    }
  }

  // 2. Show/hide floating typing pill if this chat is open
  if (activeChat && activeChat.chat_id === chat_id) {
    const pill = document.getElementById('typing-pill');
    const nameEl = document.getElementById('typing-pill-name');
    if (isTyping) {
      nameEl.textContent = username;
      pill.classList.add('visible');
    } else {
      pill.classList.remove('visible');
    }
  }
}

// ── REPLY HELPERS ──

function setReply(msg) {
  replyingTo = msg;
  const bar = document.getElementById('reply-bar');
  const label = document.getElementById('reply-bar-label');
  const preview = document.getElementById('reply-bar-preview');
  label.textContent = msg.sender === currentUsername ? 'Replying to yourself' : `Replying to ${msg.sender}`;
  preview.textContent = msg.content;
  bar.classList.add('visible');
  document.getElementById('msg-input').focus();
}

function clearReply() {
  replyingTo = null;
  document.getElementById('reply-bar').classList.remove('visible');
}

// ── SCROLL TO ORIGINAL MESSAGE (click on reply quote) ──
async function scrollToMsg(msgId) {
  // 1. Try to find it in current DOM
  const el = document.querySelector(`.msg-row[data-id="${msgId}"]`);
  if (el) {
    flashMsg(el);
    return;
  }

  // 2. Not in DOM — load messages around it (same as jumpToMessage)
  if (!activeChat) return;
  const { chat_id } = activeChat;

  const [beforeRes, afterRes] = await Promise.all([
    fetch(`${API}/load_chat/${msgId + 1}/${chat_id}`, { credentials: 'include' }),
    fetch(`${API}/load_chat_after/${msgId - 1}/${chat_id}`, { credentials: 'include' })
  ]);
  const beforeRows = await beforeRes.json();
  const afterRows = await afterRes.json();

  const before = (beforeRows || [])
    .map(r => ({ id: r[0], chat_id: r[1], sender: r[2], content: r[3], sent_at: r[4], replied_to: r[5] ?? null, replied_content: null }))
    .reverse();
  const after = (afterRows || [])
    .map(r => ({ id: r[0], chat_id: r[1], sender: r[2], content: r[3], sent_at: r[4], replied_to: r[5] ?? null, replied_content: null }));

  // Reconstruct the target message from in-memory if possible, else from surrounding fetch
  const allFetched = [...before, ...after];
  const targetRaw = allFetched.find(x => x.id === msgId);
  const matchMsg = targetRaw || { id: msgId, chat_id, sender: '?', content: '…', sent_at: null, replied_to: null, replied_content: null };

  activeChat.messages = [...before, matchMsg, ...after];
  activeChat.oldestId = before.length ? before[0].id : msgId;
  activeChat.hasMore = before.length >= 50;
  activeChat.hasNewer = after.length >= 50;

  renderMessages();

  setTimeout(() => {
    const target = document.querySelector(`.msg-row[data-id="${msgId}"]`);
    if (target) flashMsg(target);
  }, 50);
}

function flashMsg(el) {
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.remove('flash-highlight');
  // Force reflow so animation replays
  void el.offsetWidth;
  el.classList.add('flash-highlight');
  setTimeout(() => el.classList.remove('flash-highlight'), 1200);
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', async () => {
  const sessionRes = await fetch(`${API}/session`, { credentials: 'include' });
  if (!sessionRes.ok) { location.href = './index.html'; return; }

  const meRes = await fetch(`${API}/me`, { credentials: 'include' });
  const me = await meRes.json();
  if (!me) return;

  currentUsername = me.username;
  document.querySelector('.nav-avatar').childNodes[0].textContent = me.username.slice(0, 2).toUpperCase();

  const countRes = await fetch(`${API}/request_notification`, { credentials: 'include' });
  const countData = await countRes.json();
  requestCount = countData.requests_count;
  updateRequestBadge(requestCount);

  await loadSidebar();
  connectWebSocket();

  document.getElementById('contact-list').addEventListener('scroll', onSidebarScroll);

  const params = new URLSearchParams(window.location.search);
  const chatIdFromUrl = params.get('c');
  if (chatIdFromUrl) {
    const tryOpen = () => { if (sidebarMap.has(chatIdFromUrl)) openChat(chatIdFromUrl); };
    tryOpen();
    setTimeout(tryOpen, 400);
  }
});

// ── SIDEBAR LOADING ──
async function loadSidebar() {
  if (sidebarLoadingMore || sidebarAllLoaded) return;
  sidebarLoadingMore = true;
  try {
    const res = await fetch(`${API}/load_sidebar/${sidebarOldestId}`, { credentials: 'include' });
    if (!res.ok) return;
    const rows = await res.json();
    if (!rows || !rows.length) { sidebarAllLoaded = true; return; }

    for (const row of rows) {
      const [username, chat_id, sender, content, sent_at, last_id, unread_count] = row;
      if (!sidebarMap.has(chat_id)) {
        sidebarMap.set(chat_id, {
          username, chat_id, sender, content, sent_at,
          last_id: last_id ?? 0,
          unread_count: unread_count ?? 0,
          colorIdx: getColorIdx(username)
        });
      }
    }

    const validIds = rows.map(r => r[5]).filter(id => id !== null);
    if (validIds.length) sidebarOldestId = Math.min(...validIds);
    if (rows.length < 50) sidebarAllLoaded = true;

    renderSidebar();
  } finally {
    sidebarLoadingMore = false;
  }
}

function onSidebarScroll() {
  const el = document.getElementById('contact-list');
  if (el.scrollTop + el.clientHeight >= el.scrollHeight - 40) loadSidebar();
}

function renderSidebar() {
  const list = document.getElementById('contact-list');
  const sorted = [...sidebarMap.values()].sort((a, b) => (b.last_id || 0) - (a.last_id || 0));

  if (!sorted.length) {
    list.innerHTML = `<div style="padding:24px 12px;text-align:center;color:var(--text-dim);font-size:13px">No conversations yet</div>`;
    return;
  }

  list.innerHTML = sorted.map(c => {
    const [bg, fg] = avatarColors[c.colorIdx];
    const isActive = activeChat && activeChat.chat_id === c.chat_id;
    const isTypingNow = typingUsers.has(c.username);
    const previewPrefix = c.sender === currentUsername ? 'You: ' : '';
    const preview = c.content ? escapeHtml(c.content) : '—';

    let previewHtml;
    if (isTypingNow) {
      previewHtml = `<div class="contact-preview typing-preview"><span class="typing-dots-sm"><span></span><span></span><span></span></span> typing…</div>`;
    } else {
      previewHtml = `<div class="contact-preview">${previewPrefix}${preview}</div>`;
    }

    return `
    <div class="contact-item${isActive ? ' active' : ''}" id="sidebar-${c.chat_id}" onclick="openChat('${c.chat_id}')">
      <div class="contact-avatar" style="background:${bg}20;color:${fg}">${initials(c.username)}</div>
      <div class="contact-info">
        <div class="contact-name">${escapeHtml(c.username)}</div>
        ${previewHtml}
      </div>
      <div class="contact-meta">
        <span class="contact-time">${formatTime(c.sent_at)}</span>
        ${c.unread_count > 0 ? `<span class="unread-badge">${c.unread_count}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

function upsertSidebarEntry(chat_id, username, sender, content, sent_at, msg_id, isIncoming) {
  if (sidebarMap.has(chat_id)) {
    const e = sidebarMap.get(chat_id);
    e.sender = sender;
    e.content = content;
    e.sent_at = sent_at;
    e.last_id = msg_id;
    if (isIncoming && !(activeChat && activeChat.chat_id === chat_id)) {
      e.unread_count = (e.unread_count || 0) + 1;
    }
  } else {
    sidebarMap.set(chat_id, {
      username, chat_id, sender, content, sent_at,
      last_id: msg_id,
      unread_count: isIncoming ? 1 : 0,
      colorIdx: getColorIdx(username)
    });
  }
  renderSidebar();
}

// ── OPEN CHAT ──
async function openChat(chat_id) {
  const entry = sidebarMap.get(chat_id);
  if (!entry) return;
  if (activeChat && activeChat.chat_id === chat_id) return;

  history.pushState({ chat_id }, '', `?c=${chat_id}`);

  activeChat = {
    username: entry.username,
    chat_id,
    colorIdx: entry.colorIdx,
    messages: [],
    oldestId: 999999999,
    hasMore: true,
    hasNewer: false
  };

  // Clear reply state when switching chats
  clearReply();

  entry.unread_count = 0;
  renderSidebar();

  document.getElementById('empty-state').style.display = 'none';
  const ca = document.getElementById('chat-area');
  ca.style.display = 'flex';
  ca.classList.add('visible');

  if (window.innerWidth <= 768) {
    document.querySelector('.sidebar').classList.add('hidden');
    document.querySelector('.main').classList.add('visible');
  }

  const [bg, fg] = avatarColors[entry.colorIdx];
  const avatar = document.getElementById('chat-avatar');
  avatar.textContent = initials(entry.username);
  avatar.style.cssText = `background:${bg}20;color:${fg};width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;`;
  document.getElementById('chat-name').textContent = entry.username;

  // Reset typing pill when switching chats
  const pill = document.getElementById('typing-pill');
  const nameEl = document.getElementById('typing-pill-name');
  pill.classList.remove('visible');
  if (typingUsers.has(entry.username)) {
    nameEl.textContent = entry.username;
    pill.classList.add('visible');
  }

  // Clear messages but keep the typing pill in the DOM
  const area = document.getElementById('messages-area');
  // const pill = document.getElementById('typing-pill');
  Array.from(area.children).forEach(child => { if (child !== pill) child.remove(); });
  await loadMoreMessages();

  // const area = document.getElementById('messages-area');
  area.scrollTop = area.scrollHeight;

  if (activeChat.messages.length) {
    const latestId = activeChat.messages[activeChat.messages.length - 1].id;
    sendReadReceipt(chat_id, latestId);
  }

  document.getElementById('msg-input').focus();
}

// ── LOAD MESSAGES ──
async function loadMoreMessages() {
  if (!activeChat || !activeChat.hasMore) return;
  const { chat_id, oldestId } = activeChat;

  const res = await fetch(`${API}/load_chat/${oldestId}/${chat_id}`, { credentials: 'include' });
  if (!res.ok) return;
  const rows = await res.json();

  if (!rows || !rows.length) {
    activeChat.hasMore = false;
    renderMessages();
    return;
  }

  // rows: [id, chat_id, sender, content, sent_at, replied_to]
  const newMsgs = rows
    .map(r => ({ id: r[0], chat_id: r[1], sender: r[2], content: r[3], sent_at: r[4], replied_to: r[5] ?? null, replied_content: null }))
    .reverse();

  activeChat.messages = [...newMsgs, ...activeChat.messages];
  activeChat.oldestId = rows[rows.length - 1][0];
  if (rows.length < 50) activeChat.hasMore = false;

  renderMessages();
}

async function loadOlderMessages() {
  if (!activeChat || !activeChat.hasMore) return;
  const area = document.getElementById('messages-area');
  const prevHeight = area.scrollHeight;
  await loadMoreMessages();
  area.scrollTop = area.scrollHeight - prevHeight;
}

// ── RENDER MESSAGES ──
function renderMessages(scrollToBottom = false) {
  if (!activeChat) return;
  const area = document.getElementById('messages-area');
  const wasAtBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 60;

  // Build HTML for messages only (pill element stays in DOM separately)
  let html = '';

  if (activeChat.hasMore) {
    html += `<button class="load-more-btn" onclick="loadOlderMessages()">Load older messages</button>`;
  }

  let lastDateLabel = '';
  const [bg, fg] = avatarColors[activeChat.colorIdx];

  for (const m of activeChat.messages) {
    const dateLabel = formatMsgDate(m.sent_at);
    if (dateLabel !== lastDateLabel) {
      html += `<div class="msg-date-divider">${dateLabel}</div>`;
      lastDateLabel = dateLabel;
    }
    const isMine = m.sender === currentUsername;
    const theirAvatar = `<div class="msg-avatar-sm" style="background:${bg}20;color:${fg}">${initials(activeChat.username)}</div>`;

    // Reply quote: look up content from in-memory messages first, then WS echo field
    let replyQuoteHtml = '';
    if (m.replied_to !== null && m.replied_to !== undefined) {
      const quotedMsg = activeChat.messages.find(x => x.id === m.replied_to);
      const quotedContent = quotedMsg ? quotedMsg.content : (m.replied_content || '…');
      const quotedSender = quotedMsg ? quotedMsg.sender : (isMine ? activeChat.username : currentUsername);
      replyQuoteHtml = `
        <div class="reply-quote" onclick="scrollToMsg(${m.replied_to})" title="Jump to original">
          <div class="reply-quote-sender">${escapeHtml(quotedSender)}</div>
          <div class="reply-quote-text">${escapeHtml(String(quotedContent))}</div>
        </div>`;
    }

    const safeContent = m.content.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
    const safeSender = m.sender.replace(/'/g,"\\'");

    html += `
    <div class="msg-row ${isMine ? 'mine' : ''}" data-id="${m.id}">
      ${!isMine ? theirAvatar : ''}
      <div class="msg-wrap">
        <button class="reply-btn" onclick="setReply({id:${m.id},sender:'${safeSender}',content:'${safeContent}'})" title="Reply">
          <svg viewBox="0 0 14 14" fill="none"><path d="M1 5h8a4 4 0 0 1 0 8H6M1 5l3-3M1 5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        ${replyQuoteHtml}
        <div class="msg-bubble">${escapeHtml(m.content)}</div>
        <div class="msg-time">${formatMsgTime(m.sent_at)}</div>
      </div>
    </div>`;
  }

  if (!activeChat.messages.length && !activeChat.hasMore) {
    html = `<div style="text-align:center;color:var(--text-dim);font-size:13px;margin-top:40px">No messages yet. Say hi!</div>`;
  }

  if (activeChat.hasNewer) {
    html += `<button class="load-more-btn" onclick="loadNewerMessages()">Load newer messages</button>`;
  }

  // Preserve the typing pill — remove all non-pill children, then insert new ones before it
  const pill = document.getElementById('typing-pill');
  // Remove everything except the pill
  Array.from(area.children).forEach(child => {
    if (child !== pill) child.remove();
  });
  // Insert new HTML before the pill
  pill.insertAdjacentHTML('beforebegin', html);

  if (scrollToBottom || wasAtBottom) {
    area.scrollTop = area.scrollHeight;
  }
}

async function loadNewerMessages() {
  if (!activeChat || !activeChat.hasNewer) return;
  const { chat_id, messages } = activeChat;
  const newestId = messages[messages.length - 1].id;

  const res = await fetch(`${API}/load_chat_after/${newestId}/${chat_id}`, { credentials: 'include' });
  if (!res.ok) return;
  const rows = await res.json();
  if (!rows || !rows.length) { activeChat.hasNewer = false; renderMessages(); return; }

  const newMsgs = rows.map(r => ({ id: r[0], chat_id: r[1], sender: r[2], content: r[3], sent_at: r[4], replied_to: r[5] ?? null, replied_content: null }));
  const area = document.getElementById('messages-area');
  const prevDistFromBottom = area.scrollHeight - area.scrollTop - area.clientHeight;

  activeChat.messages = [...activeChat.messages, ...newMsgs];
  if (newMsgs.length < 50) activeChat.hasNewer = false;

  renderMessages();
  area.scrollTop = area.scrollHeight - area.clientHeight - prevDistFromBottom;
}

document.getElementById('messages-area').addEventListener('scroll', function () {
  if (this.scrollTop < 40 && activeChat?.hasMore) loadOlderMessages();
  if (this.scrollHeight - this.scrollTop - this.clientHeight < 40 && activeChat?.hasNewer) loadNewerMessages();
});

// ── SEND MESSAGE ──
function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !activeChat || !ws || ws.readyState !== WebSocket.OPEN) return;

  const payload = {
    type: 'send_message',
    chat_id: activeChat.chat_id,
    username: activeChat.username,
    content: text
  };

  if (replyingTo) {
    payload.replied_to = replyingTo.id;
  }

  ws.send(JSON.stringify(payload));

  input.value = '';
  input.style.height = 'auto';
  clearReply();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

// ── OUTGOING TYPING PINGS ──
function onMsgInput(e) {
  // Auto-resize textarea
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 100) + 'px';

  // Send typing ping — throttled so we only ping every 2.5s while they keep typing.
  // The backend stores a Redis key with 3s TTL, so as long as pings keep coming
  // the key stays alive, keeping the indicator visible. When they stop typing,
  // no more pings → key expires after 3s → frontend auto-clears after 3.5s.
  if (!activeChat || !ws || ws.readyState !== WebSocket.OPEN) return;
  const now = Date.now();
  if (now - lastTypingPing < TYPING_THROTTLE) return;
  lastTypingPing = now;

  ws.send(JSON.stringify({
    type: 'typing',
    username: activeChat.username,
    chat_id: activeChat.chat_id
  }));
}

// ── READ RECEIPT ──
function sendReadReceipt(chat_id, msg_id) {
  if (!ws || ws.readyState !== WebSocket.OPEN || !msg_id) return;
  ws.send(JSON.stringify({ type: 'update_read_receipt', id: msg_id, chat_id }));
}

// ── WEBSOCKET ──
function connectWebSocket() {
  ws = new WebSocket(`ws://127.0.0.1:8000/pulse`);

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === 'sent_message') {
      const newMsg = {
        id: msg.id || Date.now(),
        chat_id: msg.chat_id,
        sender: msg.sender,
        content: msg.content,
        sent_at: msg.sent_at,
        replied_to: msg.replied_to ?? null,
        // For own sent messages the backend echoes replied_content
        replied_content: msg.replied_content ?? null
      };
      if (activeChat && activeChat.chat_id === msg.chat_id) {
        activeChat.messages.push(newMsg);
        renderMessages(true);
        sendReadReceipt(msg.chat_id, newMsg.id);
      }
      const entry = sidebarMap.get(msg.chat_id);
      upsertSidebarEntry(msg.chat_id, entry ? entry.username : activeChat?.username, msg.sender, msg.content, msg.sent_at, newMsg.id, false);
    }

    if (msg.type === 'receive_message') {
      const newMsg = {
        id: msg.id || Date.now(),
        chat_id: msg.chat_id,
        sender: msg.sender,
        content: msg.content,
        sent_at: msg.sent_at,
        replied_to: msg.replied_to ?? null,
        replied_content: msg.replied_content ?? null
      };
      if (activeChat && activeChat.chat_id === msg.chat_id) {
        // Clear their typing indicator since they sent a message
        clearTyping(msg.sender, msg.chat_id);
        activeChat.messages.push(newMsg);
        renderMessages(true);
        sendReadReceipt(msg.chat_id, newMsg.id);
      }
      upsertSidebarEntry(msg.chat_id, msg.sender, msg.sender, msg.content, msg.sent_at, newMsg.id, true);
    }

    if (msg.type === 'updated_read_receipt') {
      if (sidebarMap.has(msg.chat_id)) {
        sidebarMap.get(msg.chat_id).unread_count = 0;
        renderSidebar();
      }
    }

    // ── INCOMING TYPING ──
    if (msg.type === 'typing') {
      // msg.username = who is typing, msg.chat_id = which chat
      setTyping(msg.username, msg.chat_id);
    }

    if (msg.type === 'request_receive') {
      requestCount++;
      updateRequestBadge(requestCount);
      const modalOpen = document.getElementById('requests-modal').classList.contains('open');
      if (modalOpen && activeReqTab === 'incoming') switchReqTab('incoming');
    }

    if (msg.type === 'request_send') {
      if (msg.reason === 'success') {
        showReqFeedback('Request sent!', true);
        const modalOpen = document.getElementById('requests-modal').classList.contains('open');
        if (modalOpen && activeReqTab === 'outgoing') switchReqTab('outgoing');
      } else if (msg.reason === 'request_exists') showReqFeedback('Request already sent', false);
      else if (msg.reason === 'already_friend')   showReqFeedback('Already friends', false);
      else if (msg.reason === 'user_no_exist')    showReqFeedback('User not found', false);
      else if (msg.reason === 'request_from_user_exists') showReqFeedback('This user already sent you a request', false);
    }

    if (msg.type === 'request') {
      const modalOpen = document.getElementById('requests-modal').classList.contains('open');
      if (msg.status === 'accepted') {
        showToast(`${msg.username} accepted your request!`);
        if (modalOpen && activeReqTab === 'outgoing') switchReqTab('outgoing');
        sidebarAllLoaded = false;
        sidebarOldestId = 999999999;
        sidebarMap.clear();
        loadSidebar();
      } else if (msg.status === 'rejected') {
        showToast(`${msg.username} declined your request`, true);
        if (modalOpen && activeReqTab === 'outgoing') switchReqTab('outgoing');
      }
    }

    if (msg.type === 'request_takeback') {
      if (!msg.req_detail) return;
      const [id, username] = msg.req_detail;
      document.getElementById(`req-${id}`)?.remove();
      if (username !== currentUsername) {
        requestCount = Math.max(0, requestCount - 1);
        updateRequestBadge(requestCount);
      }
      if (!document.querySelectorAll('#requests-list .request-item').length) {
        document.getElementById('requests-list').innerHTML =
          `<div class="empty-requests">No ${activeReqTab} requests</div>`;
      }
    }
  };

  ws.onclose = () => setTimeout(() => connectWebSocket(), 3000);
}

document.getElementById('profile-about').addEventListener('input', function () {

async function logout() {
  await fetch(`${API}/logout`, { credentials: 'include' });

}

// ── REQUESTS ──
async function openRequests() {
  document.getElementById('requests-modal').classList.add('open');
  switchReqTab('incoming');
}

async function switchReqTab(tab) {
  activeReqTab = tab;
  document.getElementById('tab-incoming').classList.toggle('active', tab === 'incoming');
  document.getElementById('tab-outgoing').classList.toggle('active', tab === 'outgoing');
  const endpoint = tab === 'incoming' ? 'requests_list' : 'requests_list_outgoing';
  const res = await fetch(`${API}/${endpoint}`, { credentials: 'include' });
  const data = await res.json();
  renderRequests(data, tab);
}

function renderRequests(data, tab) {
  const list = document.getElementById('requests-list');
  if (!data || !data.length) { list.innerHTML = `<div class="empty-requests">No ${tab} requests</div>`; return; }
  list.innerHTML = data.map((r, i) => {
    const [bg, fg] = avatarColors[i % avatarColors.length];
    const displayName = r[1];
    const date = 'Sent on ' + new Date(r[2]).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    return `
    <div class="request-item" id="req-${r[0]}">
      <div class="request-avatar" style="background:${bg}20;color:${fg}">${displayName.slice(0, 2).toUpperCase()}</div>
      <div class="request-info">
        <div class="request-name">${escapeHtml(displayName)}</div>
        <div class="request-meta">${date}</div>
      </div>
      <div class="request-btns">
        ${tab === 'incoming' ? `
          <button class="req-accept" onclick="acceptReq(${r[0]}, '${displayName}')">Accept</button>
          <button class="req-decline" onclick="declineReq(${r[0]}, '${displayName}')">Decline</button>
        ` : `
          <button class="req-decline" onclick="takebackReq(${r[0]}, '${displayName}')">Cancel</button>
        `}
      </div>
    </div>`;
  }).join('');
}

function acceptReq(id, senderUsername) {
  ws.send(JSON.stringify({ type: 'request', id, username: senderUsername, status: 'accept' }));
  document.getElementById(`req-${id}`)?.remove();
  requestCount = Math.max(0, requestCount - 1);
  updateRequestBadge(requestCount);
  if (!document.querySelectorAll('#requests-list .request-item').length)
    document.getElementById('requests-list').innerHTML = `<div class="empty-requests">No incoming requests</div>`;
}

function declineReq(id, username) {
  ws.send(JSON.stringify({ type: 'request', id, username, status: 'decline' }));
  document.getElementById(`req-${id}`)?.remove();
  requestCount = Math.max(0, requestCount - 1);
  updateRequestBadge(requestCount);
  if (!document.querySelectorAll('#requests-list .request-item').length)
    document.getElementById('requests-list').innerHTML = `<div class="empty-requests">No ${activeReqTab} requests</div>`;
}

function takebackReq(id, username) {
  ws.send(JSON.stringify({ type: 'request_takeback', id, username }));
  document.getElementById(`req-${id}`)?.remove();
  if (!document.querySelectorAll('#requests-list .request-item').length)
    document.getElementById('requests-list').innerHTML = `<div class="empty-requests">No ${activeReqTab} requests</div>`;
}

function sendRequest() {
  const input = document.getElementById('send-req-input');
  const username = input.value.trim();
  if (!username || !ws) return;
  ws.send(JSON.stringify({ type: 'request_send', username }));
}

function showReqFeedback(msg, ok) {
  const fb = document.getElementById('send-req-feedback');
  const input = document.getElementById('send-req-input');
  fb.textContent = msg;
  fb.style.display = 'block';
  fb.style.color = ok ? 'var(--success)' : 'var(--danger)';
  input.style.borderColor = ok ? 'rgba(76,175,138,0.5)' : 'rgba(224,92,92,0.5)';
  setTimeout(() => {
    fb.style.display = 'none';
    input.style.borderColor = '';
    if (ok) input.value = '';
  }, 3000);
}

// ── BADGE ──
function updateRequestBadge(count) {
  const badge = document.getElementById('nav-badge');
  if (count > 0) {
    badge.textContent = count > 99 ? '99+' : count;
    badge.style.cssText = `display:unset;width:auto;min-width:16px;height:16px;border-radius:8px;font-size:9px;font-weight:600;color:#fff;padding:0 4px;top:4px;right:4px;background:var(--danger);border:2px solid var(--surface);position:absolute;`;
  } else {
    badge.textContent = '';
    badge.style.cssText = `display:none;`;
  }
}

// ── SIDEBAR SEARCH ──
let sidebarSearchTimer = null;

function onSidebarSearch(value) {
  clearTimeout(sidebarSearchTimer);
  const q = value.trim();

  if (!q) {
    document.querySelector('.sidebar-section-label').textContent = 'Recent';
    renderSidebar();
    return;
  }

  sidebarSearchTimer = setTimeout(async () => {
    const res = await fetch(`${API}/search_sidebar/${encodeURIComponent(q)}`, { credentials: 'include' });
    if (!res.ok) return;
    const results = await res.json();

    const label = document.querySelector('.sidebar-section-label');
    label.textContent = 'Results';

    const list = document.getElementById('contact-list');
    if (!results || !results.length) {
      list.innerHTML = `<div style="padding:24px 12px;text-align:center;color:var(--text-dim);font-size:13px">No users found</div>`;
      return;
    }

    list.innerHTML = results.map(r => {
      const username = r[0];
      const colorIdx = getColorIdx(username);
      const [bg, fg] = avatarColors[colorIdx];
      const existing = [...sidebarMap.values()].find(e => e.username === username);
      const chat_id = existing ? existing.chat_id : null;
      const isActive = activeChat && existing && activeChat.chat_id === existing.chat_id;
      return `
      <div class="contact-item search-result-item${isActive ? ' active' : ''}"
           onclick="${chat_id ? `openChat('${chat_id}')` : ''}">
        <div class="contact-avatar" style="background:${bg}20;color:${fg}">${initials(username)}</div>
        <div class="contact-info">
          <div class="contact-name">${escapeHtml(username)}</div>
        </div>
      </div>`;
    }).join('');
  }, 300);
}

// ── CHAT SEARCH ──
let chatSearchResults = [];
let chatSearchIdx = 0;
let chatSearchTimer = null;
let chatSearchOldestId = 999999999;

function toggleChatSearch() {
  if (!activeChat) return;
  const bar = document.getElementById('chat-search-bar');
  const isVisible = bar.classList.contains('visible');
  if (isVisible) {
    closeChatSearch();
  } else {
    bar.classList.add('visible');
    document.getElementById('chat-search-input').focus();
  }
}

function closeChatSearch() {
  document.getElementById('chat-search-bar').classList.remove('visible');
  document.getElementById('chat-search-input').value = '';
  document.getElementById('chat-search-count').textContent = '';
  chatSearchResults = [];
  chatSearchIdx = 0;
  chatSearchOldestId = 999999999;
  document.querySelectorAll('.msg-row.search-match').forEach(el => el.classList.remove('search-match'));
}

function onChatSearch(value) {
  clearTimeout(chatSearchTimer);
  const q = value.trim();
  if (!q) {
    document.getElementById('chat-search-count').textContent = '';
    chatSearchResults = [];
    document.querySelectorAll('.msg-row.search-match').forEach(el => el.classList.remove('search-match'));
    return;
  }
  chatSearchTimer = setTimeout(() => runChatSearch(q), 350);
}

async function runChatSearch(q) {
  if (!activeChat) return;
  chatSearchOldestId = 999999999;
  chatSearchResults = [];
  chatSearchIdx = 0;

  const res = await fetch(`${API}/search_chat/${activeChat.chat_id}/${encodeURIComponent(q)}/${chatSearchOldestId}`, { credentials: 'include' });
  if (!res.ok) return;
  const rows = await res.json();

  if (!rows || !rows.length) {
    document.getElementById('chat-search-count').textContent = 'No results';
    return;
  }

  chatSearchResults = rows.map(r => ({ id: r[0], sender: r[1], content: r[2], sent_at: r[3] }));
  chatSearchIdx = 0;
  updateChatSearchCount();
  scrollToSearchResult(chatSearchIdx);
}

function chatSearchStep(dir) {
  if (!chatSearchResults.length) return;
  chatSearchIdx = (chatSearchIdx + dir + chatSearchResults.length) % chatSearchResults.length;
  updateChatSearchCount();
  scrollToSearchResult(chatSearchIdx);
}

function chatSearchKey(e) {
  if (e.key === 'Enter') { e.shiftKey ? chatSearchStep(-1) : chatSearchStep(1); }
  if (e.key === 'Escape') closeChatSearch();
}

function updateChatSearchCount() {
  const count = chatSearchResults.length;
  document.getElementById('chat-search-count').textContent =
    count ? `${chatSearchIdx + 1} / ${count}` : 'No results';
}

function scrollToSearchResult(idx) {
  const match = chatSearchResults[idx];
  if (!match) return;

  document.querySelectorAll('.msg-row.search-match').forEach(el => el.classList.remove('search-match'));

  const el = document.querySelector(`.msg-row[data-id="${match.id}"]`);
  if (el) {
    el.classList.add('search-match');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  jumpToMessage(match);
}

async function jumpToMessage(match) {
  if (!activeChat) return;
  const { chat_id } = activeChat;

  const [beforeRes, afterRes] = await Promise.all([
    fetch(`${API}/load_chat/${match.id + 1}/${chat_id}`, { credentials: 'include' }),
    fetch(`${API}/load_chat_after/${match.id - 1}/${chat_id}`, { credentials: 'include' })
  ]);
  const beforeRows = await beforeRes.json();
  const afterRows = await afterRes.json();

  const before = (beforeRows || [])
    .map(r => ({ id: r[0], chat_id: r[1], sender: r[2], content: r[3], sent_at: r[4], replied_to: r[5] ?? null, replied_content: null }))
    .reverse();
  const after = (afterRows || [])
    .map(r => ({ id: r[0], chat_id: r[1], sender: r[2], content: r[3], sent_at: r[4], replied_to: r[5] ?? null, replied_content: null }));

  const matchMsg = { id: match.id, chat_id, sender: match.sender, content: match.content, sent_at: match.sent_at, replied_to: null, replied_content: null };

  activeChat.messages = [...before, matchMsg, ...after];
  activeChat.oldestId = before.length ? before[0].id : match.id;
  activeChat.hasMore = before.length >= 50;
  activeChat.hasNewer = after.length >= 50;

  renderMessages();

  setTimeout(() => {
    const target = document.querySelector(`.msg-row[data-id="${match.id}"]`);
    if (target) {
      target.classList.add('search-match');
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }, 50);
}

function closeChatMobile() {
  document.querySelector('.sidebar').classList.remove('hidden');
  document.querySelector('.main').classList.remove('visible');
  activeChat = null;
  clearReply();
  document.getElementById('typing-pill').classList.remove('visible');
  history.pushState({}, '', window.location.pathname);
}

window.addEventListener('popstate', (e) => {
  const chat_id = e.state?.chat_id;
  if (chat_id && sidebarMap.has(chat_id)) {
    openChat(chat_id);
  } else {
    activeChat = null;
    clearReply();
    document.getElementById('typing-pill').classList.remove('visible');
    document.getElementById('chat-area').classList.remove('visible');
    document.getElementById('chat-area').style.display = 'none';
    document.getElementById('empty-state').style.display = '';
    if (window.innerWidth <= 768) {
      document.querySelector('.sidebar').classList.remove('hidden');
      document.querySelector('.main').classList.remove('visible');
    }
    renderSidebar();
  }
});

// ── UTILS ──
function setNav(btn) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });
});

function showToast(msg, isDanger = false) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.toggle('danger', isDanger);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
